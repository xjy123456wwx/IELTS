olor:#aa583a}.workspace{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(260px,1fr);gap:24px;margin:24px 0}.help{border-left:1px solid var(--line);padding-left:24px}.help .en{font-size:16px}.help .logic{font-size:13px}.ratings{display:flex;gap:8px;flex-wrap:wrap}.ratings button.selected{background:var(--green)}#wordcount.low{color:var(--warm)}footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:36px;padding:20px 0}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:10px;padding:10px 18px;opacity:0;pointer-events:none;z-index:100}#toast.show{opacity:1}.source-links{line-height:2.2;font-size:13px}.source-links a{margin-right:20px}@media(min-width:1600px){main{padding-left:60px;padding-right:60px}}@media(max-width:1100px){aside{width:224px;padding:30px 18px}main{margin-left:224px;padding:24px}.brand{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.paragraph{grid-template-columns:95px minmax(0,1fr)}}@media(max-width:750px){aside{position:static;width:100%;height:auto;padding:18px 20px}.sub,.sidefoot{display:none}nav{display:flex;gap:5px;overflow:auto;margin-top:15px}nav a{white-space:nowrap;padding:8px 12px;font-size:12px}nav a span{display:none}main{margin:0;padding:18px}header>span{display:none}header{justify-content:flex-end}h1{font-size:30px}.hero{padding-top:25px}.grid,.modules,.workspace,.topicgrid{grid-template-columns:1fr}.stats{gap:18px;font-size:11px}.stats strong{display:block;font-size:25px}.paragraph{display:block;padding:19px}.paragraph .label{margin-bottom:8px}.framehead{padding:20px;flex-wrap:wrap}.sectionbar{align-items:flex-start}.steps{gap:10px}.help{border-left:0;border-top:1px solid var(--line);padding:18px 0 0}.topic>summary{align-items:flex-start}.topic .content{padding:18px}dialog{padding:20px}.toolbar{gap:7px}.toolbar button{padding:7px 11px;font-size:12px}#clock{margin-left:0}.chartfull{max-height:430px}.sourcebook .toolbar{align-items:flex-start;flex-wrap:wrap}}@media print{aside,header,footer,button,.button,.filter,.tabs{display:none!important}main{margin:0;padding:0}dialog{position:static;width:100%;max-height:none;overflow:visible}dialog::backdrop{display:none}.workspace{display:block}textarea{border:0}.help{display:none}}

<body><aside><a href="#today" class="brand"><span>写</span> 反复记忆</a><p class="sub">MY WRITING NOTEBOOK</p><nav aria-label="主要栏目"><a href="#today" data-nav="today">开始复习 <span>01</span></a><a href="#task2" data-nav="task2">大作文 · 一套框架 <span>02</span></a><a href="#task1" data-nav="task1">小作文 · 模板速查 <span>03</span></a><a href="#topics" data-nav="topics">题目思路与关键词 <span>04</span></a><a href="#words" data-nav="words">我的好词好句 <span>05</span></a><a href="#sources" data-nav="sources">整理说明与纠错 <span>06</span></a></nav><div class="sidefoot"><p>记住结构，灵活表达。</p><small>你的个人记忆册<br>模板与关键词，反复回忆。</small><a href="https://ielts-speaking-study-nov01.spunkytang4.chatgpt.site/" target="_blank" rel="noopener">打开口语练习册 ↗</a></div></aside>
<main><header><span>七份资料，整理成你能用的写法。</span><div><button id="export">导出复习备份</button><label class="button">导入备份<input type="file" accept="application/json" id="import" hidden></label></div></header><div id="app"></div><footer>熟练度、关键词与笔记保存在当前浏览器。换设备前请导出备份。推荐写法是整理后的练习版本；完整原资料只在E盘保留。</footer></main>
<dialog id="practice"><div class="modalhead"><span id="practice-kind" class="eyebrow"></span><button id="close" aria-label="关闭记忆卡">关闭 ✕</button></div><h2 id="practice-title"></h2><p id="practice-question" class="en"></p><p id="practice-note" class="muted"></p><div id="practice-image"></div><div class="workspace"><div><h3>我的思路与关键词</h3><textarea id="outline" rows="6" placeholder="记下你的提示词：题型要求、每段核心意思、关键搭配。用少量中文或英文帮自己回忆即可。"></textarea><p id="savehint" class="muted" role="status">输入后自动保存。</p></div><div class="help"><button id="reveal" class="primary">查看模板与记忆提示</button><div id="practice-help" hidden></div></div></div><details><summary>回忆后自查</summary><div id="checklist"></div></details><label class="smalllabel">这次要巩固的地方<textarea id="notes" rows="2" placeholder="例如：记住by后接什么；利弊题需要比较；这个词伙还不熟。"></textarea></label><div class="ratings"><button data-rate="new">还需复习</button><button data-rate="learning">看提示能回忆</button><button data-rate="ready">能独立回忆</button><button id="download-draft">下载这张记忆卡</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div><script>window.WRITING_DATA={"principles": ["框架句简洁，主题表达有精度。", "保留能准确使用、反复迁移的复杂句。", "删减抽象空话，解释具体的因果关系。"], "sources": [{"id": 1, "name": "大小作文急救模板.pdf", "role": "主框架与九种主体段功能", "coverage": "提取大作文四段任务、题型差异与十种主体段功能；简化生硬的框架句，并补充具体因果机制。小作文部分仅保留适用的模板。"}, {"id": 2, "name": "2、小作文表达速成+语料积累.pdf", "role": "小作文表达补充与句型条件", "coverage": "提取动态图、静态图、地图和流程的句型、搭配及使用条件；去掉不适用的混用表达和固定分数承诺。"}, {"id": 3, "name": "雅思小作文.docx", "role": "你熟悉的小作文课堂主线", "coverage": "保留你熟悉的五种变化句型、比例、比较、地图和流程写法；去重咖啡范文，并修正明显搭配、年份和语法问题。不建立原题练习库。"}, {"id": 4, "name": "雅思大作文.docx", "role": "你自己的利弊型起点", "coverage": "以你熟悉的利弊型为起点，保留观点、解释、举例、让步的思路，换成自然的书面表达。"}, {"id": 5, "name": "雅思写作25题串讲笔记(1).pptx", "role": "25道题的审题、观点与词伙", "coverage": "按25道题的实际问法整理成思路卡，把中文机制和英文词伙放在一起；限制绝对化推断，不把来源立场当唯一答案。"}, {"id": 6, "name": "雅思写作逻辑链(1).xlsx", "role": "题目变体与逻辑链补充", "coverage": "保留19道补充题与逻辑链；按题干修正部分题型标签，不按预测分值排序。最后四行按同一进口商品题处理。"}, {"id": 7, "name": "雅思大作文分类核心词汇.pdf", "role": "选用词伙补充，不增加整本背诵任务", "coverage": "98页词表抽样查看7页，只选6个可迁移搭配；例句重新编写，未对整本逐词审核。不增加整本背诵任务。"}], "types": [{"id": "agree", "title": "同意与否", "ask": "To what extent do you agree or disagree?", "focus": "先确定同意、不同意或部分同意；每段都服务于这个立场。", "intro": "Some people argue that [题干主张]. I agree with this view because [理由一] and [理由二].", "body": ["解释支持自己立场的理由一；可以指出对谁、通过什么方式产生影响。", "解释理由二。也可以承认反方一点，再说明它为何不改变你的判断。"], "end": "In conclusion, I agree that [立场], mainly because [概括理由].", "warning": "让步不是必写。部分同意要说明同意的范围；不要在开头说完全同意、结尾改成折中。", "stance": "I agree / disagree / partly agree"}, {"id": "discuss", "title": "讨论双方观点", "ask": "Discuss both views and give your own opinion.", "focus": "双方都要解释，自己的看法必须明确；反方也需要真实论证。", "intro": "Some people believe that [观点A], while others argue that [观点B]. Although [A的合理之处], I believe that [自己的立场].", "body": ["On the one hand, [观点A] can be justified because [理由]. 解释为什么有人支持A。", "On the other hand, [观点B] may be preferable because [理由]. 解释B并说明自己的判断。"], "end": "In conclusion, while [A的合理之处], I consider [B或组合方案] to be more appropriate because [判断依据].", "warning": "不能把反方只写成一句让步。组合立场也可成立，但要说明如何组合。", "stance": ""}, {"id": "outweigh", "title": "利弊比较", "ask": "Do the advantages outweigh the disadvantages?", "focus": "写双方，并比较重要性、影响范围、持续时间或可补救程度。", "intro": "Although [现象] has some drawbacks, I believe that its benefits are more significant.", "body": ["承认一个具体弊端，解释影响；如主张能缓解，需要解释缓解办法。", "解释更重要的好处，并说明为什么它超过前面的弊端。"], "end": "In conclusion, the benefits of [现象] outweigh its drawbacks because [比较依据].", "warning": "写了两条好处、一条坏处并不等于完成比较。可以反过来主张弊大于利。", "stance": "benefits outweigh drawbacks / drawbacks outweigh benefits"}, {"id": "development", "title": "积极或消极发展", "ask": "Is this a positive or negative development?", "focus": "评价题目中准确的变化，注意“增加”“取代”等限定词。", "intro": "The growing trend towards [变化] has both benefits and drawbacks. On balance, I consider it a [positive / negative] development.", "body": ["解释与总体判断相反的一面，或一个主要影响。", "解释支持总体判断的主要影响，说明它为什么更值得重视。"], "end": "Overall, I consider this a [positive / negative] development, as [主要判断依据].", "warning": "写网购取代实体店，要评价取代的后果；不能只说网购方便。双面写法是默认练法，不是硬性段落比例。", "stance": ""}, {"id": "causes", "title": "原因与措施", "ask": "What are the causes? What measures could be taken?", "focus": "原因解释现象如何形成；措施说明谁做什么、为何有用。", "intro": "[改写现象]. This problem is mainly caused by [原因概括], and it could be addressed through [措施概括].", "body": ["One major reason for [问题] is [原因]. 解释原因如何导致题目中的问题。", "To address this problem, [主体] could [措施]. 解释如何减轻原因或其后果。"], "end": "In conclusion, [问题] largely results from [原因], and [措施] could help reduce it.", "warning": "题目没问是否同意，就不必硬加I agree。原因与措施最好有联系；不同原因可以共用一个措施。", "stance": ""}, {"id": "two", "title": "双问题 / 混合题", "ask": "Why is this happening? Is it positive or negative? / What problems and solutions?", "focus": "读完整两个问题，两个主体段分别回答；开头直接概括两个答案。", "intro": "[改写现象]. This is mainly due to [问题一的回答], and I believe that [问题二的回答].", "body": ["回答第一个问题：原因、问题、观点等。按问法选择展开模块。", "回答第二个问题：评价、影响、措施等。不要遗漏它。"], "end": "In conclusion, [答案一概括], while [答案二概括].", "warning": "这类题不能固定套“原因+措施”。如果第二问是影响，就写影响；如果要求判断，就明确判断。", "stance": ""}], "modules": [{"id": "benefit1", "title": "个人获益", "intent": "正向1", "cn": "做法 → 具体能力 → 实际结果", "en": "One advantage of [做法] is that it helps [群体] develop [能力]. This enables them to [具体结果].", "example": "One advantage of volunteering is that it helps students develop communication skills. This enables them to work more effectively with people from different backgrounds.", "use": "写清楚什么能力、在哪种场景有用，不停在“长期收益”。", "src": "急救模板 p7–8", "old": "First of all, [核心主题] undoubtedly brings substantial benefits."}, {"id": "benefit2", "title": "减少根源", "intent": "正向2", "cn": "做法 → 降低原因 → 减少问题", "en": "By addressing [原因], [措施] can reduce [问题]. This is particularly useful for [对象], who [具体情况].", "example": "By addressing a lack of job skills, vocational training can reduce barriers to employment. This is particularly useful for young people who have little work experience.", "use": "先有明确原因，再用address；不能把所有好处都称为根治。", "src": "急救模板 p8", "old": ""}, {"id": "benefit3", "title": "直接改善", "intent": "正向3", "cn": "做法 → 改善具体环节 → 近期结果", "en": "[做法] can improve [具体方面] by [方式]. As a result, [直接结果].", "example": "Better public transport can improve access to employment by connecting residential areas with business centres. As a result, people without cars can reach a wider range of jobs.", "use": "结果必须从前一句推出；改善不必一律是长期、可持续。", "src": "急救模板 p8", "old": ""}, {"id": "harm1", "title": "个人负担", "intent": "负向1", "cn": "做法 → 增加负担 → 对生活的影响", "en": "A major drawback is that [做法] may place a [financial / emotional] burden on [群体], particularly those who [条件].", "example": "A major drawback is that unpaid internships may place a financial burden on graduates, particularly those who cannot rely on support from their families.", "use": "may适合可能后果；指出受影响群体，避免必然化。", "src": "急救模板 p9；个人大作文利弊型", "old": ""}, {"id": "harm2", "title": "资源取舍", "intent": "负向2", "cn": "有限资源 → 此项投入 → 另一项受影响", "en": "Spending more on [领域A] may leave fewer resources for [领域B]. This matters because [B为什么重要].", "example": "Spending more on expensive sports facilities may leave fewer resources for public healthcare. This matters because hospitals need stable funding to maintain essential services.", "use": "两项确实竞争同一资源时才用；不能默认所有投资都是资源错配。", "src": "急救模板 p9", "old": ""}, {"id": "concession", "title": "让步与回应", "intent": "让步1", "cn": "承认合理点 → 指出局限 → 回到立场", "en": "Although [合理之处], this does not necessarily mean that [对方结论]. [解释局限或条件].", "example": "Although online courses offer greater flexibility, this does not necessarily mean that they should replace classroom teaching. Some students still need regular feedback and face-to-face support.", "use": "可反驳范围、条件或比较标准，不必总说优点短暂。", "src": "急救模板 p9–10；25题方法论 p4–5", "old": ""}, {"id": "cause1", "title": "缺少条件", "intent": "原因1", "cn": "缺少某条件 → 行为受限 → 问题形成", "en": "One major reason for [问题] is a lack of [具体条件]. Without this, [对象] may find it difficult to [行为].", "example": "One major reason for traffic congestion is a lack of reliable public transport. Without this, commuters may find it difficult to travel to work without using a car.", "use": "明确缺什么，以及它如何导致题目现象。", "src": "急救模板 p10", "old": ""}, {"id": "cause2", "title": "不合适的做法", "intent": "原因2", "cn": "现有做法 → 具体机制 → 问题持续", "en": "Another factor is [原因]. This can encourage [行为], which in turn [结果].", "example": "Another factor is the low price of disposable products. This can encourage people to replace items rather than repair them, which in turn increases household waste.", "use": "用具体因素替代“错误思维方式”；which指代要清楚。", "src": "急救模板 p10–11", "old": ""}, {"id": "solution1", "title": "具体措施", "intent": "方案1", "cn": "谁 → 做什么 → 如何解决 → 条件", "en": "To address [问题], [主体] could [措施]. By [实施方式], this would help [具体结果].", "example": "To address youth unemployment, local authorities could provide practical training. By working with employers, these programmes would help participants develop skills needed in the workplace.", "use": "措施至少说明执行者、动作和机制；不要只写提高意识。", "src": "急救模板 p11", "old": ""}, {"id": "solution2", "title": "共同责任", "intent": "方案2", "cn": "双方不同职责 → 配合 → 结果", "en": "While [主体A] can [职责A], [主体B] should [职责B]. These efforts would [共同结果].", "example": "While governments can improve recycling services, residents should separate their household waste. These efforts would make it easier to reuse valuable materials.", "use": "government和individual不能机械出现在每题；选择真正相关的主体。", "src": "急救模板 p11", "old": ""}, {"id": "example", "title": "假设例子", "intent": "扩展", "cn": "具体的人 → 场景 → 结果", "en": "For example, if [具体情境], [可能结果].", "example": "For example, if students organise a charity event together, they can practise dividing tasks and resolving disagreements.", "use": "标明是例子，解释它如何支持观点；不编造调查机构和百分比。", "src": "急救模板 p16–18；25题 p5", "old": ""}, {"id": "compare", "title": "利弊权衡", "intent": "比较", "cn": "承认代价 → 为什么另一面更重要", "en": "Although [代价] is a concern, [收益] is more significant because [范围 / 持续性 / 重要性].", "example": "Although staff training involves an initial cost, improved workplace safety is more significant because it can protect employees throughout their careers.", "use": "比较需要明确标准；不能只用more significant做结论。", "src": "急救模板利弊型；个人大作文", "old": ""}, {"id": "intro1", "title": "改写题目", "intent": "小作文", "cn": "图表 + 指标 + 对象 + 时间", "en": "The [chart / table] compares [指标] across [对象] in [时间].", "example": "The table compares spending on three categories across five countries in 2002.", "use": "数据图可用shows、illustrates、indicates或demonstrates；确实比较多个对象时用compares。先写指标、对象、地点和时间，不必全部替换成复杂词。", "src": "个人小作文 ¶32–40；表达PDF p5–6", "old": "", "task1group": "data"}, {"id": "over1", "title": "动态概述", "intent": "小作文", "cn": "总体趋势 + 最重要的差异", "en": "Overall, [A] increased, whereas [B] declined. [对象] recorded the greatest change.", "example": "Overall, chicken consumption increased, whereas beef and lamb consumption declined. Fish remained the least consumed category.", "use": "只写图支持的趋势；概述不是固定最高最低两句。", "src": "个人小作文折线图；表达PDF p6–8", "old": "", "task1group": "dynamic"}, {"id": "rise1", "title": "直接描述变化", "intent": "小作文", "cn": "对象 + 变化 + 起终值", "en": "[对象] rose from [A] in [时间一] to [B] in [时间二].", "example": "The proportion rose from 20% in 2000 to 35% in 2020.", "use": "首选准确动词；仅缓慢增加不使用surge。", "src": "个人小作文五个句型；表达PDF p10–11", "old": "", "task1group": "dynamic"}, {"id": "rise2", "title": "名词变化句", "intent": "小作文", "cn": "There was + 变化名词 + in", "en": "There was a [gradual / sharp] increase in [指标], from [A] to [B].", "example": "There was a gradual increase in sales, from 100 units to 150 units.", "use": "与直接法轮换；rise/increase是名词，指标放在in后。", "src": "个人小作文五个句型", "old": "", "task1group": "dynamic"}, {"id": "rise3", "title": "对象作主语", "intent": "小作文", "cn": "对象 + experienced + 变化", "en": "[对象] experienced a [变化名词] over [时间].", "example": "The city experienced a steady rise in population over the period.", "use": "优先选自然主语；数值本身witnessed通常可改为rose。", "src": "个人小作文五个句型", "old": "", "task1group": "dynamic"}, {"id": "rise4", "title": "时间作主语", "intent": "小作文", "cn": "时间段 + saw + 变化", "en": "The period from [时间一] to [时间二] saw a [变化] in [指标].", "example": "The period from 2000 to 2020 saw a substantial increase in car ownership.", "use": "偶尔换句型即可，勿为了换主语让句子变长。", "src": "个人小作文五个句型", "old": "", "task1group": "dynamic"}, {"id": "rise5", "title": "被动变化句", "intent": "小作文", "cn": "变化 + was recorded", "en": "A [变化] in [指标] was recorded between [时间一] and [时间二].", "example": "A slight decline in electricity use was recorded between 2010 and 2015.", "use": "能用，但不必每类五种都背。", "src": "个人小作文五个句型", "old": "", "task1group": "dynamic"}, {"id": "turn", "title": "峰值与转折", "intent": "小作文", "cn": "After doing + 主句", "en": "After peaking at [数值] in [时间], [对象] fell to [数值].", "example": "After peaking at 80 units in 2010, sales fell to 60 units in 2015.", "use": "peaking的主语与后面主句一致。", "src": "表达PDF p2、9–11", "old": "", "task1group": "dynamic"}, {"id": "stable", "title": "平稳与波动", "intent": "小作文", "cn": "在某值保持 / 两值间波动", "en": "[指标] remained stable at [数值] / fluctuated between [A] and [B].", "example": "The figure fluctuated between 40 and 50 units throughout the period.", "use": "明显变化不能称为stable。", "src": "表达PDF p10–11", "old": "", "task1group": "dynamic"}, {"id": "future", "title": "预测数据", "intent": "小作文", "cn": "对象 + is projected to", "en": "[指标] is projected to reach [数值] by [未来时间].", "example": "The proportion of older people is projected to reach about 27% by 2040.", "use": "不能把预测写成已发生事实。", "src": "表达PDF p8–10", "old": "", "task1group": "dynamic"}, {"id": "share", "title": "比例与占据", "intent": "小作文", "cn": "类别 + accounted for + 占比", "en": "[类别] accounted for [比例] of [总量].", "example": "Heating accounted for 42% of household energy use.", "use": "percentages是比例，不把所有人数/单位都写成比例。", "src": "个人小作文静态饼图；表达PDF p14–16", "old": "", "task1group": "static"}, {"id": "rank", "title": "排序与合并", "intent": "小作文", "cn": "最大 + followed by + 次大", "en": "[A] had the highest figure, at [数值], followed by [B], at [数值].", "example": "Food had the highest share, at 40%, followed by housing, at 30%.", "use": "followed by后是名词短语，不是完整句子。", "src": "个人小作文静态图", "old": "", "task1group": "static"}, {"id": "contrast", "title": "两者比较", "intent": "小作文", "cn": "完整句 + while + 完整句", "en": "[A] stood at [数值], while the figure for [B] was [数值].", "example": "The figure for France stood at 70%, while that for Italy was 50%.", "use": "比较同一指标、对应单位；that代替figure。", "src": "个人小作文柱状图；表达PDF p3", "old": "", "task1group": "data"}, {"id": "multiple", "title": "倍数表达", "intent": "小作文", "cn": "A的指标 + twice + B的指标", "en": "The figure for [A] was twice that for [B].", "example": "The figure for men was twice that for women.", "use": "twice是两倍，不是two times more；比例点差和倍数分清。", "src": "个人小作文倍数", "old": "", "task1group": "static"}, {"id": "overmap", "title": "地图概述", "intent": "小作文", "cn": "主要改变 + 保留的特征", "en": "Overall, [地点] became more [图支持的特征], while [特征] remained unchanged.", "example": "Overall, the village expanded considerably, with later development concentrated near the motorway.", "use": "无证据不写modern或commercial；按实际变化替换。", "src": "表达PDF p27–28", "old": "", "task1group": "map"}, {"id": "location", "title": "方位描述", "intent": "小作文", "cn": "设施 + was located + 位置", "en": "[设施] was located [方位] of [参照物].", "example": "The station was located to the south-west of the park.", "use": "区别in the north of内部和to the north of外部相对位置；需有方向依据。", "src": "个人小作文地图词汇", "old": "", "task1group": "map"}, {"id": "replace", "title": "拆除与替换", "intent": "小作文", "cn": "旧设施 + was replaced with + 新设施", "en": "[旧设施] was demolished and replaced with [新设施].", "example": "The warehouse was demolished and replaced with a car park.", "use": "图中没拆除就不要写demolished。", "src": "个人小作文地图；表达PDF p28", "old": "", "task1group": "map"}, {"id": "expand", "title": "扩建与连接", "intent": "小作文", "cn": "设施 + was extended / connected", "en": "[设施] was extended, and [地点A] was connected to [地点B] by [道路].", "example": "The school was extended, and a new road connected it to the residential area.", "use": "道路连接两地用connect A to B。", "src": "个人小作文地图", "old": "", "task1group": "map"}, {"id": "overprocess", "title": "流程概述", "intent": "小作文", "cn": "起终点 / 循环 + 主要阶段", "en": "Overall, the process begins with [起点] and ends with [终点].", "example": "Overall, the process begins with the collection of weather data and ends with forecasts being broadcast to the public.", "use": "循环流程写cycle，分支不要漏掉。", "src": "表达PDF p22–26", "old": "", "task1group": "process"}, {"id": "sequence", "title": "人工流程连接", "intent": "小作文", "cn": "After + 完整句 + 主句", "en": "After [材料] has been [处理], it is [下一步].", "example": "After the bottles have been cleaned, they are sorted by colour.", "use": "代词单复数一致；after后的处理真的先完成。", "src": "个人小作文流程图", "old": "", "task1group": "process"}, {"id": "where", "title": "设备与处理", "intent": "小作文", "cn": "设备 + where + 处理", "en": "[材料] is placed in [设备], where it is [处理].", "example": "The glass is placed in a furnace, where it is heated.", "use": "where指代设备这个地点；不随意指代前面整个过程。", "src": "个人小作文流程图", "old": "", "task1group": "process"}, {"id": "natural", "title": "自然过程", "intent": "小作文", "cn": "条件或动作 + 结果", "en": "As [自然动作], [结果].", "example": "As moist air rises, it cools and forms clouds.", "use": "自然过程主语自己发生动作，常用主动。", "src": "个人小作文雨影沙漠流程", "old": "", "task1group": "process"}, {"id": "vocab-assess", "title": "assess the evidence", "intent": "词伙", "cn": "评估证据", "en": "assess the evidence", "example": "Students should learn to assess the evidence before accepting a claim.", "use": "assess后接需要判断的对象，不是所有think都换成assess。", "src": "分类核心词汇 PDF · p1", "old": ""}, {"id": "vocab-detrimental", "title": "be detrimental to", "intent": "词伙", "cn": "对…有害", "en": "be detrimental to", "example": "Excessive screen time can be detrimental to children’s sleep if it keeps them awake late at night.", "use": "to是介词；说明具体伤害和条件，避免笼统说社会受损。", "src": "分类核心词汇 PDF · p25", "old": ""}, {"id": "vocab-sustain", "title": "sustain local employment", "intent": "词伙", "cn": "维持当地就业", "en": "sustain local employment", "example": "Supporting small businesses can help sustain local employment, particularly in areas with few other job opportunities.", "use": "sustain适合维持已有状态，不是所有improve的替换词。", "src": "分类核心词汇 PDF · p65", "old": ""}, {"id": "vocab-safeguard", "title": "safeguard people’s interests", "intent": "词伙", "cn": "维护人们的利益", "en": "safeguard people’s interests", "example": "Consumer protection rules can safeguard people’s interests by requiring companies to provide accurate product information.", "use": "需要解释保护什么、通过何种方式。", "src": "分类核心词汇 PDF · p85", "old": ""}, {"id": "vocab-regulate", "title": "regulate advertising", "intent": "词伙", "cn": "监管广告", "en": "regulate advertising", "example": "Governments can regulate advertising aimed at children to reduce their exposure to misleading claims.", "use": "规则和机构行为用regulate；个人习惯一般用manage或limit。", "src": "分类核心词汇 PDF · p85", "old": ""}, {"id": "vocab-allround", "title": "support all-round development", "intent": "词伙", "cn": "支持全面发展", "en": "support all-round development", "example": "Combining academic study with practical activities can support students’ all-round development.", "use": "最好接着列出具体能力；不单靠all-round概括。", "src": "分类核心词汇 PDF · p10", "old": ""}, {"id": "mapintro", "title": "地图开头", "intent": "小作文", "task1group": "map", "cn": "地点 + 时间 + 改变", "en": "The maps show changes to [地点] between [时间一] and [时间二].", "example": "The maps show changes to a village between 1780 and 2000.", "use": "若只有一张分期图，用The map shows the development of…；时间信息准确。", "src": "个人小作文与表达PDF综合整理", "old": ""}, {"id": "processintro", "title": "流程开头", "intent": "小作文", "task1group": "process", "cn": "图示 + 如何生产 / 形成", "en": "The diagram illustrates how [产品] is produced / how [现象] forms.", "example": "The diagram illustrates how bricks are produced for construction.", "use": "自然过程用forms，人工生产用is produced；不要两种都塞进句子。", "src": "个人小作文与表达PDF综合整理", "old": ""}, {"id": "staticoverview", "title": "静态概述", "intent": "小作文", "task1group": "static", "cn": "最大份额 + 最小份额", "en": "Overall, [A] accounted for the largest share, while [B] had the smallest.", "example": "Overall, food accounted for the largest share of spending, while leisure had the smallest.", "use": "只适用于份额；人数或绝对值用had the highest figure。", "src": "个人小作文与表达PDF综合整理", "old": ""}, {"id": "respectively", "title": "对应合并", "intent": "小作文", "task1group": "data", "cn": "两项对象 + 两个数值", "en": "The figures for [A] and [B] were [数值A] and [数值B], respectively.", "example": "The figures for France and Italy were 70% and 50%, respectively.", "use": "严格保持对象和数字顺序对应。", "src": "个人小作文与表达PDF综合整理", "old": ""}, {"id": "convert", "title": "用途改变", "intent": "小作文", "task1group": "map", "cn": "原有建筑 + converted into", "en": "The [原建筑] was converted into [新用途].", "example": "The warehouse was converted into a library.", "use": "改用途而建筑仍保留用converted；拆掉再建用replaced或demolished。", "src": "个人小作文与表达PDF综合整理", "old": ""}], "task1": [{"id": "dynamic", "title": "动态数据", "desc": "有两个或更多时间点的折线、柱状、表格、饼图都可以用。", "steps": ["确认对象、时间和单位；区分历史数据与预测。", "找主要趋势、起终点、转折与有意义的交点。", "按相似趋势或对象分组，选择代表性数据。", "开头改写题目；概述突出总体变化；两个主体段支持概述 "paragraph": "Academic qualifications provide a foundation of specialised knowledge, but social skills help people apply that knowledge in a team. For example, an engineer needs to explain technical problems to colleagues who have different backgrounds. Effective communication can therefore improve the quality of joint decisions.", "warning": "区分社交能力和时间管理等其他可迁移技能。", "source": "25题笔记 · 幻灯片7", "sourceId": 5, "sourcePage": 7}, {"id": "classic-2", "title": "大学课外活动", "tag": "教育", "type": "agree", "question": "Full-time university students should take part in activities outside their studies. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "同意，但保持学业与活动的平衡", "logic": ["专业学习 → 掌握基础知识 → 准备未来职业", "适量社团与志愿活动 → 分工合作和实际任务 → 发展可迁移技能"], "words": ["extracurricular activities 课外活动", "transferable skills 可迁移技能", "academic pressure 学业压力"], "paragraph": "Extracurricular activities can help students develop skills that lectures alone may not provide. When students organise a club event, they have to divide tasks, manage a budget and resolve disagreements. These practical experiences can prepare them for teamwork in their future careers, provided that the activities do not interfere with their studies.", "warning": "不要把参加活动说成完全替代学业。", "source": "25题笔记 · 幻灯片8", "sourceId": 5, "sourcePage": 8}, {"id": "classic-3", "title": "国际新闻课程", "tag": "教育", "type": "discuss", "question": "Some people think secondary school students should study international news as a subject, while others consider this a waste of valuable study time. Discuss both views and give your opinion.", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "可纳入适量新闻教育，需控制时间", "logic": ["增加一门课 → 课表更紧 → 可能挤占基础科目的学习", "比较不同国家的新闻 → 认识不同视角 → 培养判断信息的能力"], "words": ["international affairs 国际事务", "evaluate information 评价信息", "core subjects 核心科目"], "paragraph": "Studying international news can help students learn to evaluate information rather than simply accept it. A teacher could ask them to compare reports of the same event from different sources. This would encourage them to recognise different perspectives and question unsupported claims, while also improving their understanding of international affairs.", "warning": "题干若讨论必修课，不能仅把它改成课后选修就算回答双方。", "source": "25题笔记 · 幻灯片9", "sourceId": 5, "sourcePage": 9}, {"id": "classic-4", "title": "网购取代实体店", "tag": "科技", "type": "development", "question": "Online shopping is increasingly replacing shopping in physical stores. Is this a positive or negative development?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "总体消极的可写立场：便利不足以支持完全取代", "logic": ["网购 → 节省出行时间、扩大选择 → 购物更方便", "实体店减少 → 试用商品和当面咨询机会减少 → 部分消费者难以判断质量"], "words": ["physical stores 实体店", "assess product quality 判断商品质量", "consumer choice 消费者选择"], "paragraph": "Physical stores allow customers to assess products before buying them. For example, shoppers can try on shoes and check whether they fit, which is difficult to do online. If local shops disappear, customers who need this kind of direct assessment may have fewer suitable options, even though online shopping is convenient.", "warning": "回应“取代”；网购不必然导致垄断，别把可能后果写成事实。", "source": "25题笔记 · 幻灯片10", "sourceId": 5, "sourcePage": 10}, {"id": "classic-5", "title": "远程教育学位", "tag": "教育 / 科技", "type": "outweigh", "question": "More universities offer degree courses through distance learning rather than classroom teaching. Do the advantages outweigh the disadvantages?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "可写弊大于利，限定需要互动与实践的课程", "logic": ["线上课程 → 不必搬迁、可安排时间 → 工作人士和偏远地区学生更易入学", "反馈与现场实践减少 → 困难未及时解决 → 某些课程学习效果受限"], "words": ["distance learning 远程学习", "equal access to education 教育机会平等", "regular feedback 定期反馈"], "paragraph": "Distance learning can widen access to higher education, especially for people who cannot move to another city. However, some courses depend on supervised practice and immediate feedback. For these subjects, replacing classroom teaching entirely may reduce the support students receive, making the disadvantages more significant than the convenience of studying remotely.", "warning": "在线与课堂比较，不机械转成纸书与屏幕；线上也可以互动。", "source": "25题笔记 · 幻灯片11", "sourceId": 5, "sourcePage": 11}, {"id": "classic-6", "title": "机器完成体力活", "tag": "科技", "type": "outweigh", "question": "Machines are increasingly used to perform difficult physical work. Do the benefits outweigh the drawbacks?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "利大于弊，但承认岗位转型成本", "logic": ["机器替代重复任务 → 部分岗位减少 → 工人需要重新培训", "机器处理危险重物 → 人的暴露减少 → 工伤风险降低"], "words": ["manual labour 体力劳动", "workplace safety 工作场所安全", "retraining 再培训"], "paragraph": "Using machines for dangerous physical tasks can improve workplace safety. In a factory, for example, automated equipment can lift heavy materials that might otherwise injure workers. Although some employees may need retraining, the reduction in serious injuries can provide a lasting benefit, particularly when employers support workers in moving to new roles.", "warning": "不能说机器绝不会造成失业；需要权衡安全收益与就业成本。", "source": "25题笔记 · 幻灯片12", "sourceId": 5, "sourcePage": 12}, {"id": "classic-7", "title": "寻找外星生命与地球问题", "tag": "政府", "type": "discuss", "question": "Some people support government spending on the search for life on other planets, while others think problems on Earth should take priority. Discuss both views and give your opinion.", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "优先紧迫公共需求，仍可保留适度科研", "logic": ["寻找生命 → 科学知识与研究技术 → 长期研究价值", "财政有限 → 更多投入探索意味着其他服务资金减少 → 紧迫需求应先满足"], "words": ["allocate public funds 分配公共资金", "pressing needs 紧迫需求", "scientific research 科学研究"], "paragraph": "Governments need to consider the opportunity cost of expensive research projects. If a country struggles to provide basic healthcare, spending heavily on the search for life on other planets may leave fewer funds for hospitals. Meeting these immediate needs should therefore take priority, while a smaller research budget could preserve long-term scientific work.", "warning": "寻找外星生命不等于所有航天项目，不能直接拿通信卫星替题目论证。", "source": "25题笔记 · 幻灯片13", "sourceId": 5, "sourcePage": 13}, {"id": "classic-8", "title": "保护濒危语言", "tag": "政府 / 文化", "type": "discuss", "question": "Some people think governments should fund the protection of languages spoken by very few people, while others consider this a waste of money. Discuss both views and give your opinion.", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "支持有针对性的保护", "logic": ["资助需要公共资金 → 与基本服务竞争 → 要考虑成本", "语言承载故事和地方知识 → 代际传承 → 保留文化与社区认同"], "words": ["endangered languages 濒危语言", "cultural identity 文化认同", "a sense of belonging 归属感"], "paragraph": "Protecting an endangered language can help preserve knowledge that is closely linked to a community. Local stories, traditions and expressions may be difficult to pass on once younger generations stop using the language. Funding teaching materials and community classes can therefore support cultural continuity without requiring an unlimited public budget.", "warning": "语言消失不必然导致社会冲突；保护方式要具体。", "source": "25题笔记 · 幻灯片14", "sourceId": 5, "sourcePage": 14}, {"id": "classic-9", "title": "国际援助与本国需求", "tag": "政府", "type": "agree", "question": "Governments should help disadvantaged people in other countries rather than focus only on problems at home. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "有条件同意：国内基本需求和有限援助并行", "logic": ["国内职责 → 基础服务须保障 → 援助规模需符合财政能力", "跨国灾害与贫困 → 人道救助及跨境合作 → 减轻迫切困难"], "words": ["international aid 国际援助", "domestic priorities 国内优先事务", "disadvantaged communities 弱势社区"], "paragraph": "A government should protect essential services at home, but this need not prevent all international aid. During a severe disaster, limited support can provide food and medical supplies to affected communities. A carefully planned aid budget can meet urgent humanitarian needs while remaining consistent with a country’s financial capacity.", "warning": "保留题干的rather than或only限制，不笼统说全球化所以一切援助都必要。", "source": "25题笔记 · 幻灯片15", "sourceId": 5, "sourcePage": 15}, {"id": "classic-10", "title": "艺术家由谁资助", "tag": "政府 / 文化", "type": "discuss", "question": "Some people think governments should fund artists, while others believe artists should find other sources of support. Discuss both views and give your opinion.", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "混合资助，公共支持用于市场难维持的艺术", "logic": ["部分艺术受众少 → 票房难覆盖成本 → 文化价值可能被忽略", "商业合作与票房 → 收入来源更多 → 降低对政府依赖"], "words": ["public funding 公共资助", "commercial sponsorship 商业赞助", "cultural diversity 文化多样性"], "paragraph": "Public funding may be justified for art forms that have cultural value but limited commercial appeal. Without some support, small community performances could become difficult to sustain. However, artists can also seek sponsorship or earn income from ticket sales, allowing public funds to focus on activities that the market is unlikely to support.", "warning": "不能说没有政府钱所有艺术家就停止创作。", "source": "25题笔记 · 幻灯片16", "sourceId": 5, "sourcePage": 16}, {"id": "classic-11", "title": "犯罪报道是否应禁止", "tag": "媒体 / 犯罪", "type": "agree", "question": "Detailed reports of crime have harmful effects and should not appear in the media. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "不同意全面禁止，支持限制有害细节", "logic": ["过多作案细节与身份曝光 → 模仿风险、隐私侵害 → 需要规范", "适度报道 → 风险提示和司法监督 → 公共利益"], "words": ["detailed crime reporting 犯罪细节报道", "protect victims’ privacy 保护受害者隐私", "public awareness 公众意识"], "paragraph": "Crime reporting can serve the public interest without revealing every harmful detail. Reports may warn residents about a local risk or expose failures in the justice system. Editors should therefore protect victims’ privacy and avoid unnecessary descriptions of criminal methods, rather than remove all crime reports from the media.", "warning": "区分限制细节与禁止报道，不声称每则报道都会引起犯罪。", "source": "25题笔记 · 幻灯片17", "sourceId": 5, "sourcePage": 17}, {"id": "classic-12", "title": "广告的影响", "tag": "媒体", "type": "development", "question": "People are surrounded by advertisements in everyday life. Is this a positive or negative development?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "可写总体积极，承认监管需求", "logic": ["产品信息 → 比较价格和功能 → 更有依据地选择", "误导宣传 → 购买不需要或不合适产品 → 金钱浪费"], "words": ["make informed choices 作出知情选择", "misleading claims 误导性说法", "consumer protection 消费者保护"], "paragraph": "Advertising can help consumers make informed choices when it provides accurate information. A clear comparison of prices and features allows people to find products that suit their needs. However, misleading claims can undermine this benefit, so the value of advertising depends partly on effective consumer protection and responsible marketing.", "warning": "不要把所有广告都描述为信息充分或便宜。", "source": "25题笔记 · 幻灯片18", "sourceId": 5, "sourcePage": 18}, {"id": "classic-13", "title": "儿童过量屏幕活动", "tag": "科技 / 教育", "type": "agree", "question": "Children spend a great deal of time watching television and playing computer games. Some people believe this has negative effects. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "同意过量使用有害，承认适量娱乐", "logic": ["适量教育节目与游戏 → 学习与放松 → 可有益", "过量使用 → 挤占睡眠、运动、作业 → 日常健康与学习受影响"], "words": ["excessive screen time 过量屏幕时间", "physical activity 身体活动", "academic performance 学业表现"], "paragraph": "Excessive screen time can affect children because it leaves less time for other important activities. If a child stays up late playing games, they may sleep less and struggle to concentrate at school the next day. The concern is therefore the amount and timing of screen use, rather than the existence of games or television itself.", "warning": "题目重点是大量时间；不要把适量的好处当成直接反驳。", "source": "25题笔记 · 幻灯片19", "sourceId": 5, "sourcePage": 19}, {"id": "classic-14", "title": "财政援助与其他援助", "tag": "政府", "type": "agree", "question": "Rich countries should provide other forms of help to poorer countries instead of financial aid. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "部分同意：急救资金与长期技能支持作用不同", "logic": ["灾害或短缺 → 立即采购物资 → 资金救助有时不可替代", "技术与培训 → 本地能力提高 → 长期减少依赖"], "words": ["technical assistance 技术援助", "financial aid 财政援助", "long-term self-reliance 长期自立"], "paragraph": "Technical assistance can support long-term self-reliance by helping local people develop useful skills. Training healthcare workers, for example, may strengthen a country’s ability to provide services after outside experts leave. Nevertheless, financial aid can still be necessary in an emergency, when food and medical supplies are needed immediately.", "warning": "other范围大，但不等于必须无条件赞同；回应instead of。", "source": "25题笔记 · 幻灯片20", "sourceId": 5, "sourcePage": 20}, {"id": "classic-15", "title": "反社会行为的原因与措施", "tag": "犯罪", "type": "causes", "question": "Why do some people behave antisocially or commit crimes? What measures could address this problem?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "先解释具体诱因，再提出相应措施", "logic": ["缺少支持与就业机会 → 困难难解决 → 一部分人更易走向违法行为", "职业培训和家庭支持 → 改善合法选择 → 减轻部分诱因"], "words": ["antisocial behaviour 反社会行为", "vocational training 职业培训", "legitimate employment 合法就业"], "paragraph": "A lack of employment opportunities can contribute to some forms of crime, although it does not explain every offence. Practical training can help people gain skills that employers need, making legitimate work more accessible. This approach should be combined with appropriate law enforcement and support for those facing serious family or personal difficulties.", "warning": "贫困不等于犯罪；措施与机制相关，不保证教育消除全部犯罪。", "source": "25题笔记 · 幻灯片21", "sourceId": 5, "sourcePage": 21}, {"id": "classic-16", "title": "监禁与其他减罪方式", "tag": "犯罪", "type": "discuss", "question": "Some people think longer prison sentences are the best way to reduce crime, while others support alternative measures. Discuss both views and give your opinion.", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "结合监禁与改造，按风险区分", "logic": ["隔离危险罪犯 → 减少服刑期间伤害他人 → 保护公众", "心理辅导与技能培训 → 改善释放后选择 → 降低部分再犯风险"], "words": ["prison sentences 刑期", "rehabilitation 改造", "reduce reoffending 减少再犯"], "paragraph": "Prison can protect the public by keeping dangerous offenders away from potential victims. However, imprisonment alone may not prepare a person for life after release. Education and vocational training can help former prisoners find legitimate work, so rehabilitation should complement punishment rather than simply be treated as its opposite.", "warning": "长期监禁减少服刑期风险，不自动证明释放后不再犯罪。", "source": "25题笔记 · 幻灯片22", "sourceId": 5, "sourcePage": 22}, {"id": "classic-17", "title": "旅行与媒体学习文化", "tag": "文化", "type": "agree", "question": "There is no need to travel to learn about other cultures because books, films and the Internet provide just as much knowledge. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "不同意完全等同，承认媒体便宜可及", "logic": ["书和影像 → 低成本获得背景知识 → 适合初步了解", "当地交流和参加日常活动 → 观察语境与差异 → 获得不同于媒体的理解"], "words": ["first-hand experience 亲身体验", "cultural understanding 文化理解", "interact with local people 与当地人互动"], "paragraph": "Books and films provide useful background knowledge, but travel offers a different kind of cultural learning. Speaking with local people and observing daily routines can reveal how customs are practised in context. These experiences may deepen understanding, although travelling does not automatically make someone well-informed about every aspect of a culture.", "warning": "直接比较获得知识的方式；不要只写旅游放松。", "source": "25题笔记 · 幻灯片23", "sourceId": 5, "sourcePage": 23}, {"id": "classic-18", "title": "老建筑与道路住房", "tag": "文化 / 政府", "type": "agree", "question": "Money spent restoring old buildings should instead be used for new housing and roads. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "不同意全部转移资金，保护有价值建筑", "logic": ["住房道路 → 基本需求和通行 → 有紧迫公共价值", "有历史价值建筑 → 记录地方文化，可合理再利用 → 保留城市特色"], "words": ["historic buildings 历史建筑", "preserve local heritage 保护地方遗产", "adaptive reuse 适应性再利用"], "paragraph": "Some historic buildings preserve features that new construction cannot replace. Restoring them can maintain a city’s connection with its past, while adapting them for public use may give them a practical role. This does not mean every old building deserves unlimited funding, but valuable heritage should be considered alongside housing and transport needs.", "warning": "old不自动等于historic；修复并非必然赚钱。", "source": "25题笔记 · 幻灯片24", "sourceId": 5, "sourcePage": 24}, {"id": "classic-19", "title": "个人在环保中的作用", "tag": "环境", "type": "discuss", "question": "Some people think environmental problems are too large for individuals to solve, while others believe individual participation is essential. Discuss both views and give your opinion.", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "政府行动和个人参与互补", "logic": ["法规与基础设施 → 控制大规模排放 → 政府有不可替代的作用", "消费、分类与集体行动 → 减少浪费并支持制度 → 个人能参与"], "words": ["environmental awareness 环保意识", "disposable products 一次性用品", "collective action 集体行动"], "paragraph": "Individuals cannot build a national recycling system on their own, but they can help it function effectively. Separating household waste makes it easier to recover useful materials, while reducing unnecessary purchases limits waste at its source. These actions are most effective when governments provide suitable infrastructure and clear guidance.", "warning": "意识提高不保证行为改变，要说明可实施的行动。", "source": "25题笔记 · 幻灯片25", "sourceId": 5, "sourcePage": 25}, {"id": "classic-20", "title": "崇拜不良榜样明星", "tag": "媒体 / 教育", "type": "development", "question": "Young people increasingly admire celebrities who do not set a good example. Is this a positive or negative development?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "总体消极：关注不良示范这一限定", "logic": ["某些成就 → 激发努力或公益参与 → 明星可有正面作用", "不加判断模仿不当行为 → 扭曲优先级 → 不利于成长"], "words": ["set a good example 树立好榜样", "critical judgement 批判判断", "role models 榜样"], "paragraph": "Admiring successful people can be motivating, but young people also need to judge the behaviour they see. If fame is treated as proof that every action is acceptable, harmful conduct may be copied without reflection. Parents and teachers can help teenagers distinguish genuine achievement from attention-seeking behaviour, rather than assume that all celebrities are suitable role models.", "warning": "不要说明星永远不受处罚、所有孩子都不愿做科学家。", "source": "25题笔记 · 幻灯片26", "sourceId": 5, "sourcePage": 26}, {"id": "classic-21", "title": "频繁换工作", "tag": "工作", "type": "two", "question": "Why do people change jobs frequently? Is this a positive or negative development?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "原因和评价分开，可写条件性的积极评价", "logic": ["更好薪酬、技能发展或生活变化 → 寻找更合适岗位", "有计划转岗 → 增长技能；过度频繁 → 训练成本与不稳定 → 判断取决于方式"], "words": ["career progression 职业发展", "staff turnover 员工流动", "job satisfaction 工作满意度"], "paragraph": "People may change jobs to gain skills or find better opportunities, especially when their current role offers little room for progression. A planned move can therefore support career development. However, repeated short stays may prevent workers from gaining depth in a role and create additional training costs for employers.", "warning": "原资料建议评价写消极是可选路径；不用为了避免重复强制立场。", "source": "25题笔记 · 幻灯片27", "sourceId": 5, "sourcePage": 27}, {"id": "classic-22", "title": "城乡迁移", "tag": "社会", "type": "two", "question": "Many people move from rural areas to cities. What problems can this cause, and how could they be addressed?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "问题与措施分别写", "logic": ["城市人口增加 → 住房和公共服务需求上升 → 容量不足时服务承压", "改善乡村设施与本地岗位、规划城市住房 → 减轻迁移压力和服务缺口"], "words": ["rural infrastructure 乡村基础设施", "affordable housing 可负担住房", "public services 公共服务"], "paragraph": "Rapid migration can place pressure on urban housing when the supply of homes fails to keep pace with demand. Local authorities could respond by planning affordable housing and improving transport links to surrounding areas. Investment in rural schools, healthcare and employment can also reduce the need for people to move solely to obtain basic services.", "warning": "迁移不必然导致犯罪；要写条件与机制。", "source": "25题笔记 · 幻灯片28", "sourceId": 5, "sourcePage": 28}, {"id": "classic-23", "title": "人口老龄化", "tag": "社会", "type": "development", "question": "The proportion of older people is increasing in many countries. Is this a positive or negative development?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "可写挑战更显著，尊重老年贡献", "logic": ["丰富经验 → 指导与志愿服务 → 社会继续受益", "退休人口增加 → 医疗养老金需求增加 → 制度和照护承压"], "words": ["an ageing population 老龄化人口", "pension systems 养老金制度", "care responsibilities 照护责任"], "paragraph": "An ageing population can increase demand for healthcare and long-term care. If services do not expand accordingly, families may take on more care responsibilities, affecting their time for paid work. Governments therefore need to adapt public services and pension systems, while recognising that older people can continue to contribute valuable experience.", "warning": "不把老年人描述为霸占岗位；人口结构与就业机会关系需解释。", "source": "25题笔记 · 幻灯片29", "sourceId": 5, "sourcePage": 29}, {"id": "classic-24", "title": "每年至少四周年假", "tag": "工作", "type": "agree", "question": "Employers should give employees at least four weeks of annual leave to help them work better. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "同意，假期安排需合理", "logic": ["休息与家庭时间 → 压力恢复 → 专注和满意度改善", "安排轮休与交接 → 避免团队同时缺席 → 减少服务中断"], "words": ["annual leave 年假", "job satisfaction 工作满意度", "staff retention 员工留任"], "paragraph": "Adequate annual leave gives employees time to recover from sustained work pressure. They can spend time with family or rest, which may help them return with better concentration. Employers can reduce disruption by arranging leave at different times and ensuring clear handovers, rather than assuming that all staff will be absent for a continuous month.", "warning": "四周年假不代表必须连续休一个月。", "source": "25题笔记 · 幻灯片30", "sourceId": 5, "sourcePage": 30}, {"id": "classic-25", "title": "提高驾考年龄是否最佳", "tag": "社会", "type": "agree", "question": "The best way to improve road safety is to raise the minimum legal age for driving. To what extent do you agree or disagree?", "questionNote": "按来源中文题意整理的英文练习题，非官方题干逐字转录。", "stance": "可不同意最佳：比较年龄限制与其他办法", "logic": ["较成熟驾驶者 → 某些冒险行为可能减少 → 年龄限制可有益", "危险来自技能、酒驾和道路条件 → 驾考执法与道路设计 → 覆盖更广风险"], "words": ["road safety 道路安全", "driving standards 驾驶标准", "enforce traffic rules 执行交通规则"], "paragraph": "Raising the minimum driving age may reduce some risks, but age alone does not guarantee safe driving. Poor skills, speeding and unsafe road design can affect drivers of different ages. Better training, enforcement and road maintenance may therefore address a wider range of problems, making them important alternatives when deciding which measure is most effective.", "warning": "best要求比较，不意味着自动必须反对。", "source": "25题笔记 · 幻灯片31", "sourceId": 5, "sourcePage": 31}, {"id": "chain-2", "title": "独居或小家庭生活是积极还是消极发展？", "tag": "家庭结构个人化", "type": "development", "question": "独居或小家庭生活是积极还是消极发展？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["独居人数增加 → 单人餐饮和小型住房需求增加 → 商家提供相应服务 → 部分人的日常生活更方便。", "独居且缺少稳定亲友联系 → 生病或失业时支持较少 → 可能更需要社区和公共服务。"], "words": ["独居（live alone）", "小家庭（small family units）", "小户型（small apartments）", "共享服务（shared services）", "社会支持网络（social support network）", "脆弱性（vulnerability）", "福利负担（welfare burden）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第2行", "sourceId": 6}, {"id": "chain-3", "title": "为什么越来越多人独居？对社会有什么影响？", "tag": "家庭结构个人化", "type": "two", "question": "为什么越来越多人独居？对社会有什么影响？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["原因：城市就业机会集中→年轻人迁入大城市→远离原生家庭→独居/小家庭增多。影响：积极：单人消费→小包装/单人餐饮/宠物经济；消极：社区纽带弱→邻里互助减少→孤独感上升。"], "words": ["城市就业机会（urban job opportunities）", "国内迁移（internal migration）", "核心家庭（nuclear family）", "大家庭（extended family）", "单人家庭（single-person household）", "宠物经济（pet economy）", "社区纽带（community ties）", "邻里互助（neighborly mutual aid）"], "paragraph": "", "warning": "原因与影响分别展开；原表把它标为利弊。", "source": "逻辑链表 · 第3行", "sourceId": 6}, {"id": "chain-4", "title": "城市住宅没有户外空间，是积极还是消极发展？", "tag": "家庭结构个人化", "type": "development", "question": "城市住宅没有户外空间，是积极还是消极发展？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["高密度住宅可提高土地利用率；是否改善通勤还取决于位置与交通，不能直接断言。", "私人户外空间较少 → 接触自然的机会可能减少 → 公共绿地是否充足影响生活体验。"], "words": ["高密度垂直住宅（high-density vertical housing）", "土地利用效率（land-use efficiency）", "通勤距离（commuting distance）", "城市效率（urban efficiency）", "接触自然（access to nature）", "压力恢复（stress recovery）", "久坐生活方式（sedentary lifestyle）", "公共健康成本（public health costs）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第4行", "sourceId": 6}, {"id": "chain-5", "title": "是否应该禁止在公共场所使用手机？", "tag": "科技使用边界", "type": "agree", "question": "是否应该禁止在公共场所使用手机？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["不同意：全面禁止→妨碍移动支付/导航/紧急联络→时间与生活成本上升→不应全面禁止。同意：分场景限制→减少外放噪音与干扰→公共空间更有序→应限制。"], "words": ["移动支付（mobile payment）", "导航（navigation）", "紧急联络（emergency contact）", "时间成本（time cost）", "公共滋扰（public nuisance）", "噪音污染（noise pollution）", "分场景限制（context-specific restriction）", "公共秩序（public order）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第5行", "sourceId": 6}, {"id": "chain-6", "title": "屏幕活动是否损害儿童心智能力？", "tag": "科技使用边界", "type": "development", "question": "屏幕活动是否损害儿童心智能力？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["消极：屏幕时间多→睡眠不足与注意力碎片化→学习效率下降。积极：优质教育内容→可暂停回放→自主学习与知识获取更公平。"], "words": ["屏幕时间（screen time）", "睡眠不足（sleep deprivation）", "注意力碎片化（fragmented attention）", "学业表现（academic performance）", "教育内容（educational content）", "自主学习（self-paced learning）", "知识获取公平（equal access to knowledge）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第6行", "sourceId": 6}, {"id": "chain-7", "title": "公开大量私人信息是积极还是消极发展？", "tag": "科技使用边界", "type": "development", "question": "公开大量私人信息是积极还是消极发展？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["消极：公开信息→平台收集数据→精准操纵/价格歧视→消费者受损。积极：公开信息→社交资本与信任增加→合作/商业机会增多。"], "words": ["个人数据（personal data）", "数据收集（data collection）", "精准操纵（targeted manipulation）", "价格歧视（price discrimination）", "社交资本（social capital）", "信任（trust）", "商业机会（business opportunities）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第7行", "sourceId": 6}, {"id": "chain-8", "title": "政府是否应为所有想上大学者支付学费？", "tag": "公共服务成本", "type": "agree", "question": "政府是否应为所有想上大学者支付学费？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["免费学费 → 降低低收入家庭入学障碍 → 扩大教育机会。", "如果资金和师资未随需求增长 → 教学资源承压 → 服务质量可能下降；定向资助可集中有限预算。"], "words": ["全民免费学费（universal free tuition）", "学位贬值（degree inflation）", "资源紧张（resource strain）", "定向补贴（targeted subsidy）", "低收入学生（low-income students）", "技能短缺（skills shortage）", "社会流动（social mobility）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第8行", "sourceId": 6}, {"id": "chain-9", "title": "大学教育主要让个人获益，学生是否应自行付费？", "tag": "公共服务成本", "type": "agree", "question": "大学教育主要让个人获益，学生是否应自行付费？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["毕业生获得部分私人收益 → 可以承担合理份额的费用。", "全部自费可能排除低收入学生 → 减少人才发展机会；政府支持反映教育也有公共收益。"], "words": ["个人收益（private benefit）", "成本分担（cost-sharing）", "全额学费（full tuition）", "排除（exclude）", "人才浪费（talent waste）", "公共品（public good）", "创新（innovation）", "税收（tax revenue）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第9行", "sourceId": 6}, {"id": "chain-10", "title": "政府是否应向全民免费提供医疗和教育？", "tag": "公共服务成本", "type": "discuss", "question": "政府是否应向全民免费提供医疗和教育？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["免除使用时的费用 → 降低经济障碍 → 更多人可获得必要服务。", "服务依然需要税收或其他稳定资金 → 如果预算不足，等待时间和质量可能受影响；讨论谁承担成本，而非把免费等同无成本 , "sourceId": 6}, {"id": "chain-14", "title": "青少年犯罪增加的原因和适当惩罚是什么？", "tag": "犯罪治理", "type": "two", "question": "青少年犯罪增加的原因和适当惩罚是什么？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["原因：辍学/缺乏职业技能→找不到合法工作→加入帮派/犯罪。对策：职业教育+导师制→就业能力提高→犯罪诱因减少。 第二问：对严重暴力犯罪可考虑监禁以保护公众；对部分较轻初犯，监督下的社区服务与改造可能更合适。"], "words": ["辍学（school dropout）", "职业技能（vocational skills）", "合法就业（legal employment）", "加入帮派（gang involvement）", "职业培训（vocational training）", "导师制（mentorship）", "就业能力（employability）", "犯罪诱因（crime incentive）"], "paragraph": "", "warning": "第二问要求适当惩罚，职业培训不是惩罚。可区分严重暴力与较轻初犯，讨论监禁或社区服务。", "source": "逻辑链表 · 第14行", "sourceId": 6}, {"id": "chain-15", "title": "媒体报道暴力犯罪是否制造恐慌和模仿？", "tag": "犯罪治理", "type": "agree", "question": "媒体报道暴力犯罪是否制造恐慌和模仿？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["同意限制：细节报道→恐慌/模仿→应限制。不同意：公开报道→公众警觉/司法监督→应规范而非禁止。"], "words": ["犯罪细节报道（detailed crime reporting）", "公众恐慌（public panic）", "模仿（imitation）", "公众警觉（public vigilance）", "司法问责（judicial accountability）", "媒体监管（media regulation）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第15行", "sourceId": 6}, {"id": "chain-16", "title": "监禁还是教育更能减少犯罪？", "tag": "犯罪治理", "type": "discuss", "question": "监禁还是教育更能减少犯罪？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["监禁危险罪犯 → 服刑期间减少接触潜在受害者 → 保护公众。", "教育、辅导和培训 → 处理部分释放后的困难 → 可能降低再犯风险，不能保证所有人不再犯罪。"], "words": ["更长监禁（longer prison sentences）", "隔离（incapacitation）", "再犯（recidivism）", "改造（rehabilitation）", "心理辅导（psychological counseling）", "成瘾治疗（addiction treatment）", "根源（root causes）"], "paragraph": "", "warning": "逻辑链是可练习的论证角度，因果关系需要解释，不是研究结论。", "source": "逻辑链表 · 第16行", "sourceId": 6}, {"id": "chain-17", "title": "学生应学所有科目还是专注强项？", "tag": "教育路径", "type": "discuss", "question": "学生应学所有科目还是专注强项？", "questionNote": "来源中的中文题目变体；练习时先补全具体问法。", "stance": "先确定具体问法，再选择立场", "logic": ["全科：广泛课程→发现兴趣/打基础→适应变化。专注：聚焦强项→深度学习/竞赛优势→专业成就。立场：先广后专。"], "words": ["广泛课程（broad curr ould be weighed against the importance of reliable access to essential goods.", "warning": "最后四行F列是中文逻辑链，不是英文词伙；不能误当单词表。", "source": "逻辑链表 · 第20–23行", "sourceId": 6}, {"id": "personal-gap", "title": "间隔年的利弊：我的熟悉题", "tag": "我的课堂笔记", "type": "outweigh", "question": "Some students take a year off between finishing school and entering university to work or travel. Do the advantages outweigh the disadvantages?", "questionNote": "依据你自己整理的利弊题，重写自然表达。", "stance": "好处大于坏处：独立与职业认识，比较经济和学习衔接成本", "logic": ["处理住宿、预算和工作任务 → 独立解决问题 → 更好应对大学生活", "实际接触工作或不同文化 → 明确兴趣与职业方向 → 更有依据地选择课程", "旅行成本与学习中断 → 承认负担 → 比较适当安排下的长期收益"], "words": ["broaden their horizons 开阔视野", "develop independence 培养独立性", "place a financial burden on 给…造成经济负担"], "paragraph": "Taking a gap year can help students develop independence by giving them responsibility for real tasks. For example, those who work may need to manage their earnings and communicate with colleagues. These experiences can prepare them for university life, although the benefits depend on how the year is planned and used.", "warning": "不能只说见识先进设备就会生活更好；解释经历怎样转化为能力。", "source": "个人大作文 · 利弊型", "sourceId": 4}], "corrections": [{"title": "开头不用铺垫热度", "original": "The debate surrounding ... has engaged a broad audience recently.", "better": "Some people argue that ... . I agree with this view because ... .", "why": "题目未说明最近受到广泛讨论，就不额外声称。直接说明题意和立场。", "source": "急救模板 p12–15"}, {"title": "保留适度书面搭配", "original": "receive wider visual filed", "better": "broaden their horizons", "why": "纠正拼写和不自然搭配；视野指见识时用horizons。", "source": "个人大作文利弊型"}, {"title": "把能力说具体", "original": "improve their abilities", "better": "develop independence and problem-solving skills", "why": "指出提升的具体能力，后面可以解释机制。", "source": "个人大作文利弊型"}, {"title": "负担句要正确", "original": "economic pressures may be experience", "better": "may place a financial burden on their families", "why": "修正被动形式，选择自然的主语和搭配。", "source": "个人大作文利弊型"}, {"title": "结尾句保持完整", "original": "despite the fact that ... . I still believe ...", "better": "Although ... , I believe that ... .", "why": "despite the fact that后要完整从句，不能独立成残句。", "source": "个人大作文结尾"}, {"title": "不编造研究证据", "original": "According to a recent survey ... nearly 70% ...", "better": "For example, if ... , ... .", "why": "原资料的模拟调查不作为真实事实。用清楚的假设场景支持论证。", "source": "急救模板 p18"}, {"title": "不固定让步段比例", "original": "让步→转折作为所有题的统一结构", "better": "按问题选择主体段；让步只是可选模块。", "why": "双边讨论双方都要展开；原因措施不需要硬套让步。", "source": "25题 p4；急救模板 p12–15"}, {"title": "最佳方式可以支持也可以反对", "original": "看到best就一般反驳", "better": "比较这个方法与其他方法，再形成可论证的判断。", "why": "绝对措辞要求有针对性的回应，但不能仅凭best预设立场。", "source": "25题 p31"}, {"title": "提高到与提高了", "original": "increase to 30% / increase by 10%", "better": "20%→30%: rose by 10 percentage points.", "why": "百分点是差值，相对增长是50%；不能混用。", "source": "表达PDF p16；个人小作文"}, {"title": "地图和流程不要机械分段", "original": "一图一段；流程不用想分段", "better": "地图按区域/变化分组；流程按阶段和分支组织。", "why": "保留清楚的比较和过程关系，而不是固定形式。", "source": "个人小作文地图；表达PDF p22、27"}, {"title": "客观报告不能加原因", "original": "数值变化→自行解释社会原因", "better": "只报告图中可见的特征、数据与关系。", "why": "小作文不自行推测原因或主观评价。", "source": "小作文综合整理"}, {"title": "预测不是官方概率", "original": "逻辑链表中的94、93等分值", "better": "仅保留题目、逻辑链和词伙，不据此排序。", "why": "原表没有提供可靠预测依据；按自己需要练习。", "source": "逻辑链表 B列"}, {"title": "分数不由难词数量决定", "original": "用了模板句就提升相应分数", "better": "准确、恰当、灵活地使用词汇与不同句型。", "why": "删除来源中的自动加分、稳分与短期提分保证。", "source": "急救模板 p4、37；25题 p39"}, {"title": "时间管理不是社交技能的同义词", "original": "social skills包括所有管理能力", "better": "social skills: communication and teamwork; other transferable skills: time management.", "why": "分类更精确，避免模糊概念。", "source": "25题 p7–8"}, {"title": "个人笔记的重复块", "original": "咖啡范文出现大量重复段落", "better": "文字索引去重，练习使用一份结构清楚的内容。", "why": "重复内容不是新增知识；原文件下载仍保留全部。", "source": "个人小作文 ¶164–764"}, {"title": "compared with的结构", "original": "compared with后必须ing", "better": "A stood at 40%, compared with 30% for B.", "why": "后面可接名词或数值短语，不是必须ing。", "source": "个人小作文柱状图"}, {"title": "两点不推断过程", "original": "两个年份的数据写rose steadily", "better": "rose from A to B", "why": "只有两个观测点时，不能推断中间持续或波动。", "source": "两年动态图综合"}, {"title": "年份与拼写", "original": "肉类图1979–2014；decease", "better": "1979–2004；decrease", "why": "改写时核对原图年份；decease指死亡，与下降不同。", "source": "个人小作文折线图"}, {"title": "年假不必连续", "original": "四周年假 = 连续一个月缺席", "better": "annual leave可以分次安排", "why": "连续缺席成本不是题目的必然条件。", "source": "25题笔记幻灯片30"}, {"title": "源模板的数量", "original": "称9组但正文包含10组", "better": "按3正向、2负向、1让步、2原因、2措施整理。", "why": "学习时共用展开顺序，保留十个功能的区别。", "source": "急救模板 p7–11"}], "charts": []};</script><script>'use strict';
const D=window.WRITING_DATA,KEY='ielts-writing-notebook-v1';

const fmt=s=>esc(s).replace(/\[([^\]]+)\]/g,'<span class="slot">[$1]<\/span>');
let state={version:1,records:{},favorites:[],last:null},storageOK=true;
try{const p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.version===1&&p.records&&Array.isArray(p.favorites))state=p;}catch(e){storageOK=false;}
let moduleGroup='positive',moduleSearch='';

function moduleCard(m){return `<article class="module"><div class="toolbar"><span class="tag">${esc(m.intent)} · ${esc(m.cn)}<\/span>${star(m.id)}<\/div><h3>${esc(m.title)}<\/h3><div class="english" ${hideEnglish?'hidden':''}><div class="en">${fmt(m.en)}<\/div><div class="example en">${esc(m.example)}<\/div><\/div>${hideEnglish?'<button data-show-en>显示英文<\/button>':''}<p class="use">${esc(m.use)}<\/p>${m.old?`<details><summary>原句与调整理由<\/summary><p class="en">${fmt(m.old)}<\/p><p class="muted">保留表达功能，换成具体的机制与结果；不会因为词更长就自动提高分数。<\/p><\/details>`:''}<div class="toolbar"><button data-practice="${esc(m.id)}">${m.task1group?'查看句型提示':'记忆这条表达'}<\/button>${rateTag(m.id)}<\/div><div class="source">来源：${esc(m.src)} · 英文为整理后的推荐写法<\/div><\/article>`;}
function topicCard(t){return `<details class="topic"><summary><span>${esc(t.title)}<small class="muted">　${esc(t.tag)} · ${esc(D.types.find(x=>x.id===t.type)?.title||'双问题')}<\/small><\/span>${rateTag(t.id)}<\/summary><div class="content"><p class="en">${esc(t.question)}<\/p><p class="muted">${esc(t.questionNote)}<\/p><div class="topicgrid"><div><h4>一条可以展开的思路<\/h4><p class="muted">${esc(t.stance)}<\/p>${t.logic.map(l=>`<p class="logic">${esc(l)}<\/p>`).join('')}<div class="wordlist">${t.words.map(w=>`<span>${esc(w)}<\/span>`).join('')}<\/div><\/div><div>${t.paragraph?`<details><summary>可选：看关键词如何连接成句子<\/summary><p class="en">${esc(t.paragraph)}<\/p><p class="muted">理解表达方式即可，不要求整段背诵。<\/p><\/details>`:'<p class="muted">这是补充思路。先回忆中文逻辑和关键词，再挑一句你能记住的表达。<\/p>'}<p class="notice">${esc(t.warning)}<\/p><\/div><\/div><div class="toolbar"><button class="primary" data-practice="${esc(t.id)}">回忆思路与关键词<\/button><button data-frame="${esc(t.type)}">看对应框架<\/button>${star(t.id)}<\/div>${t.essay?`<details><summary>看你的熟悉题如何套入四段框架 · 完整示例<\/summary><p class="muted">${esc(t.essayNote)}<\/p>${t.essay.map((p,i)=>`<h4>${['开头：立场','主体一：代价','主体二：收益与比较','结尾：权衡'][i]}<\/h4><p class="en">${esc(p)}<\/p>`).join('')}<\/details>`:''}<div class="source">来源：${esc(t.source)} · 思路是可选论证角度，不代表必须采用这个立场。<\/div><\/div><\/details>`;}
function scaffold(){const t=D.types.find(x=>x.id===type);let intro=t.intro,end=t.end,labels=['核心意思一 → 机制 → 例子 → 回扣','核心意思二 → 机制 → 例子 → 回扣'];
 if(type==='agree'){const st=stance==='disagree'?'disagree':stance==='partial'?'partly agree':'agree';intro=`Some people argue that [题干主张]. I ${st} with this view because [理由一] and [理由二].`;end=`In conclusion, I ${st} that [立场], mainly because [概括理由].`;if(stance==='partial')intro='Some people argue that [题干主张]. I agree that [同意的范围], but I do not believe that [不同意的范围].';}
 if(type==='outweigh'&&stance==='negative'){intro='Although [现象] offers some benefits, I believe that its drawbacks are more significant.';end='In conclusion, the drawbacks of [现象] outweigh its benefits because [比较依据].';}
 if(type==='development'){const st=stance==='negative'?'negative':'positive';intro=`The growing trend towards [变化] has both benefits and drawbacks. On balance, I consider it a ${st} development.`;end=`Overall, I consider this a ${st} development, as [主要判断依据].`;}
 let b1='One important reason is that [观点一]. By [具体机制], [对象] can [具体结果]. For example, [情境与结果]. This explains why [回扣题目].';
 let b2='Another point to consider is [观点二]. This can [具体影响] because [机制]. For instance, [具体例子]. [回扣立场或比较].';
 if(type==='discuss'){b1='On the one hand, some people support [观点A] because [理由]. [解释机制]. For example, [具体情境]. [说明此观点的合理之处].';b2='On the other hand, [观点B] may be preferable because [理由]. [解释机制]. For instance, [具体情境]. I believe [自己的判断], since [判断依据].';labels=['解释A：为什么有人支持它','解释B：为什么有人支持它，加入自己的判断'];}
 if(type==='causes'){b1='One major reason for [问题] is [原因]. This can [中间机制], which in turn [导致题目现象]. For example, [具体情境].';b2='To address this problem, [执行主体] could [具体措施]. By [实施方式], this would help [结果]. For instance, [措施如何起作用].';labels=['原因：为什么发生','措施：谁做什么，为什么有效'];}
 if(type==='outweigh'||type==='development'){const negative=stance==='negative';b1=`Admittedly, [现象] has some ${negative?'benefits':'drawbacks'}. One is [具体影响]. This happens because [机制]. For example, [情境与结果].`;b2=`However, its ${negative?'drawbacks':'benefits'} are more significant because [比较依据]. [解释机制与结果]. For instance, [具体例子]. [说明为什么这点更重要].`;labels=['承认另一面，解释具体影响','说明主要判断，并进行有依据的权衡'];}
 if(type==='two'){b1='[直接回答问题一]. This is because [解释]. For example, [情境与结果]. [回扣第一问].';b2='[直接回答问题二]. [解释原因或机制]. For instance, [具体情境]. [回扣第二问].';labels=['完整回答第一个问题','完整回答第二个问题'];}
 if(type==='agree'&&stance==='disagree')end='In conclusion, I disagree with the view that [题干主张], mainly because [概括理由].';
 const bodyNotes=[...t.body]; if(type==='outweigh'&&stance==='negative'){bodyNotes[0]='承认具体好处并解释机制，不需要否认它有价值。';bodyNotes[1]='解释更重要的弊端，并比较影响范围、程度或持续时间。';} return {t,texts:[intro,b1,b2,end],labels,bodyNotes};}
function showFrame(){const {t,texts,labels,bodyNotes}=scaffold();const opts=type==='agree'?[['agree','同意'],['disagree','不同意'],['partial','部分同意']]:['outweigh','development'].includes(type)?[['positive',type==='outweigh'?'利大于弊':'积极'],['negative',type==='outweigh'?'弊大于利':'消极']]:[];
 $('#framearea').innerHTML=`<div class="frame"><div class="framehead"><div><h2>${esc(t.title)}<\/h2><p>${esc(t.focus)}<\/p><\/div>${opts.length?`<label class="muted">模板立场 <select id="stance">${opts.map(([v,n])=>`<option value="${v}" ${stance===v?'selected':''}>${n}<\/option>`).join('')}<\/select><\/label>`:''}<\/div>${texts.map((s,i)=>`<div class="paragraph"><div class="label">${['01 开头','02 主体一','03 主体二','04 结尾'][i]}<\/div><div><p class="en">${fmt(s)}<\/p><p class="muted">${i===0?'共用：改写题目并回答。差异：这个题型需要的答案。':i===3?'共用：总结已论证的答案，不加新观点。':labels[i-1]}<\/p>${i===1||i===2?`<small>${esc(bodyNotes[i-1])}<\/small>`:''}<\/div><\/div>`).join('')}<\/div><p class="notice">${esc(t.warning)}<br><span class="muted">四段是便于练习的默认框架，不是唯一规定。方括号里的内容需要针对题目构思；不要求一段把所有句子写齐。<\/span><\/p><div class="toolbar"><button class="primary" data-scaffold>回忆这个框架<\/button><button id="copy-frame">复制当前框架<\/button><\/div>`;
