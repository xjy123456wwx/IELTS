function render(){page=(location.hash.slice(1)||'today').split('?')[0];if(!['today','task2','task1','topics','words','sources'].includes(page))page='today';document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===page));const app=$('#app');
 if(page==='today'){let done=Object.values(state.records).filter(r=>r.rate==='ready').length;const favorites=state.favorites.map(findItem).filter(Boolean).slice(0,6),last=findItem(state.last),start=last||D.topics.find(t=>t.id==='personal-gap');app.innerHTML=title('01 / 每次记住一点','少背一点，反复回忆。','大作文记一套框架，再看题型改变哪些地方。小作文只做熟悉内容的速查与提升。')+`<div class="stats"><span><strong>6<\/strong>题型差异<\/span><span><strong>${D.topics.length}<\/strong>题目思路卡<\/span><span><strong>${done}<\/strong>已标记能独立回忆<\/span><\/div><div class="grid"><article class="card"><span class="tag">${last?'接着上次复习':'从你熟悉的利弊题回忆'}<\/span><h3>${esc(start.title)}<\/h3><p>先回忆题型和中文逻辑，再展开模板与搭配对照。只记关键词，不在这里写整篇作文。<\/p><div class="cardfoot"><button class="primary" data-practice="${start.id}">开始复习<\/button><\/div><\/article><article class="card"><span class="tag">一套主框架<\/span><h3>不用分别背六篇模板。<\/h3><p>开头、两个主体段、结尾。切换题型，只看每段任务和表达的差异。<\/p><div class="cardfoot"><a class="button" href="#task2">打开大作文框架<\/a><\/div><\/article><article class="card"><span class="tag">你熟悉的小作文<\/span><h3>五个变化句型，按需轮换。<\/h3><p>趋势、比例、比较、地图、流程。只看模板与使用条件，不安排原题训练。<\/p><div class="cardfoot"><a class="button" href="#task1">打开小作文速查<\/a><\/div><\/article><\/div><div class="sectionbar"><h2>我真正要记的内容<\/h2><a href="#words">挑选我的常用 →<\/a><\/div>${favorites.length?`<div class="grid">${favorites.map(m=>`<article class="card"><span class="tag">已设为常用<\/span><h3>${esc(m.title)}<\/h3><p>${esc(m.cn||m.stance||'')}<\/p><div class="cardfoot"><button data-practice="${m.id}">回忆这条<\/button>${rateTag(m.id)}<\/div><\/article>`).join('')}<\/div>`:'<p class="empty">把你准备反复记忆的句型或题目设为常用，就会出现在这里。先选3–5条即可。<\/p>'}<div class="sectionbar"><h2>整理时保留的三个原则<\/h2><\/div><div class="steps">${D.principles.map((p,i)=>`<div class="step"><strong>0${i+1}<\/strong>${esc(p)}<\/div>`).join('')}<\/div>${!storageOK?'<p class="notice">当前浏览器不能可靠保存，请及时导出练习备份。<\/p>':''}`;}
 if(page==='task2'){app.innerHTML=title('02 / 大作文','一套主框架，六种题目问法。','共用的展开顺序是“核心意思 → 为什么或怎么发生 → 具体例子 → 回扣题目”。下面只对照题型要求，不需要分别背六份。')+`<details class="wide" open><summary>先记这条共用的主体段骨架<\/summary><p class="en">[Main point]. This is because [mechanism]. For example, [specific situation and result]. [Link to the question].<\/p><p class="muted">把核心意思换成好处、坏处、原因或措施，就能沿用同一展开顺序。句型模块是按需要选用的表达，不是额外十段都要背。<\/p><\/details><div class="tabs">${D.types.map(t=>`<button class="pill ${type===t.id?'selected':''}" data-type="${t.id}">${esc(t.title)}<\/button>`).join('')}<\/div><div id="framearea" class="wide"><\/div><div class="sectionbar"><h2>按段落功能找模板<\/h2><button id="toggle-english">${hideEnglish?'显示英文':'只看中文提示'}<\/button><\/div><p class="muted">正向、负向、让步、原因与措施分别查找。每类只挑你准备使用的写法，不用一次背完所有模块。<\/p><div class="tabs module-tabs">${moduleGroups.map(g=>`<button class="pill ${moduleGroup===g.id?'selected':''}" data-module-group="${g.id}">${esc(g.title)}<\/button>`).join('')}<button class="pill ${moduleGroup==='all'?'selected':''}" data-module-group="all">全部功能<\/button><\/div><div class="filter"><input id="module-search" aria-label="检索段落功能或句型" placeholder="直接检索：让步、原因、Reasons、although、financial…" value="${esc(moduleSearch)}"><\/div><p id="module-note" class="notice"><\/p><div id="module-results" class="modules"><\/div><div class="sectionbar"><h2>展开方法 · Develop an idea<\/h2><\/div><p class="muted">举例和比较是展开观点的写法，可以配合上面的不同段落功能使用。<\/p><div class="modules">${D.modules.filter(m=>['example','compare'].includes(m.id)).map(moduleCard).join('')}<\/div>`;showFrame();renderModuleResults();$('#module-search').oninput=e=>{moduleSearch=e.target.value;if(moduleSearch.trim())moduleGroup='all';renderModuleResults();};$('#toggle-english').onclick=()=>{hideEnglish=!hideEnglish;render();};}
 if(page==='task1'){const t=D.task1.find(x=>x.id===t1type);app.innerHTML=title('03 / 小作文','熟悉的模板，轻量复习。','保留你的课堂写法，只补充更自然的表达、清楚的概述和使用条件。这里不放原题或练习图。')+`<div class="tabs">${D.task1.map(x=>`<button class="pill ${t1type===x.id?'selected':''}" data-t1="${x.id}">${esc(x.title)}<\/button>`).join('')}<\/div><p class="muted">${esc(t.desc)}<\/p><div class="frame wide"><div class="framehead"><div><h2>${esc(t.title)} · 完整框架<\/h2><p>改写题目 → 概述 → 两组细节。你笔记中的概述也可放结尾；这里默认第二段，便于及时概括。最后不必再写重复结论。<\/p><\/div><\/div>${t.frame.map(f=>`<div class="paragraph"><div class="label">${esc(f.label)}<\/div><div><p class="en">${fmt(f.en)}<\/p><p class="muted">${esc(f.note)}<\/p><\/div><\/div>`).join('')}<\/div><details class="wide"><summary>第一段怎么改写：回忆四个动作<\/summary><p><strong>① 换准确的图名：<\/strong>line graph / bar chart / pie chart / table / maps / diagram。<\/p><p><strong>② 按含义选动词：<\/strong>shows、illustrates、indicates、demonstrates；比较对象用compares，过程可用illustrates how。<\/p><p><strong>③ 重组后面的信息：<\/strong>指标或变化 / 过程 + 对象或地点 + 时间。保留事实含义，不必把每个词都改掉。<\/p><p><strong>④ 核对句子：<\/strong>单图The graph shows；多图The maps show。时间和单位不能漏掉或改错。<\/p><\/details><p class="notice">${t.notes.map(esc).join('<br>')}<\/p><div class="sectionbar"><h2>推荐句型与提升点<\/h2><button id="toggle-english">${hideEnglish?'显示英文':'只看中文提示'}<\/button><\/div><div class="modules">${D.modules.filter(m=>m.task1group===t1type||m.task1group==='data'&&['dynamic','static'].includes(t1type)).map(moduleCard).join('')}<\/div>`;$('#toggle-english').onclick=()=>{hideEnglish=!hideEnglish;render();};}
 if(page==='topics'){app.innerHTML=title('04 / 用题目记思路','先回答题目，再选择表达。','话题只是辅助标签。每题把问法、两条思路和可用搭配放在一起，避免只背立场和漂亮句子。')+`<div class="filter"><input id="search" aria-label="搜索题目和搭配" placeholder="搜索：间隔年、教育、financial burden…" value="${esc(search)}"><select id="topic-filter" aria-label="筛选题型"><option value="all">所有问法<\/option>${D.types.map(t=>`<option value="${t.id}" ${topicFilter===t.id?'selected':''}>${esc(t.title)}<\/option>`).join('')}<option value="mine" ${topicFilter==='mine'?'selected':''}>我的常用<\/option><\/select><\/div><p class="muted">25道经典题 + 19道逻辑链补充 + 你熟悉的间隔年题。相近题可以共享展开思路，但须重新核对问法。<\/p><div id="topic-results"><\/div>`;topicResults();$('#search').oninput=e=>{search=e.target.value;topicResults();};$('#topic-filter').onchange=e=>{topicFilter=e.target.value;topicResults();};}
 if(page==='words'){app.innerHTML=title('05 / 我的常用','记住搭配，也记住使用条件。','主模板提供稳定句型，题目提供具体表达。只把真正会用的内容设为常用，不需要把所有替代词都背完。')+`<div class="filter"><input id="search" aria-label="搜索句型" placeholder="搜索句型、用途、词伙…" value="${esc(search)}"><select id="word-filter" aria-label="筛选句型"><option value="all">所有推荐表达<\/option><option value="mine" ${wordFilter==='mine'?'selected':''}>我的常用<\/option><option value="task2" ${wordFilter==='task2'?'selected':''}>大作文展开<\/option><option value="task1" ${wordFilter==='task1'?'selected':''}>小作文速查<\/option><option value="vocab" ${wordFilter==='vocab'?'selected':''}>新资料选用词伙<\/option><\/select><\/div><div id="word-results" class="modules"><\/div><details><summary>按题目找具体搭配<\/summary><p>话题词伙已放在每道题的逻辑链旁边，便于记住它们表达的具体意思。<\/p><a href="#topics">打开题目与搭配 →<\/a><\/details>`;wordResults();$('#search').oninput=e=>{search=e.target.value;wordResults();};$('#word-filter').onchange=e=>{wordFilter=e.target.value;wordResults();};}
 if(page==='sources'){app.innerHTML=title('06 / 整理说明','资料的作用，留在这里。','网站只保留整理后的模板、思路与关键词，以及必要的出处。完整原文件保存在你的E盘，不上传到网站。')+`<div class="toolbar"><a class="button primary" href="整理/雅思作文总整理.md" download>下载整理版文字<\/a><button id="show-corrections">先看纠错与提升<\/button><\/div><p class="notice">原资料中的自动加分说法、固定分数提升和预测概率不作为记忆规则。整理后的句型需要按具体题意使用。<\/p>${D.sources.map(s=>`<section class="sourcebook"><h3>${esc(s.name)}<\/h3><p class="muted">${esc(s.role)}<\/p><p>${esc(s.coverage)}<\/p><\/section>`).join('')}<div class="sectionbar" id="corrections"><h2>纠错与提升备注<\/h2><\/div><div class="modules">${D.corrections.map(c=>`<article class="correction"><h3>${esc(c.title)}<\/h3><p><del>${esc(c.original)}<\/del><\/p><p class="en">${esc(c.better)}<\/p><p class="muted">${esc(c.why)}<\/p><div class="source">${esc(c.source)}<\/div><\/article>`).join('')}<\/div><div class="source-links"><p>评分依据：<a href="https://ielts.org/cdn/ielts-guides/ielts-writing-band-descriptors.pdf" target="_blank" rel="noopener">IELTS官方写作评分标准<\/a><a href="https://ielts.org/take-a-test/preparation-resources/writing-test-resources" target="_blank" rel="noopener">官方写作备考说明<\/a><\/p><\/div>`;$('#show-corrections').onclick=()=>$('#corrections').scrollIntoView({behavior:'smooth'});}

}
function renderModuleResults(){const group=moduleGroups.find(g=>g.id===moduleGroup);const selected=D.modules.filter(m=>!m.task1group&&m.intent!=='词伙'&&!['example','compare'].includes(m.id)).filter(m=>{const g=moduleGroups.find(g=>m.intent.startsWith(g.prefix));return (moduleGroup==='all'||g?.id===moduleGroup)&&(!moduleSearch||`${JSON.stringify(m)} ${g?.title||''}`.toLowerCase().includes(moduleSearch.toLowerCase()));});$('#module-results').innerHTML=selected.length?selected.map(moduleCard).join(''):'<p class="empty">没有匹配项。试试“让步”“Reasons”“Solutions”或更短的关键词。<\/p>';$('#module-note').textContent=group?.note||'按句型、中文用途或英文功能名检索。Reasons解释为什么，Solutions说明怎么解决；让步和比较可以辅助你的判断。';document.querySelectorAll('[data-module-group]').forEach(b=>b.classList.toggle('selected',b.dataset.moduleGroup===moduleGroup));}
function topicResults(){const list=D.topics.filter(t=>(topicFilter==='all'||topicFilter==='mine'&&state.favorites.includes(t.id)||t.type===topicFilter)&&JSON.stringify(t).toLowerCase().includes(search.toLowerCase()));$('#topic-results').innerHTML=list.length?list.map(topicCard).join(''):'<p class="empty">没有匹配的题目。试试更短的关键词或切换所有问法。<\/p>';}
function wordResults(){const list=D.modules.filter(m=>(wordFilter==='all'||wordFilter==='mine'&&state.favorites.includes(m.id)||wordFilter==='task1'&&m.task1group||wordFilter==='task2'&&!m.task1group&&m.intent!=='词伙'||wordFilter==='vocab'&&m.intent==='词伙')&&JSON.stringify(m).toLowerCase().includes(search.toLowerCase()));$('#word-results').innerHTML=list.length?list.map(moduleCard).join(''):'<p class="empty">这里还没有表达。可以先在句型旁点击“设为常用”。<\/p>';}
function findItem(id){return D.topics.find(t=>t.id===id)||D.modules.find(m=>m.id===id);}
function copy(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('已复制')).catch(()=>fallbackCopy(text));}else fallbackCopy(text);}
function fallbackCopy(text){const a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();const ok=document.execCommand('copy');a.remove();toast(ok?'已复制':'复制不可用，请选中内容手动复制。');}
function download(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function openPractice(item){
 current=item;const isModule=!!item.en,isScaffold=!!item.scaffold;
 $('#practice-kind').textContent=isScaffold?'主框架记忆':isModule?(item.task1group?'小作文速查':'句型与词伙记忆'):'题目思路与关键词';
 $('#practice-title').textContent=item.title;$('#practice-question').textContent=item.question||item.cn||'先回忆每段任务，再看提示。';
 $('#practice-note').textContent=item.questionNote||'这里用于记忆模板与思路。完整作文在你平时使用的平台练习。';$('#practice-image').innerHTML='';
 const r=record(item.id);$('#outline').value=r.outline||'';$('#notes').value=r.notes||'';$('#practice-help').hidden=true;$('#reveal').textContent='查看模板与记忆提示';
 if(isScaffold)$('#practice-help').innerHTML=`<p class="muted">先回忆结构与关键句，再展开对照。<\/p>${item.scaffold.map((s,i)=>`<h4>${['开头','主体一','主体二','结尾'][i]}<\/h4><p class="en">${fmt(s)}<\/p>`).join('')}`;
 else if(isModule)$('#practice-help').innerHTML=`<h4>推荐句型 / 词伙<\/h4><p class="en">${fmt(item.en)}<\/p><h4>看它如何表达具体内容<\/h4><p class="en">${esc(item.example)}<\/p><p class="notice">${esc(item.use)}<\/p><p class="source">${esc(item.src)}<\/p>`;
 else $('#practice-help').innerHTML=`<h4>对应问法：${esc(D.types.find(t=>t.id===item.type)?.title)}<\/h4><p>${esc(item.stance)}<\/p>${item.logic.map(l=>`<p class="logic">${esc(l)}<\/p>`).join('')}<div class="wordlist">${item.words.map(w=>`<span>${esc(w)}<\/span>`).join('')}<\/div>${item.paragraph?`<details><summary>看一句思路怎样展开成自然表达<\/summary><p class="en">${esc(item.paragraph)}<\/p><\/details>`:''}<p class="notice">${esc(item.warning)}<\/p><button data-frame="${esc(item.type)}">查看对应框架<\/button>`;
 const checks=item.task1group?['能回忆这个句型的基本结构？','清楚它适用于什么信息？','记住时态、介词与单复数的注意点？']:['能辨认题目要求回答什么？','能回忆每段的任务？','能回忆核心句型与搭配？','知道方括号里的内容怎样替换？'];
 $('#checklist').innerHTML=checks.map((c,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${(r.checks||[]).includes(i)?'checked':''}>${esc(c)}<\/label>`).join('');document.querySelectorAll('[data-rate]').forEach(b=>b.classList.toggle('selected',b.dataset.rate===r.rate));$('#savehint').textContent=r.updated?'已恢复你的关键词与笔记。':'关键词与笔记会自动保存。';$('#practice').showModal();if(!isScaffold){state.last=item.id;save();}}
function saveDraft(){if(!current)return;const prev=record(current.id);state.records[current.id]={...prev,outline:$('#outline').value,notes:$('#notes').value,checks:[...document.querySelectorAll('[data-check]:checked')].map(n=>Number(n.dataset.check)),updated:new Date().toISOString()};save();$('#savehint').textContent=storageOK?'关键词与笔记已保存。':'未能保存到浏览器，请导出备份。';}
$('#app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.moduleGroup){moduleGroup=b.dataset.moduleGroup;moduleSearch='';$('#module-search').value='';renderModuleResults();}if(b.dataset.type){type=b.dataset.type;stance=['outweigh','development'].includes(type)?'positive':'agree';render();}if(b.dataset.t1){t1type=b.dataset.t1;render();}if(b.dataset.star){const id=b.dataset.star;state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];save();b.classList.toggle('on',state.favorites.includes(id));b.textContent=state.favorites.includes(id)?'★ 常用':'☆ 设为常用';b.setAttribute('aria-pressed',state.favorites.includes(id));}if(b.dataset.practice){const item=findItem(b.dataset.practice);if(item)openPractice(item);}if(b.dataset.frame){type=b.dataset.frame;stance=['outweigh','development'].includes(type)?'positive':'agree';if(location.hash==='#task2')render();else location.hash='task2';window.scrollTo(0,0);}if(b.hasAttribute('data-show-en')){b.parentElement.querySelector('.english').hidden=false;b.remove();}if(b.hasAttribute('data-scaffold')){const s=scaffold();openPractice({id:'scaffold-'+type+'-'+stance,title:s.t.title+' · 通用框架',question:s.t.ask,scaffold:s.texts});}});
$('#app').addEventListener('change',e=>{if(e.target.matches('.source-select')){const s=D.sources.find(s=>s.id===Number(e.target.dataset.source));$('#source-'+s.id).textContent=s.units[Number(e.target.value)].text||'';}});
$('#practice').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.rate){saveDraft();state.records[current.id].rate=b.dataset.rate;state.records[current.id].reviews=(state.records[current.id].reviews||0)+1;save();document.querySelectorAll('[data-rate]').forEach(n=>n.classList.toggle('selected',n===b));toast('已记录记忆熟练度');}if(b.dataset.frame){saveDraft();$('#practice').close();type=b.dataset.frame;stance=['outweigh','development'].includes(type)?'positive':'agree';location.hash='task2';render();}});
for(const id of ['outline','notes'])$('#'+id).addEventListener('input',saveDraft);$('#checklist').addEventListener('change',saveDraft);$('#close').onclick=()=>$('#practice').close();$('#practice').addEventListener('close',()=>{saveDraft();render();});$('#reveal').onclick=()=>{$('#practice-help').hidden=!$('#practice-help').hidden;$('#reveal').textContent=$('#practice-help').hidden?'查看模板与记忆提示':'收起提示，再回忆一次';};$('#download-draft').onclick=()=>{saveDraft();download(current.title.replace(/[\\/:*?"<>|]/g,'_')+'.md',`# ${current.title}

${current.question||current.cn||''}

## 我的思路与关键词
${$('#outline').value}

## 巩固备注
${$('#notes').value}`);};
$('#export').onclick=()=>{if($('#practice').open)saveDraft();download('雅思作文复习备份-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');toast('复习备份已导出');};
$('#import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>8*1024*1024)throw Error('文件太大');const p=JSON.parse(await f.text());if(p.version!==1||!p.records||typeof p.records!=='object'||Array.isArray(p.records)||!Array.isArray(p.favorites))throw Error('格式不符合');const records={};for(const [id,r] of Object.entries(p.records)){if(!findItem(id)&&!/^scaffold-(agree|discuss|outweigh|development|causes|two)-(agree|disagree|partial|positive|negative)$/.test(id))continue;if(!r||typeof r!=='object')continue;records[id]={outline:typeof r.outline==='string'?r.outline:'',draft:typeof r.draft==='string'?r.draft:'',notes:typeof r.notes==='string'?r.notes:'',rate:['new','learning','ready'].includes(r.rate)?r.rate:'new',checks:Array.isArray(r.checks)?r.checks.filter(x=>Number.isInteger(x)&&x>=0&&x<6):[],updated:typeof r.updated==='string'?r.updated:new Date().toISOString(),reviews:Number.isFinite(r.reviews)?r.reviews:0};}state.records={...state.records,...records};state.favorites=[...new Set([...state.favorites,...p.favorites.filter(x=>typeof x==='string'&&findItem(x))])];if(findItem(p.last))state.last=p.last;save();render();toast('已合并备份；相同记忆卡的笔记采用导入版本。');}catch(err){toast('导入失败：请选择本记忆册导出的JSON备份。');}finally{e.target.value='';}};
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});window.addEventListener('beforeunload',()=>{if($('#practice').open)saveDraft();});render();
