hoes when I actually need a new pair because, as a student, I try to make budget-friendly choices.\n\n结合我的经历\n\nYes, but usually only when I need a new pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Have you ever bought shoes online?\n\n原答案（项目已有稿）\n\nDefinitely. I usually buy shoes online because it’s incredibly convenient. I can compare different brands and prices without going to several stores.\n\n结合我的经历\n\nYes, I use online shopping when I can compare sizes, prices and customer reviews. Taobao is useful for that, but I check the information carefully before deciding. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you spend a lot of money on shoes?\n\n原答案（项目已有稿）\n\nNot really. Since I’m still a university student, I don’t want to spend too much money on them. Normally, I care more about comfort and quality than expensive brands.\n\n结合我的经历\n\nNot usually. I try to keep the price around three hundred yuan rather than spend too much on one pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you prefer sports shoes or fashionable shoes?\n\n原答案（项目已有稿）\n\nI definitely prefer sports shoes. They are more comfortable and practical, especially because I walk a lot on campus and sometimes go running.\n\n结合我的经历\n\nI definitely prefer comfortable trainers for everyday use. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Would you choose to wear sneakers when you are not exercising?\n\n原答案（项目已有稿）\n\nOf course. Actually, I wear sneakers in my daily life most of the time because they are comfortable and easy to match with different clothes.\n\n结合我的经历\n\nYes, because I walk around university and need something comfortable. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### 04 Politeness\n\n### Did you learn to be polite when you were a child?\n\n原答案（项目已有稿）\n\nYes. My parents taught me to say things like “thank you” and “sorry” when I was very young. They believed being polite was an important way to show respect to other people.\n\n结合我的经历\n\nYes, my parents taught me basic things like saying please and thank you. I also learned by watching how they treated other people. Those small habits are still useful now.\n\n### When do you think people need to be polite?\n\n原答案（项目已有稿）\n\nI think people should be polite in almost every situation, especially when talking to strangers, teachers or older people. Good manners can make communication much easier.\n\n结合我的经历\n\nI think politeness matters in everyday situations, especially when asking for help or speaking to someone unfamiliar. A considerate tone makes the conversation easier. It also shows that you respect the other person's time.\n\n### Have you met anyone who was very polite recently?\n\n原答案（项目已有稿）\n\nYes. Recently, I met a staff member when I was doing my internship. Whenever I asked her a question, she answered me patiently and always spoke to people in a friendly way.\n\n结合我的经历\n\nA person who listens carefully and gives others time to speak feels polite to me. I noticed that kind of behaviour in a school project meeting. It made the discussion feel more comfortable.\n\n### Is it important to be polite?\n\n原答案（项目已有稿）\n\nDefinitely. Being polite shows respect and helps people build better relationships. Even simple things like saying “thank you” can leave a good impression.\n\n结合我的经历\n\nYes, because it helps people feel respected. Even when someone disagrees with you, a polite tone makes it easier to continue the conversation. It is especially useful when working in a team.\n\n### Do you have any friends who are not very polite?\n\n原答案（项目已有稿）\n\nNot really. Most of my close friends are quite polite. Of course, we sometimes speak very casually with each other because we are close, but that doesn’t mean we are disrespectful.\n\n结合我的经历\n\nI would not describe my friends as impolite. We sometimes speak casually, but that is different from deliberately being rude. If something bothers me, I would explain it calmly.\n\n### 05 Tiredness\n\n### When do you usually feel tired?\n\n原答案（项目已有稿）\n\nI usually feel tired when I have a lot of schoolwork to finish. Sometimes I have to work on my projects or prepare for exams until late at night, which can be quite exhausting.\n\n结合我的经历\n\nI often feel mentally tired after studying or working on a university project for a long time. It is usually a sign that I need a short break. I try not to keep forcing myself to work without stopping.\n\n### What do you do when you feel tired?\n\n原答案（项目已有稿）\n\nNormally, I take a short break or listen to some soft music. If I’m extremely tired, I simply go to sleep because I think getting enough rest is the most effective solution.\n\n结合我的经历\n\nWhen I feel mentally tired, I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Will you hang out with your friends when you are tired?\n\n原答案（项目已有稿）\n\nProbably not. As I just mentioned, when I’m tired, I prefer to stay at home and get some rest. Going out may make me even more exhausted.\n\n结合我的经历\n\nIt depends on how tired I am. If I am only mentally tired, a short walk and chat can help. If I really need sleep, I would rather rest and meet them another time.\n\n### 06 Names\n\n### Do you find it easy to remember people’s names?\n\n原答案（项目已有稿）\n\nNot really. I’m much better at remembering people’s faces than their names. If I meet many new people at the same time, I may forget some names quite quickly.\n\n结合我的经历\n\nNot always. I sometimes remember a face more easily than a name. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember people’s names?\n\n原答案（项目已有稿）\n\nI usually connect their names with something about them, such as their appearance, major or personality. This makes the name much easier for me to remember.\n\n结合我的经历\n\nI write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Have you ever got into any trouble because you couldn’t remember someone’s name?\n\n原答案（项目已有稿）\n\nNothing serious, but I have had some awkward moments. Once I met someone I had talked to before, but I suddenly forgot her name, so I had to avoid using it during our conversation.\n\n结合我的经历\n\nIt has not caused a serious problem, but it can feel awkward. If I am not sure, I would rather ask politely than use the wrong name. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you feel when people can’t remember your name?\n\n原答案（项目已有稿）\n\nI don’t really mind, especially if we have only met once or twice. My Chinese name may also be difficult for some foreigners to remember, so I can understand that.\n\n结合我的经历\n\nI might feel a little disappointed, but I understand that it happens. Meeting lots of people makes names difficult to remember. I would simply remind them rather than take it personally.\n\n### Is it important to remember people’s names?\n\n原答案（项目已有稿）\n\nYes, especially at work or school. Remembering someone’s name shows that you pay attention to them and can make communication feel more personal.\n\n结合我的经历\n\nYes, it can make people feel that you have paid attention to them. It also makes a conversation more comfortable. I try to use a simp h my phone. However, I still think handwritten letters are quite meaningful.\n\n结合我的经历\n\nNot usually, because messages are faster and easier for everyday contact. But I would consider writing a card or letter for a meaningful occasion. Taking time over it can show that you care.\n\n### 08 Music\n\n### Do you like listening to music?\n\n原答案（项目已有稿）\n\nYes, I do. I especially like listening to music when I’m feeling tired or stressed because it helps me relax and escape from my daily worries for a while.\n\n结合我的经历\n\nYes, I especially enjoy happy music after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What kinds of music do you like to listen to?\n\n原答案（项目已有稿）\n\nI usually listen to soft pop music. I prefer songs with relaxing melodies because they can calm me down after a busy day.\n\n结合我的经历\n\nI prefer happy music, especially after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Where do you usually listen to music?\n\n原答案（项目已有稿）\n\nI mainly listen to music in my room or when I’m travelling by subway. I normally wear headphones, so I don’t disturb other people.\n\n结合我的经历\n\nI mainly listen when I want to relax outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### When don't you like to listen to music?\n\n原答案（项目已有稿）\n\nI don’t listen to music when I’m doing something that requires a lot of concentration. For example, during an important class or meeting, I prefer to focus completely on what is happening.\n\n结合我的经历\n\nI avoid it when I need to concentrate on a difficult task. For example, I want fewer distractions when practising English speaking. I enjoy music more during a proper break.\n\n### Can listening to music change people's emotions?\n\n原答案（项目已有稿）\n\nDefinitely. Happy music c ublic attention, and I find that kind of content quite annoying.\n\n结合我的经历\n\nI dislike repetitive advertisements and information that seems unreliable. They interrupt what I want to watch and waste time. I prefer useful content with a clear explanation.\n\n### 10 Rubbish and recycling\n\n### Do you recycle rubbish, like paper and plastic?\n\n原答案（项目已有稿）\n\nYes, I try to. At home, we normally separate recyclable materials such as cardboard, plastic bottles and cans from other household waste.\n\n结合我的经历\n\nI try to separate recyclable paper and plastic when suitable bins are available. I also avoid throwing away things that I can still use. Small habits are easier to keep up regularly.\n\n### Do people in your city recycle rubbish?\n\n原答案（项目已有稿）\n\nYes, many people do. There are different rubbish bins in residential areas, which encourage residents to separate recyclable and non-recyclable waste.\n\n结合我的经历\n\nSome people do, especially where there are clearly labelled bins. It is easier when people know what goes where. I would not assume every household follows the same routine.\n\n### How is rubbish recycled in your city?\n\n原答案（项目已有稿）\n\nAs far as I know, people first put different types of rubbish into separate bins. Then it is collected and sent to recycling centres, where recyclable materials can be processed and reused.\n\n结合我的经历\n\nI keep recyclable items separate from ordinary rubbish and put them in the appropriate bin. I check the label if I am unsure. I do not know all the later processing steps, but I can sort my own waste properly.\n\n### Do you often see rubbish on the road?\n\n原答案（项目已有稿）\n\nNot very often. Most streets in the city are cleaned regularly, so they are generally quite tidy. However, I sometimes see plastic bottles or food packaging in crowded places.\n\n结合我的经历\n\nOccasionally, though it depends on the place. I notice it more where there are lots of people passing through. It makes a public space look less pleasant.\n\n### What do you do wh nts always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you take long trips with your family as a child?\n\nI do not remember a particular long trip clearly, but I do remember enjoying time with my family. My strongest memories are family celebrations and birthdays. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### F 整理与记录：减少忘事和分心\n\n### Do you like keeping things tidy?\n\nYes, I like keeping my space organised. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you keep your study space tidy?\n\nI put my books away and clear my desk after studying. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Is it important to be tidy?\n\nYes, because being organised makes daily life easier. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Where do you keep everyday things?\n\nMy keys go by the door, and my books stay on the shelf. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you have a good memory?\n\nNot really, so I use notes and routines to help me. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember important things?\n\nI make notes on my phone and set reminders for important dates. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember names?\n\nI write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you carry paper and a pen?\n\nYes, I carry a small notebook and a pen to make quick notes. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Have you ever lost your keys?\n\nI have had trouble finding my keys, so I try to keep them in one place now. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you like your home?\n\nYes, mainly because it is tidy and easy to keep organised. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something."}, {"title": "18 临场速看卡", "body": "\nP1：问什么就先答什么；时间、数字和具体对象放第一句。\n\nP2：对象 → 背景 → 两个具体点 → 结果和感受。保留熟悉转场，但小问优先。\n\nP3：答案 → 原因怎样起作用 → 具体场景 → 因此如何回答原题。\n\n卡住时：Let me think for a moment. One possible reason is… 然后从自己熟悉的场景反推一般观点。缓冲句一句足够，不连说“难题、从没想过、有很多角度”。\n\n语法：can/should/may后原形；did后原形；started后doing/to do；enjoy后doing；过去经历用went/saw/felt。\n\n纠错一次继续：I go—sorry, I went there last summer. 不把整句话重说三遍。\n\n收尾：So, overall… / Therefore… 后接完整结论。不要in conclude。\n\n"}], "sixTails": {"A": "I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "B": "I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "C": "We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.", "D": "For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "E": "Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "F": "I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "F-memory": "I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something."}, "referenceNote": "最新个人设定：浙江人，在成都长大；家在成都郊区别墅，上学住宿舍；电视剧采用《万物生灵》。P1 继续优先使用你自己写并背过的六套。重要答案均在对应练习区；这里用于保存和下载。", "quick": [{"title": "P1 六套：只反复记这十二句", "body": "### A 听歌散步\n\nI put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### B 短纪录片\n\nI often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### C 和朋友一起\n\nWe usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### D 实用与质量\n\nFor everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### E 童年与家庭\n\nLooking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### F 整理与记录\n\nI keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n人名/记忆题只换记录句：I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something."}, {"title": "P1 接题开头：把问题先答掉", "body": "喜欢：Yes, I do. / I prefer…\n\n频率：Quite often. / Not very often. / Whenever I…\n\n过去：Yes, I did. / No, I did not. / I first… when…\n\n未来：I would like to… because…\n\n没做过：I have not tried it, but I would be interested in…\n\n直接一句开头，再接相关的六套核心句。不强行把“记忆”用到国家层面题。"}, {"title": "个人信息：不用临场重新想", "body": "籍贯：I am originally from Zhejiang, but I grew up in Chengdu.\n\n成长：My family moved to Chengdu when I was about one year old.\n\n家：My family home is a villa in the suburbs of Chengdu.\n\n学校：I live in a university dormitory during term time.\n\n专业：I am a university student, and my major is digital media art.\n\n电视剧：All Creatures Great and Small；young vet / animals / countryside / heart-warming。"}, {"title": "P2 一个结构：所有故事同一路线", "body": "When I saw this topic, the first [person / place / experience / thing] that popped up in my mind was…\n\nTo tell you more about it, …\n\nSpeaking of [what happened / what it looks like / what I would do], …\n\nAs for the highlight, …\n\nWhen it comes to [why / how I felt / why I would like it], …\n\nTo conclude, …\n\n过去讲 happened；未来讲 would；人物讲 who / what they do。记同一条路线，按题卡改内容。"}, {"title": "P2 全部 17 条故事：关键词 + 一句核心句", "body": "### 1 Betty\n\nmiddle school → organised → documentary / books / notes / timeline → small steps → right method\n\nShe breaks a difficult subject into smaller steps, which makes it easier to follow.\n\n### 2 校庆项目\n\n120th anniversary → hand-drawn animation too slow → meeting → footage + animation → split tasks → confidence\n\nInstead of drawing everything by hand, we decided to combine real-life footage with animation.\n\n### 3 学校公园\n\nschool → water / pavilion / benches → walk / chat / review → short break → clear my mind\n\nA short walk is enough to help me clear my mind.\n\n### 4 卢浮宫\n\ngraduation trip → Mona Lisa → lots of visitors → see art in person → crowded but worth it\n\nSeeing the artworks in person was worth the effort.\n\n### 5 篮球比赛\n\nsupport close friend → glasses knocked off in practice / slight injury → worried → proud of her courage\n\nI paid more attention to how she was doing than to the score.\n\n### 6 宫崎骏采访\n\nonline interview → loved animation as a child → drawings → creative process / time / patience → inspiring\n\nListening to him made me think about the effort behind the pictures I had enjoyed.\n\n### 7 SSD 技术问题\n\ncomputer / storage problem → tried to replace SSD → unfamiliar steps → instructions → stopped rushing → worked together\n\nWe stopped rushing and checked the instructions more carefully.\n\n### 8 实习通勤\n\ninternship → 7 a.m. → 9:30 start → one-and-a-half-hour journey → tiring → value convenient location\n\nThe journey took up time that I could otherwise have used for resting.\n\n### 9 《飘》电影\n\nloved novel → high expectations → film version → relationships / details less clear → disappointed\n\nIt did not quite meet my expectations, although I had enjoyed the book.\n\n### 10 《万物生灵》\n\nsocial media → learn English → young vet / British countryside → animals / community → heart-warming → relaxing\n\nThe story is not only about animals. It also talks about friendship, family and the relationships between people and animals.\n\n### 11 淘宝\n\nparents phone → primary school → orange icon → browse first → buy later → compare prices / reviews → student budget\n\nI can check prices and read customer reviews without going to several shops.\n\n### 12 树屋\n\ntravel website → forest → wooden house / ladder / windows → want short stay → photos / design → close to nature\n\nI would love to stay there for a short holiday, although I would not choose it as my permanent home.\n\n### 13 《大鱼之道》\n\nprimary school → teacher recommended Shen Shixi → fish migration → lay eggs → difficulties → next generation\n\nThe journey is connected with the survival of the next generation.\n\n### 14 光污染规定\n\nproposed rule → unnecessary lights off after eleven → advertising lights → keep safety lighting → darker bedrooms / less wasted electricity\n\nThe aim would be to use lighting more carefully, rather than make the whole city dark.\n\n### 15 月饼与中秋\n\nround pastry / different fillings → Mid-Autumn = birthday → relatives / gifts → childhood → family reunion\n\nMooncakes remind me of my childhood and make this festival especially meaningful to me.\n\n### 16 父亲的生意\n\nmoved to Chengdu at one → father setback → taxi / truck work → small electronics shop → company after years → persistence\n\nHe had to rebuild his life instead of starting with everything already in place.\n\n### 17 想买的相机\n\nmum took childhood photos → old camera heavy → want lightweight camera → study / travel / scenery / family → memories\n\nI would like a lightweight camera that is easy to carry and useful for both my studies and my hobby."}, {"title": "P3 六条通用因果：六句说完", "body": "理解：pictures + simple explanations → understand → remember。\n\n关系：shared activity → something to talk about → closer。\n\n选择：time + budget + needs → convenience or experience。\n\n成长：try independently → make decisions → improve ability。\n\n可靠：depend on information → mistakes mislead → check sources。\n\n差异：different needs + experiences → different choices。\n\nI think… / This is mainly because… / This means… / For example… / As a result… / Therefore…\n\n六句是你熟悉的练习长度。观点先回答题目，例子只讲一个具体场景。"}, {"title": "最少纠错：完整句、时间、断句", "body": "现在习惯：I usually take photos.\n\n过去经历：I took photos. / We changed our plan. / I felt worried.\n\n未来愿望：I would like to buy a camera.\n\ncan / should / may + 动词原形；enjoy / start + doing；listen to music；many people；much easier。\n\n忘词就换：pavilion → a covered place to sit；adaptation → the film version of a book。\n\n卡住：Let me think for a moment.\n\n纠错：I go—sorry, I went there. 然后继续，不重新说整段。"}, {"title": "考前重复法：不按日期加新任务", "body": "每轮都是同一个顺序：P1 六套核心句 → 换三道题接开头 → P2 任选一个故事走统一结构 → P3 任选一条逻辑回答一题。\n\n先看完整答案，再隐藏答案说，卡住就打开同一张卡对照。只改一个时态和一个断句，再重复一遍。\n\n不需要按日期打卡，不需要每次换新句型。最后阶段以熟悉素材为主。"}], "words": [{"title": "保留的好句：按功能记", "body": "\n### 背景与习惯\n\n- I first heard about it through…：第一次得知。\n- I started doing it because…：开始的原因。\n- I used to…, but now I…：过去与现在。\n- I've been interested in… since…：延续到现在。\n- It's closely related to my major.：和专业有关。\n\n### 具体描述与事件\n\n- To give you a clearer picture, …：补画面。\n- What impressed me most was…：过去最深印象。\n- The hardest part was…：最困难处。\n- Instead of…, we decided to…：调整方案。\n- We split the tasks between us.：分工。\n- We followed the instructions step by step.：逐步操作。\n- It didn't go as planned.：没按计划发展。\n\n### 感受与结果\n\n- I had mixed feelings about it.：复杂感受，后面说明哪两面。\n- I went from feeling… to feeling…：情绪转变。\n- It helped me clear my mind.：理清思绪、放松。\n- It brought us closer.：关系更近。\n- It didn't quite meet my expectations.：未达期待。\n- Looking back, what stays with me is…：真正难忘之处。\n- This experience taught me that…：收获，补具体内容。\n\n### P3 限定和收尾\n\n- One possible reason is…：不把猜测说成唯一原因。\n- This is especially useful for people who…：明确人群。\n- It depends on their needs and budget.：说明 depends on 什么。\n- That may be true for some people, but…：给具体例外。\n- So, overall, A is better for…, while B is better for…：比较结论。\n- Therefore, I think [who] should [action] to [purpose].：建议结论。\n\n先练熟其中 12 句，不必每天换连接词。每题用 2–3 个真正需要的句型就够。\n\n"}, {"title": "易用词、搭配和少量音标", "body": "\n### 词汇按意思选，不是全部替换成“高级词”\n\n- beautiful：lovely（讨喜）、gorgeous /ˈɡɔːdʒəs/（漂亮，如服装）、stunning /ˈstʌnɪŋ/（惊艳，如画面）。不把所有地点都说 breathtaking。\n- good：useful（有用）、practical（实用）、enjoyable（愉快）、effective（有效）。先知道你想表达哪种“好”。\n- interesting：engaging（吸引注意）、inspiring（激励）、informative（提供知识）。动物温暖故事可说 heart-warming。\n- tired：sleepy（困）、mentally tired（脑疲劳）、exhausted /ɪɡˈzɔːstɪd/（很疲惫）。不混为一谈。\n- happy：pleased、relieved /rɪˈliːvd/（松了口气）、proud。一次答案不必反复 over the moon。\n- like：enjoy doing / be interested in / be a fan of。这些并不在所有句子里同义。\n\n### 你的高频话题搭配\n\n- 学习：make notes；review mistakes；break a task into smaller steps；stay focused；find the right method。\n- 朋友：keep in touch；catch up with friends；invite someone over；shared interests；provide support。\n- 艺术：animation /ˌænɪˈmeɪʃn/；footage /ˈfʊtɪdʒ/；creative project；drawings；portfolio /pɔːtˈfəʊliəʊ/。\n- 旅游：visit a museum；long queues；see something in person；worth the effort；local customs。\n- 通勤：commute /kəˈmjuːt/；rush hour；suburbs /ˈsʌbɜːbz/；city centre；travel time。\n- 技术：storage /ˈstɔːrɪdʒ/；install /ɪnˈstɔːl/；tutorial /tjuːˈtɔːriəl/；customer reviews；compare prices。\n- 公园：pavilion /pəˈvɪliən/；bench /bentʃ/；beside the water；without feeling rushed。\n- 电影：plot；character；pacing；adaptation /ˌædæpˈteɪʃn/；high expectations。\n- 节日：fillings；egg yolk /jəʊk/；family reunion；look forward to；celebrate together。\n- 生意：support a family；run a business；setback；opportunity；successful company。\n\n忘记 pavilion 可说 a small covered place to sit。忘记 adaptation 可说 the film version of the book。简单替换后继续说，不重新组织整段。\n\n"}, {"title": "把句型直接说成你的句子", "body": "I first heard about All Creatures Great and Small through social media.\n\nI used to watch it mainly for my English, but now I also enjoy the story.\n\nIt is closely related to my major.\n\nInstead of drawing everything by hand, we decided to combine footage with animation.\n\nWe split the tasks between us.\n\nIt did not quite meet my expectations.\n\nThis experience taught me to follow the instructions step by step.\n\nI would rather buy something useful that lasts than pay extra just for a famous brand."}]};</script><script>const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function md(s){let out=[],list=false,quote=false;function close(){if(list){out.push('</ul>');list=false}if(quote){out.push('</blockquote>');quote=false}}function inline(x){return esc(x).replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')}for(let line of s.split('\n')){if(!line.trim()){close();continue}let m=line.match(/^#{1,4} (.+)$/);if(m){close();out.push('<h3>'+inline(m[1])+'</h3>');continue}m=line.match(/^(?:- |\d+\. )(.+)$/);if(m){if(quote)close();if(!list){out.push('<ul>');list=true}out.push('<li>'+inline(m[1])+'</li>');continue}if(line.startsWith('>')){if(list)close();if(!quote){out.push('<blockquote>');quote=true}out.push(inline(line.replace(/^> ?/,''))+'<br>');continue}close();out.push('<p>'+inline(line)+'</p>')}close();return out.join('')}

in('')}</div>`}
else{const titles={P1:['就用你背过的六套。','保留核心两句，只改接题开头。打开就能看到完整答案，无需另查资料。'],P2:['换故事，不换结构。','沿用 When I saw this topic → To tell you more → Speaking of → As for the highlight → When it comes to why/how → To conclude。'],P3:['六条逻辑，重复套用。','观点 1 句 → 原因 2 句 → 例子 2 句 → 总结 1 句。每张卡都有完整示范答案。']};$('#app').innerHTML=`<section class="hero"><div class="eyebrow">${view} / 通用素材反复练</div><h1>${titles[view][0]}</h1><p>${titles[view][1]}</p></section><div class="filters"><input id="search" type="search" placeholder="搜索话题或具体问题；搜索时覆盖全部答案" aria-label="搜索素材" value="${esc(query)}"><select id="filter" aria-label="熟练程度"><option value="all">全部熟练度</option>${Object.entries(label).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select><button id="random">随机抽题</button></div><div id="results"></div>`;$('#search').oninput=e=>{query=e.target.value;results()};$('#filter').onchange=e=>{filter=e.target.value;results()};$('#random').onclick=random;if($('#coremode')){$('#coremode').onclick=()=>{mode='core';query='';render()};$('#allmode').onclick=()=>{mode='all';render()}}results()}}
function pool(){return DATA.cards.filter(c=>{let relevant=view==='today'?true:view==='exam'?!!c.exam:c.part===view;if(!relevant)return false;if(view==='P1'&&!query&&(c.exam||!(c.core||c.id.startsWith('5-'))))return false;return (filter==='all'||(progress[c.id]?.rate||'new')===filter)&&(`${c.title} ${c.body} ${c.answers} ${c.question||''}`.toLowerCase().includes(query.toLowerCase()))})}
function results(){let cs=pool(),html='';if(view==='P3'&&!query){for(let [prefix,title] of [['7-','六套核心逻辑：反复练'],['8-','十二套扩展逻辑：直接选题练'],['9-','旅游、建筑与收费：四道完整练习']]){let group=cs.filter(c=>c.id.startsWith(prefix));if(group.length)html+='<h2 class="groupheading">'+title+'</h2><div class="grid">'+group.map(card).join('')+'</div>'}}else if(view==='P1'&&!query){html='<div class="grid">'+cs.filter(c=>c.core).map(card).join('')+'</div><h2 class="groupheading">身份、家乡、住处与具体问题：直接练</h2><div class="grid">'+cs.filter(c=>!c.core).map(card).join('')+'</div><p><button data-view="exam">进入真题练习：63题原答案 / 个人版 →</button></p>'}else html='<div class="grid">'+cs.map(card).join('')+'</div>';$('#results').innerHTML=`<p class="muted">${cs.length} 张素材卡 · 全部有完整答案</p>${html}${cs.length?'':'<p class="empty">没有找到符合条件的素材。试试别的关键词或熟练度。</p>'}`}

function random(){let cs=pool();if(cs.length){let c=cs[Math.floor(Math.random()*cs.length)];openCard(c.id,c.qa?Math.floor(Math.random()*c.qa.length):0)}}
function showQuestion(){const qa=current.qa?.[questionIndex];$('#answer').innerHTML='<div class="prose">'+(qa?.original?'<h3>原答案 · 项目已有稿</h3>'+md(qa.original)+'<h3>结合我的经历 · 优先串六套</h3>'+md(qa.answer):md(qa?qa.answer:current.answers))+'</div>';$('#answer').hidden=false;$('#reveal').textContent='隐藏答案，自己说';$('#currentquestion').textContent=qa?qa.question:current.question||current.title;$('#routetag').textContent=qa?.set?'复用第 '+qa.set+' 套 · 后两句沿用原句':current.part==='P1'?'独立短答：这题先回答具体信息':current.part==='P2'?'统一故事结构':'观点 → 原因 → 例子 → 结论';if($('#questionselect'))$('#questionselect').value=questionIndex}
function openCard(id,index=0){current=DATA.cards.find(c=>c.id===id);questionIndex=index;stop();$('#clock').textContent='00:00';$('#modalpart').textContent=current.part+' / '+current.group;$('#modaltitle').textContent=current.title;$('#questionarea').innerHTML=`${current.qa?`<label class="questionlabel" for="questionselect">选择题目（${current.qa.length} 道，均有完整答案）</label><select id="questionselect">${current.qa.map((q,i)=>`<option value="${i}">${i+1}. ${esc(q.question)}</option>`).join('')}</select><div class="questionbuttons"><button id="prevq">上一题</button><button id="nextq">下一题</button></div>`:''}<h3 id="currentquestion"></h3><p id="routetag" class="muted"></p>`;if(current.qa){$('#questionselect').onchange=e=>{questionIndex=Number(e.target.value);showQuestion()};$('#prevq').onclick=()=>{questionIndex=(questionIndex+current.qa.length-1)%current.qa.length;showQuestion()};$('#nextq').onclick=()=>{questionIndex=(questionIndex+1)%current.qa.length;showQuestion()}}$('#cue').innerHTML='<div class="prose">'+md(current.cue)+'</div>';$('#allqa').innerHTML=current.qa?`<details class="cue-details"><summary>本卡全部 ${current.qa.length} 道问答，放在一起对照</summary><div class="prose">${md(current.answers)}</div></details>`:'';showQuestion();$('#notes').value=progress[id]?.notes||'';$('#savehint').textContent='';$('#practice').showModal();$('#practice').scrollTop=0}
function stop(){clearInterval(timer);timer=null}function start(seconds){stop();let end=Date.now()+seconds*1000;function tick(){let n=Math.max(0,Math.ceil((end-Date.now())/1000));$('#clock').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(n===0){stop();$('#clock').textContent='时间到'}}tick();timer=setInterval(tick,250)}
document.addEventListener('click',e=>{let b=e.target.closest('[data-open]');if(b)openCard(b.dataset.open);b=e.target.closest('[data-view]');if(b)navigate(b.dataset.view);b=e.target.closest('[data-rate]');if(b&&current){progress[current.id]={...progress[current.id],rate:b.dataset.rate,date:new Date().toISOString(),notes:$('#notes').value};save();render()}});
$('#reveal').onclick=()=>{$('#answer').hidden=!$('#answer').hidden;$('#reveal').textContent=$('#answer').hidden?'显示完整答案':'隐藏答案，自己说'};$('#close').onclick=()=>$('#practice').close();$('#practice').onclose=stop;$('#prep').onclick=()=>start(60);$('#talk').onclick=()=>start(120);$('#stop').onclick=stop;$('#notes').oninput=()=>{progress[current.id]={...progress[current.id],notes:$('#notes').value};save()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,progress},null,2)],{type:'application/json'}));a.download='雅思口语进度.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let data=JSON.parse(await e.target.files[0].text());if(data.version!==1||!data.progress)throw Error();for(let c of DATA.cards){let v=data.progress[c.id];if(v&&typeof v==='object')progress[c.id]={rate:label[v.rate]?v.rate:'new',notes:typeof v.notes==='string'?v.notes:'',date:typeof v.date==='string'?v.date:''}}save();render();alert('进度已导入')}catch{alert('无法读取备份，请选择本站导出的 JSON 文件')}e.target.value=''};if(views.includes(location.hash.slice(1)))view=location.hash.slice(1);render();window.addEventListener('hashchange',()=>{let next=location.hash.slice(1);if(views.includes(next)&&next!==view)navigate(next)});
</script></body></html>
