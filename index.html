estion": "Do you recycle rubbish, like paper and plastic?", "answer": "I try to separate recyclable paper and plastic when suitable bins are available. I also avoid throwing away things that I can still use. Small habits are easier to keep up regularly.", "set": "", "original": "Yes, I try to. At home, we normally separate recyclable materials such as cardboard, plastic bottles and cans from other household waste."}, {"question": "Do people in your city recycle rubbish?", "answer": "Some people do, especially where there are clearly labelled bins. It is easier when people know what goes where. I would not assume every household follows the same routine.", "set": "", "original": "Yes, many people do. There are different rubbish bins in residential areas, which encourage residents to separate recyclable and non-recyclable waste."}, {"question": "How is rubbish recycled in your city?", "answer": "I keep recyclable items separate from ordinary rubbish and put them in the appropriate bin. I check the label if I am unsure. I do not know all the later processing steps, but I can sort my own waste properly.", "set": "", "original": "As far as I know, people first put different types of rubbish into separate bins. Then it is collected and sent to recycling centres, where recyclable materials can be processed and reused."}, {"question": "Do you often see rubbish on the road?", "answer": "Occasionally, though it depends on the place. I notice it more where there are lots of people passing through. It makes a public space look less pleasant.", "set": "", "original": "Not very often. Most streets in the city are cleaned regularly, so they are generally quite tidy. However, I sometimes see plastic bottles or food packaging in crowded places."}, {"question": "What do you do when you see rubbish on the street?", "answer": "If it is a small, safe item and there is a bin nearby, I can put it in the bin. I would avoid touching anything dangerous. The most important habit is not leaving my own rubbish behind.", "set": "", "original": "If there is a rubbish bin nearby, I may pick it up and throw it away. I think it only takes a few seconds, but it can help keep the environment clean."}, {"question": "Did you recycle when you were a child?", "answer": "I did not understand formal recycling very well then, but I sometimes used paper again for drawing. That was a simple way to avoid wasting it. Now I pay more attention to sorting things properly.", "set": "", "original": "Yes, although I didn’t understand much about recycling at that time. Teachers at school sometimes asked us to collect used paper or plastic bottles, so I gradually developed this habit."}], "exam": true}, {"id": "16-89", "title": "11 Advertisements", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 电视广告常见吗→电视与线上观察。\n- 喜欢的广告→真实广告，不能用采访。\n- 不喜欢的广告→重复或打断视频。\n- 因广告购买过吗→真实物品/票，没有就说没有。\n\n", "answers": "### Do you usually see advertisements on television in your country?\n\n原答案（项目已有稿）\n\nYes, but I think advertisements are much more common on social media nowadays. When I watch videos online, I often see advertisements before or during the video.\n\n结合我的经历\n\nYes, although I notice more advertisements online because I watch videos there. They often appear before or during a programme. Sometimes they interrupt the experience.\n\n### Do you have any favourite adverts that you really like?\n\n原答案（项目已有稿）\n\nYes. One advertisement I really liked was about a Hayao Miyazaki exhibition. I have loved his animation since I was a child, so the beautiful pictures in the advertisement immediately caught my attention.\n\n结合我的经历\n\nI like advertisements with a clear idea and interesting visuals. Because I study digital media art, I notice how the colours and images work together. I prefer an ad that tells me something useful about the product.\n\n### Are there any adverts that you don’t like?\n\n原答案（项目已有稿）\n\nYes, I really dislike repetitive advertisements. Sometimes the same advertisement appears again and again when I’m watching videos, which can be extremely annoying.\n\n结合我的经历\n\nI dislike advertisements that repeat too often or interrupt a video at an awkward moment. They make it harder to enjoy what I am watching. A short, relevant advertisement is easier to accept.\n\n### Have you ever bought something because you saw an advertisement for it?\n\n原答案（项目已有稿）\n\nYes. I once bought a ticket for an exhibition after seeing its advertisement online. The pictures looked stunning, and the exhibition was related to animation, which I’m really interested in.\n\n结合我的经历\n\nAn advertisement can make me notice a product, but I do not buy it for that reason alone. I usually compare prices and read customer reviews first. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you usually see advertisements on television in your country?", "answer": "Yes, although I notice more advertisements online because I watch videos there. They often appear before or during a programme. Sometimes they interrupt the experience.", "set": "", "original": "Yes, but I think advertisements are much more common on social media nowadays. When I watch videos online, I often see advertisements before or during the video."}, {"question": "Do you have any favourite adverts that you really like?", "answer": "I like advertisements with a clear idea and interesting visuals. Because I study digital media art, I notice how the colours and images work together. I prefer an ad that tells me something useful about the product.", "set": "", "original": "Yes. One advertisement I really liked was about a Hayao Miyazaki exhibition. I have loved his animation since I was a child, so the beautiful pictures in the advertisement immediately caught my attention."}, {"question": "Are there any adverts that you don’t like?", "answer": "I dislike advertisements that repeat too often or interrupt a video at an awkward moment. They make it harder to enjoy what I am watching. A short, relevant advertisement is easier to accept.", "set": "", "original": "Yes, I really dislike repetitive advertisements. Sometimes the same advertisement appears again and again when I’m watching videos, which can be extremely annoying."}, {"question": "Have you ever bought something because you saw an advertisement for it?", "answer": "An advertisement can make me notice a product, but I do not buy it for that reason alone. I usually compare prices and read customer reviews first. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D", "original": "Yes. I once bought a ticket for an exhibition after seeing its advertisement online. The pictures looked stunning, and the exhibition was related to animation, which I’m really interested in."}], "exam": true}, {"id": "16-90", "title": "12 Morning routine", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 喜欢早起吗→真实偏好。\n- 童年早起吗→学校时期过去习惯。\n- 每早做什么→两个具体步骤。\n- 最爱一周哪天早晨→自己的课表。\n- 累也早起吗→有早课与没安排分情况。\n\n", "answers": "### Do you like to get up early in the morning?\n\n原答案（项目已有稿）\n\nNot really. I’m not naturally a morning person, especially because I sometimes stay up late working on my school projects. So getting up early can be quite difficult for me.\n\n结合我的经历\n\nNot especially, but I can do it when I have a reason. During an internship, I had to get up at seven because the journey took time. I would prefer an unhurried morning when possible.\n\n### Did you get up early in the morning when you were younger?\n\n原答案（项目已有稿）\n\nYes, I had to. When I was in secondary school, classes started quite early, so I normally got up at around seven in the morning.\n\n结合我的经历\n\nYes, I had to get up in time for school. It was part of the weekday routine rather than a personal choice. On a free day, I preferred having more time to rest.\n\n### What do you do every morning?\n\n原答案（项目已有稿）\n\nNormally, I wash my face, get dressed and have a simple breakfast. After that, I usually check my phone and look at my schedule for the day.\n\n结合我的经历\n\nI get ready and check what I need to do that day. I like knowing which classes or tasks are most important. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### What’s your favourite morning of the week?\n\n原答案（项目已有稿）\n\nDefinitely Sunday morning. I usually don’t have classes, so I can sleep a little longer and enjoy a slow breakfast without worrying about my schedule.\n\n结合我的经历\n\nI like a weekend morning when I do not have an early class. I can take my time and start the day more calmly. That feels like a useful break from a busy week.\n\n### Do you get up early if you feel tired?\n\n原答案（项目已有稿）\n\nOnly if I have to. For example, if I have an early class or something important to do, I will still get up early. Otherwise, I prefer to sleep longer and get enough rest.\n\n结合我的经历\n\nIf I have an early class or an important commitment, yes. If there is no fixed plan, I would rather get enough rest. I think the reason for getting up matters more than doing it just for the sake of it.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you like to get up early in the morning?", "answer": "Not especially, but I can do it when I have a reason. During an internship, I had to get up at seven because the journey took time. I would prefer an unhurried morning when possible.", "set": "", "original": "Not really. I’m not naturally a morning person, especially because I sometimes stay up late working on my school projects. So getting up early can be quite difficult for me."}, {"question": "Did you get up early in the morning when you were younger?", "answer": "Yes, I had to get up in time for school. It was part of the weekday routine rather than a personal choice. On a free day, I preferred having more time to rest.", "set": "", "original": "Yes, I had to. When I was in secondary school, classes started quite early, so I normally got up at around seven in the morning."}, {"question": "What do you do every morning?", "answer": "I get ready and check what I need to do that day. I like knowing which classes or tasks are most important. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F", "original": "Normally, I wash my face, get dressed and have a simple breakfast. After that, I usually check my phone and look at my schedule for the day."}, {"question": "What’s your favourite morning of the week?", "answer": "I like a weekend morning when I do not have an early class. I can take my time and start the day more calmly. That feels like a useful break from a busy week.", "set": "", "original": "Definitely Sunday morning. I usually don’t have classes, so I can sleep a little longer and enjoy a slow breakfast without worrying about my schedule."}, {"question": "Do you get up early if you feel tired?", "answer": "If I have an early class or an important commitment, yes. If there is no fixed plan, I would rather get enough rest. I think the reason for getting up matters more than doing it just for the sake of it.", "set": "", "original": "Only if I have to. For example, if I have an early class or something important to do, I will still get up early. Otherwise, I prefer to sleep longer and get enough rest."}], "exam": true}, {"id": "16-91", "title": "13 Opportunity", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 有很多机会吗→大学项目或实习。\n- 未来想更多吗→专业学习与目标。\n- 重要吗→机会+准备，别说永远必须抓住。\n- 怎样获得→技能、作品、交流。\n- 更多机会会做什么→would + 一个具体行动。\n\n此处保留旧聊天中可读的63个问题入口。Opportunity最后一题的答案被截断，因此保留完整问题的意思并给新的练习方向，不声称恢复了原答案。\n\n", "answers": "### Do you have many opportunities in life?\n\n原答案（项目已有稿）\n\nI think I have had quite a few opportunities so far. For example, university has given me chances to take part in competitions, internships and different academic projects. These experiences have helped me learn a lot outside the classroom.\n\n结合我的经历\n\nUniversity gives me opportunities to work on projects and learn new skills. I can also gain experience through an internship. I think those chances are useful if I put effort into them.\n\n### Would you like to have more opportunities in the future? Why?\n\n原答案（项目已有稿）\n\nDefinitely. I would like to have more opportunities to study abroad and take part in projects related to digital design and AI. They could help me improve my skills and prepare for my future career.\n\n结合我的经历\n\nYes, especially opportunities connected with digital media art. I would like to try more creative projects and learn from people with experience. That would help me decide what kind of work suits me.\n\n### Is it important to seize opportunities when they come?\n\n原答案（项目已有稿）\n\nYes, absolutely. Some opportunities may only appear once, so if we hesitate too much, we may miss them. Even if the result isn’t perfect, we can still gain useful experience.\n\n结合我的经历\n\nYes, but being prepared matters too. A good opportunity is more useful when you have the skills to take part. I would choose something that fits my goals rather than try to accept everything.\n\n### How can you get more opportunities?\n\n原答案（项目已有稿）\n\nI think the most important thing is to prepare yourself well. For example, improving your professional skills and communicating with more people can make it easier to find new opportunities.\n\n结合我的经历\n\nI can improve my skills, build a portfolio and communicate with other people. Showing what I can actually do is important in a creative field. Asking questions and staying open to feedback can help as well.\n\n### What would you do if you had more opportunities?\n\n原答案（项目已有稿）\n\nI would probably try more internships, competitions and exchange programmes. I think these experiences could broaden my horizons and also help me understand what kind of career I really want in the future.\n\n结合我的经历\n\nI would try a project that helped me develop my visual storytelling skills. I would like to work with others and learn how they approach a task. That would give me something concrete to improve, rather than just another item on my schedule.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you have many opportunities in life?", "answer": "University gives me opportunities to work on projects and learn new skills. I can also gain experience through an internship. I think those chances are useful if I put effort into them.", "set": "", "original": "I think I have had quite a few opportunities so far. For example, university has given me chances to take part in competitions, internships and different academic projects. These experiences have helped me learn a lot outside the classroom."}, {"question": "Would you like to have more opportunities in the future? Why?", "answer": "Yes, especially opportunities connected with digital media art. I would like to try more creative projects and learn from people with experience. That would help me decide what kind of work suits me.", "set": "", "original": "Definitely. I would like to have more opportunities to study abroad and take part in projects related to digital design and AI. They could help me improve my skills and prepare for my future career."}, {"question": "Is it important to seize opportunities when they come?", "answer": "Yes, but being prepared matters too. A good opportunity is more useful when you have the skills to take part. I would choose something that fits my goals rather than try to accept everything.", "set": "", "original": "Yes, absolutely. Some opportunities may only appear once, so if we hesitate too much, we may miss them. Even if the result isn’t perfect, we can still gain useful experience."}, {"question": "How can you get more opportunities?", "answer": "I can improve my skills, build a portfolio and communicate with other people. Showing what I can actually do is important in a creative field. Asking questions and staying open to feedback can help as well.", "set": "", "original": "I think the most important thing is to prepare yourself well. For example, improving your professional skills and communicating with more people can make it easier to find new opportunities."}, {"question": "What would you do if you had more opportunities?", "answer": "I would try a project that helped me develop my visual storytelling skills. I would like to work with others and learn how they approach a task. That would give me something concrete to improve, rather than just another item on my schedule.", "set": "", "original": "I would probably try more internships, competitions and exchange programmes. I think these experiences could broaden my horizons and also help me understand what kind of career I really want in the future."}], "exam": true}], "sections": [{"title": "01 使用方法与资料范围", "body": "\n这份资料整合了你提供的四份 PDF、雅思项目中读取到的十个聊天、六个补充分享聊天、项目口语预测资料，以及已整理的外教课堂笔记和两份 Cathy 课堂记录。它是对当前可读取素材的完整整理，不代表已读取项目里每一个历史附件。\n\n资料分成三层：你亲口讲过的事实优先保留；旧聊天中已形成的练习稿用于复用；本次新增的句子和迁移示例属于练习建议。示范答案的感受、动作、时间仍需与你的实际经历一致。未确认的金额、次数、奖项、同行者不当作事实。\n\n2023 Lesley 题库已从学习站移除。保留你自己写并背过的六套串题；真题练习采用项目新增的 13 个主题、63 道题，不承诺当季命中。\n\n原资料没有构成一套完整的最新题库，本整理也不承诺“万能覆盖”。你的任务是看到题目后，挑出能回答它的内容，而不是把背过的故事全部说一遍。\n\n### 每次只这样使用\n\n1. 先读题，圈出对象、时间和限制词：visited / would like / often / least favourite / not a phone。\n2. 找到对应素材，先说一句真正回答题目的话。\n3. 看关键词说，卡住才看完整稿。稿子用于核对，不逐字翻译成中文再背。\n4. 录音回听，只选两个动词错误和一个断句问题重练。\n\n### 6–6.5 的练习重点\n\n官方口语评分包括流利与连贯、词汇、语法范围与准确性、发音，四项等权。逻辑和内容帮助你组织语言，但没有单独的“批判性思维分”。复杂结构、谚语或某个所谓“7分词”都不能保证分数。下面的答案控制难度，具体分数仍取决于现场输出。\n\n核对依据：[IELTS 官方评分说明](https://ielts.org/take-a-test/your-results/ielts-scoring-in-detail)；[官方口语评分描述](https://takeielts.britishcouncil.org/sites/default/files/ielts_speaking_band_descriptors.pdf)。\n\n对你来说，优先级是：完整句 → 时间线清楚 → 原因和例子说具体 → 再增加自然搭配。你已有足够素材，主要需要练到不用同时想着翻译、模板和语法。\n\n"}, {"title": "02 三部分统一结构", "body": "\n### P1：直接答案 + 原因 + 一点细节\n\n通常练 2–4 句；这是练习长度，不是考试规定。频率、时间、金额题先交代所问信息。P1 不必每题说 To conclude。\n\nDo you like art?\n\n> Yes, I do. I've enjoyed drawing since I was a child. I now study digital media art, so I also get to use this interest in my university projects.\n\n注意：I've enjoyed 是从过去延续到现在；study 是现在的身份。不要为了“整段时态一致”把两者都改成过去。\n\n### P2：沿用你的固定转场\n\n保留你熟悉的轨道：When I saw this topic → To tell you more → Personally / In fact → Speaking of → As for the highlight → When it comes to why/how → To conclude。\n\n真正要记的是四格：背景 → 具体内容或经过 → 结果或影响 → 原因和感受。INTRO → WHAT → WHY/HOW 也是同一组织方法，结果可放在 WHAT 末尾。无需另背两套模板。\n\n> When I saw this topic, the first [person/place/experience] that popped up in my mind was…\n> To tell you more about it, …\n> Speaking of what happened, …\n> As for the highlight, …\n> When it comes to how I felt about it, …\n> To conclude, …\n\n你之前明确希望保留这个开头，本整理继续保留。后面直接进入对象和细节，不再接三句空泛介绍。题卡小问仍优先于模板；讲“不喜欢的电影”时，不必说 enjoyed；讲未来物品时，不必说 what happened。\n\nP2 官方准备时间为 1 分钟，长讲为 1–2 分钟。下面各稿是练习底稿，不承诺固定语速下恰好两分钟。用自己的录音计时，若偏短，补一个真实动作和它的结果；不要通过拖长单词凑时长。依据：[IELTS 官方口语形式](https://www.ielts.org/take-a-test/test-types/ielts-academic-test/ielts-academic-format-speaking)。\n\n### P3：继续六句 PREC\n\n你之前希望 5–7 句，原因和例子丰富一些，结尾明显。本整理统一用六句训练：观点 1 句 → 原因 2 句 → 例子 2 句 → 总结 1 句。\n\n1. I think…：直接回答。\n2. This is mainly because…：主要原因。\n3. This means… / When people…, they…：补中间因果。\n4. For example…：谁在什么场景做什么。\n5. This helps them… / As a result…：继续这个例子的后果。\n6. Therefore… / So, overall…：回到原题。\n\n不是现场数句子。比较题可以两方各讲一个差异；追问很具体时可以简短回答。P3 讨论更一般、抽象的问题，个人经历用来举例，随后要回到一般观点。\n\n"}, {"title": "03 你的素材总地图", "body": "\n### 优先练熟的 8 条主线\n\n1. Betty：学习方法 → 分步骤 → 成绩和信心；人物、历史、条理、帮助。\n2. 校庆项目：纯手绘耗时 → 实拍加动画 → 分工；团队、改计划、解决问题。\n3. 学校公园：水边、亭子、长椅 → 散步聊天复习；地点、放松、户外。\n4. 卢浮宫：毕业旅行 → 人多、看画 → 拥挤但值得；旅游、博物馆、艺术。\n5. 月饼：中秋节也是生日 → 亲戚、礼物、团聚；食物、庆祝、家庭。\n6. 相机：妈妈拍童年照片 → 旧相机重 → 想买轻便相机；科技、爱好、记忆。\n7. 父亲：挫折 → 开车养家 → 小店变公司；成功、敬佩、坚持、机会。\n8. 篮球：去支持朋友 → 担心她的伤 → 勇气比比分难忘；赛事、朋友、情绪。\n\n### 第二批保留的素材\n\n《万物生灵》、宫崎骏采访、淘宝、SSD、实习通勤、《飘》、树屋、《大鱼之道》、光污染规定。\n\n不是每天背完全部。前八条覆盖常见内容类型；第二批专门应对“动物故事、未来建筑、法律、不喜欢、技术问题”等限制。\n\n### 不能只换开头的迁移\n\n- 采访不是广告。宫崎骏采访适合 interview / video；广告题需要真实广告内容，以及它推广什么。\n- 线上看过宫崎骏，不等于现实中见过他。met once / in person 必须另找真实经历。\n- 校庆项目不自动等于 competition。若没有正式比赛，讲 project；比赛题优先篮球经历。\n- 过去的暑期通勤不自动满足 you often take。题目问现在常走的路线，需用仍在进行的路线。\n- 树屋是想去的地方，不是已去过的地方；不适合直接答 a place you visited。\n- 电视节目不是书。《万物生灵》看过剧并不意味着读过原著；动物书题用《大鱼之道》。\n- Scarlett 是角色，Vivien Leigh 是电影中的演员。描述现实人物时不能把两者混为一人。\n- “我不喜欢”和“最不喜欢”有区别。least favourite 要明确比较范围和程度。\n\n"}, {"title": "你的 P1 六套：54 个入口完整答案", "body": "### A 听歌散步：休息和恢复\n\n### Do you prefer sad or happy music?\n\nI prefer happy music, especially after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Does happy music make you feel excited?\n\nYes, happy music gives me more energy. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Do you listen to music while doing other things?\n\nYes, I often listen to music when I go out for a walk. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### When do you use headphones?\n\nI mainly use them when I want to relax outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Do you still like going to parks?\n\nYes, the park is one of my favourite places to relax. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What do you like doing in a park?\n\nI like walking around and listening to music. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What do you do in your spare time?\n\nIn my spare time, I like listening to music outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What do you usually do in the evening?\n\nAfter dinner, I like spending a little time outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What do you do when you feel tired?\n\nWhen I feel mentally tired, I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### B 纪录片和教程：把知识看明白\n\n### What is your favourite website?\n\nBilibili is my favourite website for learning something new. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### What kinds of websites do you visit?\n\nI mainly visit video websites, especially Bilibili. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### Do you like science?\n\nYes, especially learning about space and the human body. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### Which science subject interests you?\n\nBiology interests me most because I want to understand how our bodies work. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### Do you enjoy science programmes?\n\nYes, especially documentaries about space and the human body. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### Would you like to learn more about space?\n\nDefinitely, I want to learn more about planets and stars. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### Do you like history?\n\nYes, I enjoy learning how people lived in the past. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### What old building would you like to visit?\n\nI would love to see the Colosseum in Rome because its history interests me. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### C 朋友共同活动：一起做事，更有话聊\n\n### Who do you prefer watching sports with?\n\nI prefer watching sports with my friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Do you prefer watching sports alone or with friends?\n\nDefinitely with friends, because we can enjoy the excitement together. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Is watching a film a good way to spend time with friends?\n\nYes, watching a film together is a great way to spend time with friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Do you like singing?\n\nYes, especially karaoke with friends, because it is fun. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### What do you do in your spare time?\n\nI like meeting friends for a film or a walk. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Are your weekend evenings the same as weekday evenings?\n\nNo, I rest at home on weekdays, but on weekends I often go out with friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Do you prefer shopping malls or street markets?\n\nI prefer street markets because I enjoy exploring them with friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### D 实用与质量：学生预算\n\n### Do you like buying shoes, and how often do you buy them?\n\nYes, but usually only two or three times a year, when I need a new pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### How much do you spend on shoes?\n\nI usually spend around three hundred yuan on a pair of shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you prefer fashionable or comfortable shoes?\n\nI definitely prefer comfortable shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### What kind of clothes do you like wearing?\n\nI like simple, comfortable clothes such as jeans and soft T-shirts. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you prefer casual or formal clothes?\n\nI usually prefer casual clothes, unless it is a formal occasion. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### What kind of headphones do you use?\n\nI use lightweight wireless headphones that fit comfortably. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Is wearing a watch important to you?\n\nFor me, yes, because I can check the time quickly without taking out my phone. It is a practical way to keep track of time. I care more about how well it works than the brand.\n\n### Does a car's colour matter?\n\nNot really, because I care more about how well the car works. For a car, safety and quality would matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Would you buy an expensive car in the future?\n\nOnly if I could afford it and the quality made it worth the money. For a car, safety and quality would matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you like shopping?\n\nYes, but I usually shop only when I actually need something. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### E 童年与家庭：用你的相机和月饼替换泛泛回忆\n\n### Do you keep anything from your childhood?\n\nYes, I still keep family photos from my childhood. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Do you keep old things for a long time?\n\nYes, especially old family photos, because I do not want to lose those memories. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Do photos help you remember things?\n\nYes, old family photos help me remember little things from my childhood. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### What is one of your earliest memories?\n\nOne of my early memories is celebrating my birthday during the Mid-Autumn Festival with my family. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you like going to parks as a child?\n\nYes, I liked going to the park with my family when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you often watch films as a child?\n\nYes, I watched animated films with my family when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### What did you do in the evenings as a child?\n\nI watched cartoons with my family after dinner because it was fun. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you make things out of paper as a child?\n\nYes, I used paper for simple creative activities, especially drawing. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### What did you like doing with paper as a child?\n\nI liked drawing pictures on paper when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you take long trips with your family as a child?\n\nI do not remember a particular long trip clearly, but I do remember enjoying time with my family. My strongest memories are family celebrations and birthdays. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### F 整理与记录：减少忘事和分心\n\n### Do you like keeping things tidy?\n\nYes, I like keeping my space organised. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you keep your study space tidy?\n\nI put my books away and clear my desk after studying. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Is it important to be tidy?\n\nYes, because being organised makes daily life easier. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Where do you keep everyday things?\n\nMy keys go by the door, and my books stay on the shelf. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you have a good memory?\n\nNot really, so I use notes and routines to help me. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember important things?\n\nI make notes on my phone and set reminders for important dates. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember names?\n\nI write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you carry paper and a pen?\n\nYes, I carry a small notebook and a pen to make quick notes. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Have you ever lost your keys?\n\nI have had trouble finding my keys, so I try to keep them in one place now. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you like your home?\n\nYes, mainly because it is tidy and easy to keep organised. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something."}, {"title": "05 P1 必须单独准备的回答", "body": "### 身份和专业\n\nI'm a university student, and I study digital media art. I enjoy it because I can combine art with technology and work on creative projects.\n\n### 家乡与居住：浙江籍贯、成都成长、家和宿舍\n\n### Where are you from?\n\nI am originally from Zhejiang, but I grew up in Chengdu. My family moved there when I was about one year old. So Chengdu is the place I feel most familiar with.\n\n### Where did you grow up?\n\nI grew up in Chengdu, although I am originally from Zhejiang. My family moved to Chengdu when I was about one year old. Most of my childhood memories are connected with the city.\n\n### Do you live in a house or a flat?\n\nMy family home is a house in the suburbs of Chengdu. It is a villa, so there is more space than in my university dormitory. During term time, I stay in the dormitory because it is convenient for my classes.\n\n### Where do you live while studying?\n\nI live in a university dormitory during term time. My family home is a villa in the suburbs of Chengdu. Staying on campus makes it easier to get to classes and work on university projects.\n\n### Do you like your home?\n\nYes, I do. Our house is in the suburbs, and I like having space to relax with my family. At university, my dormitory is more convenient for studying, so the two places suit different parts of my life.\n\n### 频率、时间、金额和距离\n\n### How often do you listen to music?\n\nI listen to music quite often, especially when I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### How much do you spend on shoes?\n\nI usually spend around three hundred yuan on a pair of shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### When was the last time you went running?\n\nI cannot remember the exact last time because I do not run regularly. Walking is a bigger part of my routine. I often choose a short walk when I feel mentally tired.\n\n### How far is your home from school?\n\nI do not have the exact distance in kilometres in mind. For everyday journeys around university, I usually walk, while a trip from home needs more planning. I tend to think about travel time rather than distance.\n\n### Have you ever visited a famous museum?\n\nYes, I visited the Louvre on a graduation trip. There were lots of people, but seeing the paintings in person was worth the effort. It was a memorable experience for me.\n\n### 没做过、不熟悉，也能答\n\nI haven't tried it myself, so I don't know much about it. But I'd be interested in giving it a try."}, {"title": "06 P2 素材卡与练习稿", "body": "### 01 Betty：有条理、喜欢历史、帮助学习\n\nDescribe an organised person you know.\n\nWhen I saw this topic, the first person that popped up in my mind was my friend Betty, who I met in middle school.\n\nTo tell you more about her, she's outgoing and positive, but she's also very organised. Personally, what impresses me most is the way she studies. She doesn't just spend hours memorising things without a plan.\n\nSpeaking of how I noticed this, she once explained her way of learning history to me. First, she watches documentaries to understand the background. Then she reads books and makes simple notes and timelines. This helps her put different events in the right order. Sometimes, she connects what she has learned with things she sees in museums.\n\nAs for the highlight, she breaks a difficult subject into smaller steps. That makes it easier to follow, and she knows what to do next instead of feeling lost.\n\nWhen it comes to why I admire her, I think she shows that learning is about finding the right method as well as working hard. Her approach has encouraged me to plan my own studies more carefully.\n\nTo conclude, Betty is someone I can learn from, and I really admire her patience and ability to stay organised.\n\n### 02 校庆项目：团队、调整计划、微笑的会议\n\nDescribe a time you changed a plan while working with others.\n\nWhen I saw this topic, the first experience that popped up in my mind was a creative project for my university's 120th birthday.\n\nTo tell you more about it, I worked with several teammates on the project. We wanted to make something creative, but we were worried about finishing it on time.\n\nSpeaking of what happened, our original plan involved making the whole project by hand. After trying it, we realised that it would take too much time. The hardest part was deciding what to change without losing our main idea.\n\nAs for the highlight, we had a meeting and listened to everyone's suggestions. We decided to combine real-life footage with animation. We also split the tasks between us, so each person knew what to work on. Once we had a clear plan, we felt more confident and could make progress.\n\nWhen it comes to how I felt about it, I was relieved because we had found a practical solution. I also learned that good teamwork involves listening to other people and being willing to change a plan.\n\nTo conclude, this project taught me that a clear plan and good communication can make a difficult task much more manageable.\n\n### 03 学校读书公园：水边、亭子、长椅\n\nDescribe a place where you like to relax.\n\nWhen I saw this topic, the first place that popped up in my mind was a small park on my university campus.\n\nTo tell you more about it, the park is beside the water. There is a small pavilion and some benches where people can sit and read. Personally, I like it because it's close to my classes and gives me a quiet place to take a break.\n\nSpeaking of what I do there, I usually take a walk, chat with friends or enjoy the sunshine. I also like taking photos because the water and trees make a lovely background. I've even reviewed my notes there when I wanted a change from studying indoors.\n\nAs for the highlight, I can spend time there without feeling rushed. I don't need to organise a long trip or spend much money. Sometimes, a short walk is enough to help me clear my mind.\n\nWhen it comes to why I like it, the main reason is that it fits naturally into my daily life. I can relax there and then return to my work feeling more refreshed.\n\nTo conclude, it's a simple place, but it makes university life more enjoyable for me.\n\n### 04 卢浮宫：拥挤但值得\n\nDescribe a crowded place you visited.\n\nWhen I saw this topic, the first place that popped up in my mind was the Louvre Museum in Paris, which I visited during my graduation trip.\n\nTo tell you more about it, I had learned about the museum through books and documentaries, so I had really wanted to see it. Personally, I was excited because I'm interested in art and design.\n\nSpeaking of what happened, I was surprised by how crowded it was. There were long queues, and the area around the Mona Lisa was especially busy. It was difficult to move around comfortably, so I had to be patient.\n\nAs for the highlight, it was seeing the artworks in person. Looking at them on a screen was very different from actually standing in front of them. I paid attention to the paintings and also enjoyed walking through the galleries.\n\nWhen it comes to how I felt, I had mixed feelings. The crowds made me feel overwhelmed, but the artworks made the visit worthwhile. I would like to go back at a quieter time so I could enjoy the museum more slowly.\n\nTo conclude, it was a crowded but memorable place, and the experience was still worth it for me.\n\n### 05 篮球比赛：支持朋友，担心受伤\n\nDescribe a sports event you watched.\n\nWhen I saw this topic, the first event that popped up in my mind was a basketball match I watched in high school.\n\nTo tell you more about it, the match was held on our school basketball court. Personally, I was especially excited because a close friend was taking part, and I wanted to support her.\n\nSpeaking of what happened, we sat quite close to the court, so we could feel the energy of the crowd. Everyone was cheering, and it was very different from watching a match on a screen.\n\nAs for the highlight, it was my friend's performance. A few days before the match, her glasses had been knocked off during practice, and she had been slightly injured. I was worried about her, so I paid more attention to how she was doing than to the score. Watching her on the court made me feel proud of her courage.\n\nWhen it comes to why I remember it, it was more than just a sports event for me. I was there for someone I cared about, and I could see how much effort she had put into it.\n\nTo conclude, what stays with me is my friend's courage and the lively atmosphere, more than the final score.\n\n### 06 宫崎骏采访：童年喜欢动画，现在关注创作\n\nDescribe an interview you watched and found interesting.\n\nWhen I saw this topic, the first interview that popped up in my mind was an interview with Hayao Miyazaki, a Japanese animation director.\n\nTo tell you more about it, I watched it online during a study break. Personally, I was interested in how he got ideas for his films because I had liked his work since I was a child.\n\nSpeaking of the interview, he talked about his drawings and the work behind his animated films. His films have beautiful pictures, but they also tell warm and meaningful stories. That's why I wanted to learn more about the process.\n\nAs for the highlight, it was hearing about the time and patience involved in creating animation. When I was younger, I enjoyed copying drawings from his films. Listening to him made me think about the effort behind the pictures I had enjoyed.\n\nWhen it comes to why I liked it, I found it inspiring as a digital media art student. It reminded me that creative work takes practice and that I shouldn't expect every project to be easy.\n\nTo conclude, the interview was interesting and encouraged me to keep improving my own work.\n\n### 07 SSD：技术问题与共同解决\n\nDescribe a difficult technical problem you tried to solve.\n\nWhen I saw this topic, the first experience that popped up in my mind was a time when my friend and I tried to install a new SSD in my computer.\n\nTo tell you more about it, we had originally planned to watch a film together. But the computer was running very slowly, and its storage space was almost full. I had been thinking about upgrading it, so we decided to work on the problem.\n\nSpeaking of what we did, we looked for a tutorial and followed the instructions step by step. My friend helped me check each stage. I was nervous because I didn't want to damage the computer, and there were several things I didn't understand at first.\n\nAs for the highlight, we stopped rushing and checked the instructions more carefully. Working together made the task feel less stressful than trying to do everything on my own.\n\nWhen it comes to how I felt, I enjoyed having someone to help me. Even though the evening didn't go as planned, we spent time solving a problem together, and that made it memorable.\n\nTo conclude, the experience showed me the value of clear instructions, patience and teamwork when dealing with technology.\n\n### 08 实习通勤：1.5 小时、7 点起床、9:30 上班\n\nDescribe a long journey you made regularly in the past.\n\nWhen I saw this topic, the first journey that popped up in my mind was my daily commute during a summer internship.\n\nTo tell you more about it, my home was in the suburbs, while the company was in the city centre. It took about an hour and a half to get there by subway. Work started at 9:30, so I usually had to get up at around seven.\n\nSpeaking of the journey, the subway was very crowded during the morning rush hour. After getting up early, I still had a long journey before the working day began. That was the part I found most tiring.\n\nAs for the highlight, it was spending so much time travelling every day. The journey took up time that I could otherwise have used for resting or doing something I enjoyed.\n\nWhen it comes to how I felt, I had mixed feelings about the internship. I enjoyed learning new things at work, but the commute was exhausting. If I could change one thing, I would live closer to the company.\n\nTo conclude, the internship was useful, but travelling to work was the part I liked the least.\n\n### 09 《飘》：喜欢原著，电影未达期待\n\nDescribe a film that did not meet your expectations.\n\nWhen I saw this topic, the first movie that popped up in my mind was Gone with the Wind.\n\nTo tell you more about it, I read the novel when I was in primary school and really enjoyed it. Later, I watched the film version, so I had high expectations because I already loved the story.\n\nSpeaking of what it is about, it follows Scarlett O'Hara and her life, relationships and struggles. The costumes are gorgeous, and some scenes look stunning. Personally, I could understand why the film is so well known.\n\nAs for the highlight of the comparison, some relationships and important details didn't feel as clear as they did in the book. Even though the film is very long, I still felt that it couldn't show everything I had enjoyed in the novel. That made parts of the story difficult for me to follow.\n\nWhen it comes to why I was disappointed, my expectations were probably too high. I wanted the same depth I had found in the book, and the film didn't quite give me that.\n\nTo conclude, I definitely prefer the book, and the film was disappointing to me as an adaptation.\n\n### 10 《万物生灵》：学英语 → 动物与乡村 → 温暖放松\n\nDescribe a TV programme you enjoy watching.\n\nWhen I saw this topic, the first TV show that popped up in my mind was All Creatures Great and Small, a British TV series.\n\nTo tell you more about it, I first heard about it on social media. People recommended it as an interesting show for learning English, so I started watching it mainly to improve my pronunciation and vocabulary.\n\nSpeaking of the story, it follows a young vet working in the British countryside. He takes care of different animals and gradually gets to know the local community. The story is not only about animals. It also talks about friendship, family and the relationships between people and animals.\n\nAs for the highlight, I became interested in the story itself after a few episodes. At first, I watched it for my English, but it was more heart-warming than I expected. It also reminded me that animals need care and patience.\n\nWhen it comes to why I like it, the countryside and the warm relationships make the show peaceful and relaxing. I can enjoy the story and learn useful English expressions at the same time.\n\nTo conclude, All Creatures Great and Small is both entertaining and meaningful to me, and that is why I enjoy watching it.\n\n### 11 淘宝：从浏览到比较价格和评价\n\nDescribe a useful app you use.\n\nWhen I saw this topic, the first app that popped up in my mind was Taobao, an online shopping app.\n\nTo tell you more about it, I first noticed it on my parents' phone when I was in primary school. Its orange icon caught my attention. At first, I just enjoyed looking at interesting things because I didn't have money to buy them myself.\n\nSpeaking of how I use it now, I look for things I need and compare different products. I can check prices and read customer reviews without going to several shops. This is useful when I'm busy with my studies.\n\nAs for the highlight, it's being able to see different people's experiences with a product. The reviews don't guarantee that everything is good, but they can help me notice possible problems before I decide.\n\nWhen it comes to why I like it, it saves time and gives me more options. As a student, I also find it helpful to compare prices and stay within my budget.\n\nTo conclude, Taobao is a practical app for me because it makes everyday shopping easier to organise.\n\n### 12 树屋：网上见过，想短期入住\n\nDescribe an unusual building you would like to stay in.\n\nWhen I saw this topic, the first building that popped up in my mind was a tree house I saw online.\n\nTo tell you more about it, I found it on a travel website. It was in a forest, far from the city. Personally, I was attracted by its design because it looked very different from an ordinary house.\n\nSpeaking of what it looked like, it was mainly made of wood and stood high above the ground. There was a wooden ladder and some large windows overlooking the trees. I don't know much about its history, but it looked like an interesting place to stay for a holiday.\n\nAs for the highlight, I'd like to spend a few days enjoying the surroundings and taking photos. As a design student, I would also enjoy looking more closely at the building itself.\n\nWhen it comes to why I like it, it seems peaceful and close to nature. However, it might be inconvenient for everyday life because shops and other facilities could be far away.\n\nTo conclude, I would love to stay there for a short holiday, although I wouldn't choose it as my permanent home.\n\n### 13 《大鱼之道》：迁徙与下一代\n\nDescribe an interesting animal story you read.\n\nWhen I saw this topic, the first story that popped up in my mind was a Chinese animal story called Da Yu Zhi Dao, written by Shen Shixi.\n\nTo tell you more about it, I first read it when I was in primary school. His animal stories were popular at school, and our teachers often recommended them. Personally, I found stories about animals easy to become interested in.\n\nSpeaking of the story, it is about a large fish making a difficult journey to another place to lay eggs. The fish has to keep moving despite the difficulties. The part I remember most is that the journey is connected with the survival of the next generation.\n\nAs for the highlight, it was the fish's determination. I wasn't just reading about an animal moving from one place to another. I was thinking about how much effort it made for its young.\n\nWhen it comes to why I remember it, I found it touching. It made me think more carefully about animals and the challenges they face. It also reminded me that important goals sometimes require patience and effort.\n\nTo conclude, it is a meaningful story that has stayed in my memory since childhood.\n\n### 14 光污染新规定：控制不必要的灯光\n\nDescribe a new rule you would like to introduce.\n\nWhen I saw this topic, the first rule that popped up in my mind was a rule to reduce unnecessary lighting at night.\n\nTo tell you more about it, I would like cities to control very bright advertising screens and lights on buildings. Personally, I think a city should be comfortable to live in as well as attractive to look at.\n\nSpeaking of the rule itself, shops and offices would turn off unnecessary lights after a set time, such as 11 p.m. Large advertising screens would also reduce their brightness. Important street lights and traffic lights would stay on for safety.\n\nAs for the highlight, people living nearby might find their bedrooms darker and more comfortable at night. It could also reduce wasted electricity. The aim would be to use lighting more carefully, rather than make the whole city dark.\n\nWhen it comes to why I want this rule, I think residents' needs should be considered. Some businesses might worry about losing attention, so clear guidelines would help them understand what to change.\n\nTo conclude, I would support a practical rule that balances useful lighting with a more comfortable environment.\n\n### 15 月饼与中秋节：你的生日记忆\n\nDescribe a traditional food that is special to you.\n\nWhen I saw this topic, the first food that popped up in my mind was mooncakes, which people eat during the Mid-Autumn Festival.\n\nTo tell you more about them, mooncakes are a traditional Chinese pastry. They are usually round and have different fillings, such as egg yolk, nuts or sweet bean paste. Personally, they are special to me because my birthday falls on the Mid-Autumn Festival.\n\nSpeaking of my childhood memories, I always looked forward to that day. I could see my relatives, spend time with my family and receive birthday gifts. So the festival felt like both a family celebration and a birthday celebration for me.\n\nAs for the highlight, they are part of the festival tradition, and their round shape is associated with family reunion. Sharing them is also a way to express good wishes.\n\nWhen it comes to how I feel about them, I think of the warm moments I spent with my family. The food matters to me because of those memories, rather than just its taste.\n\nTo conclude, mooncakes remind me of my childhood and make this festival especially meaningful to me.\n\n### 16 父亲的生意：重新开始，坚持与机会\n\nDescribe a successful person you know.\n\nWhen I saw this topic, the first person that popped up in my mind was my father, who built his own business.\n\nTo tell you more about him, my family moved to Chengdu when I was about one year old. At first, he trusted the wrong person and lost a lot of money. It was a difficult time for our family.\n\nSpeaking of what he did next, he didn't give up. He worked as a taxi driver and later as a truck driver to support us. After that, he noticed an opportunity in electronic equipment and started a small business.\n\nAs for the highlight, the small shop gradually developed into a company after years of hard work. To me, that shows his determination. He had to rebuild his life instead of starting with everything already in place.\n\nWhen it comes to why I admire him, it isn't only because the business grew. I respect the way he kept going and looked for a new opportunity. When I find my studies difficult, his story reminds me not to give up too quickly.\n\nTo conclude, my father is a successful businessperson in my eyes because he overcame setbacks and built something through his own effort.\n\n### 17 想拥有的相机：妈妈、童年照片、自己的旅行\n\nDescribe something you would like to buy.\n\nWhen I saw this topic, the first piece of technology that popped up in my mind was a lightweight digital camera I'd like to own.\n\nTo tell you more about it, my mother has always enjoyed taking photos. She bought a camera when I was young and used it to record many moments from my childhood. Personally, I think that helped me become interested in photography.\n\nSpeaking of what I want now, I don't have a camera of my own. My mother's old camera is quite heavy, so I would like something smaller and easier to carry. I don't need the most expensive model, but I want it to take clear photos.\n\nAs for the highlight, I would take it on trips and record scenery, buildings and moments with friends and family. It would also be useful for my university projects because I study digital media art.\n\nWhen it comes to why I want it, photography is both a personal hobby and something connected with my studies. Looking at my mother's old pictures reminds me how valuable these memories can be.\n\nTo conclude, I hope to own a camera that helps me record my life and is light enough to take with me."}, {"title": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "### 01 具体呈现 → 理解 → 记住\n\nCan movies help people understand a country's culture?\n\nYes, I think films can help people understand a country's culture.\nThis is because they show traditions through everyday situations.\nViewers can see how people behave and communicate, which makes those traditions easier to understand.\nFor example, a film may show a family celebrating a local festival.\nBy watching what they eat and how they interact, viewers can learn about local customs.\nSo, overall, films can be useful for learning about culture, although one film can't represent an entire country.\n\n### 02 共同经历 → 有话聊 → 更亲近\n\nWhy are family celebrations important?\n\nI think family celebrations help relatives stay connected.\nThis is mainly because people may be too busy to meet regularly.\nA celebration gives them a reason to spend time together and catch up.\nFor example, a family may have dinner together during the Mid-Autumn Festival.\nThey can share food and talk about what has happened in their lives.\nTherefore, these occasions can strengthen relationships through regular contact.\n\n### 03 时间与预算 → 便利；现场 → 体验\n\nWhat are the differences between watching films at home and in a cinema?\n\nI think the main differences are flexibility and the viewing experience.\nAt home, people can pause a film and choose when to watch it.\nCinemas offer a larger screen and more powerful sound, but involve extra cost and travel.\nFor example, parents with young children may prefer watching at home because they can take breaks.\nSomeone watching an action film may prefer the cinema for the screen and sound.\nSo, overall, the better choice depends on whether people value flexibility or the cinema experience more.\n\n### 04 自己尝试 → 作决定 → 提高能力\n\nAre books better than films for developing imagination?\n\nI think books often give people more room to use their imagination.\nThis is because readers have to picture the characters and places for themselves.\nFilms already provide many of those visual details, so viewers have fewer gaps to fill.\nFor example, two people reading the same novel may imagine a character differently.\nEach person creates their own picture from the writer's descriptions.\nTherefore, books can be especially useful for imagination, although films can inspire creative ideas too.\n\n### 05 依赖信息 → 错误会误导 → 核实\n\nShould documentary films be truthful?\n\nI think documentaries should be factually accurate.\nPeople often watch them to learn about the real world.\nIf important information is wrong, viewers may accept it as fact.\nFor example, students may use a wildlife documentary as a learning resource.\nIncorrect information could then affect their understanding in class.\nTherefore, filmmakers should check their facts and make clear where an interpretation is being offered.\n\n### 06 需求与经历不同 → 选择不同\n\nDo people's movie preferences change as they get older?\n\nYes, I think preferences may change as people get older.\nThis is partly because their interests and life experience change.\nThey may become more interested in stories that relate to their own lives.\nFor example, some children enjoy animated adventures, while some adults prefer stories about work or family.\nThose adults may understand the characters' problems because they have had similar experiences.\nSo, overall, age can influence preferences, although personal taste still matters."}, {"title": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "### 01 性格与处境：解释行为差异\n\nWhy do different people enjoy different types of films?\n\nI think people's personalities and experiences affect their taste in films. Some people want excitement, while others want a relaxing story. Their current mood can also influence what they choose. For example, a student who feels tired may prefer a light comedy. Someone interested in history may choose a film set in the past. So, overall, there is no single type of film that suits everyone.\n\n### 02 父母以身作则：行为可模仿\n\nHow can parents encourage children to develop good habits?\n\nI think parents can encourage good habits by setting an example. Children can see what their parents actually do every day. This makes the advice easier to understand and follow. For example, parents who put their things away can show children how to keep a room organised. They can also involve children in a small task instead of only giving instructions. Therefore, showing a habit consistently can be more effective than repeating a rule.\n\n### 03 科技影响：减少步骤、增加选择、扩大接触\n\nHow has technology changed the way people learn?\n\nI think technology has made learning more accessible and easier to understand in some ways. People can find information without travelling to a particular place. Pictures and videos can also explain an idea more clearly than words alone. For example, a student can watch a short documentary about history on Bilibili. The images can help them connect events and remember the information. So, overall, technology is useful when people choose reliable content and use it actively.\n\n### 04 替代与消失：主要功能之外，还有什么价值\n\nWill online visits replace real museums?\n\nI do not think online visits will completely replace real museums. Online information is convenient, but being there offers a different experience. People can see the size and details of an object more clearly in person. For example, someone interested in art may enjoy looking at a painting at the Louvre. That experience may be more memorable than seeing a small picture on a phone. Therefore, online visits are a useful addition, but physical museums still have value.\n\n### 05 时间有限与即时娱乐：短期回报和长期目标\n\nWhy do people sometimes choose entertainment instead of learning?\n\nI think entertainment often gives people a quicker feeling of enjoyment. Learning something difficult can require time and concentration. When people are tired, an easy activity may feel more attractive. For example, a student may watch short videos after working on a project. If they keep scrolling, they may postpone the study they planned to do. So, overall, a clear limit and a manageable learning task can help people balance the two.\n\n### 06 传统：传承 + 当下的功能\n\nWhy is it important to keep traditions?\n\nI think traditions matter because they connect people with family and shared memories. A familiar activity can give people a reason to meet and celebrate. It also helps younger people understand something about their culture. For example, families can share mooncakes during the Mid-Autumn Festival. The food becomes connected with reunion and time spent together. Therefore, traditions are useful when they still have meaning in people's lives.\n\n### 07 应不应该：价值、代价和条件\n\nShould children be required to learn a musical instrument?\n\nI think children should have the chance to try an instrument, but they should have some choice. Music can help them express themselves and discover an interest. However, pressure may make the activity stressful instead of enjoyable. For example, a school could offer a short course with several instruments to try. Children could then continue with one they actually enjoy. So, overall, encouragement and access are more useful than forcing every child to follow the same path.\n\n### 08 节俭与保留旧物：经济价值或情感价值\n\nWhy do people keep old things?\n\nI think people keep old things for both practical and emotional reasons. An item that still works may save the cost of buying a new one. Other things are important because they remind people of someone or something. For example, a parent may keep a camera used to take childhood photos. Even when it feels heavy or old, it can still be connected with family memories. Therefore, an old item's value is not always the same as its selling price.\n\n### 09 沟通与情绪支持：让对方感到被听见\n\nHow can people make a team discussion more effective?\n\nI think careful listening and a respectful tone make a discussion more effective. People need to feel comfortable enough to explain their ideas. Clear questions can also help the team understand a problem before deciding. For example, students working on a school video can discuss why hand-drawn animation is taking too long. They may then agree to combine real footage with animation and share the tasks. Therefore, good communication helps a team find a practical solution together.\n\n### 10 真诚与行动：不要只看一句话\n\nWhat makes an apology sincere?\n\nI think a sincere apology includes responsibility and an effort to change. Saying sorry matters, but the person also needs to understand the effect of their behaviour. Otherwise, the same problem may happen again. For example, someone who misses a team deadline could explain the mistake and help finish the work. Meeting the next deadline would show that the apology led to action. So, overall, behaviour after an apology is more useful than the words alone.\n\n### 11 体验价值：为什么愿意花额外时间和钱\n\nWhy do people pay to watch sport in person?\n\nI think watching sport in person offers an atmosphere that a screen cannot fully provide. People can hear the crowd and share the excitement with others. Supporting someone they know can make the event more personal. For example, a student may go to a basketball game to support a close friend. The friend's effort may become a stronger memory than the final score. Therefore, people sometimes pay for the whole experience rather than just the view of the game.\n\n### 12 解决问题：责任主体 + 具体动作 + 为什么有效\n\nWhat can cities do to reduce unnecessary light at night?\n\nI think cities can set clear rules for unnecessary lighting while keeping public spaces safe. Some bright advertising lights are not needed throughout the night. Reducing them can make it easier for residents to rest. For example, shops could turn off nonessential lights after eleven. Street lighting needed for safe travel should still remain. Therefore, the aim should be a practical balance between safety and reducing unnecessary light."}, {"title": "09 旅游、建筑与收费：项目原四题重整", "body": "### Should all scenic spots charge an entry fee?\n\nShould all scenic spots charge an entry fee?\n\nI don't think every scenic spot should follow the same rule.\nSome places need money for maintenance, while public access is also important.\nA reasonable fee can help cover costs, but a high fee may exclude people on a limited budget.\nFor example, a natural attraction could use ticket income to maintain paths and clean facilities.\nIt could also offer discounts or some free entry times.\nSo, overall, fees should depend on the site's costs and purpose, rather than be identical everywhere.\n\n### Is it necessary for tourists to visit landmarks?\n\nIs it necessary for tourists to visit landmarks?\n\nI don't think visiting landmarks is necessary for every tourist.\nPeople travel for different reasons, and not everyone wants the same experience.\nSome prefer famous sights, while others value food, nature or a slower pace.\nFor example, someone who enjoys art may want to visit the Louvre.\nAnother visitor may prefer walking around a local neighbourhood and trying food.\nTherefore, tourists should choose activities that match their interests.\n\n### Which do most people prefer, houses or tall buildings?\n\nWhich do most people prefer, houses or tall buildings?\n\nIt's hard to say what most people prefer, because needs and budgets differ.\nSome people value the space and privacy a house can offer.\nOthers prefer a flat near their work or university because it reduces travel time.\nFor example, a family may want extra space, while a student may prioritise location.\nThe actual cost also depends on the area and size of the property.\nSo, overall, people's circumstances are more useful to consider than a single universal preference.\n\n### Why do people like visiting historical places?\n\nWhy do people like visiting historical places?\n\nI think one reason is that historical places make the past feel more concrete.\nPeople can see buildings and objects instead of only reading descriptions.\nThis can help them understand how people lived in a different period.\nFor example, a visitor may see old tools or rooms in a museum.\nConnecting those objects with a story can make the information easier to remember.\nTherefore, these visits can be both enjoyable and educational."}, {"title": "10 保留的好句：按功能记", "body": "\n### 背景与习惯\n\n- I first heard about it through…：第一次得知。\n- I started doing it because…：开始的原因。\n- I used to…, but now I…：过去与现在。\n- I've been interested in… since…：延续到现在。\n- It's closely related to my major.：和专业有关。\n\n### 具体描述与事件\n\n- To give you a clearer picture, …：补画面。\n- What impressed me most was…：过去最深印象。\n- The hardest part was…：最困难处。\n- Instead of…, we decided to…：调整方案。\n- We split the tasks between us.：分工。\n- We followed the instructions step by step.：逐步操作。\n- It didn't go as planned.：没按计划发展。\n\n### 感受与结果\n\n- I had mixed feelings about it.：复杂感受，后面说明哪两面。\n- I went from feeling… to feeling…：情绪转变。\n- It helped me clear my mind.：理清思绪、放松。\n- It brought us closer.：关系更近。\n- It didn't quite meet my expectations.：未达期待。\n- Looking back, what stays with me is…：真正难忘之处。\n- This experience taught me that…：收获，补具体内容。\n\n### P3 限定和收尾\n\n- One possible reason is…：不把猜测说成唯一原因。\n- This is especially useful for people who…：明确人群。\n- It depends on their needs and budget.：说明 depends on 什么。\n- That may be true for some people, but…：给具体例外。\n- So, overall, A is better for…, while B is better for…：比较结论。\n- Therefore, I think [who] should [action] to [purpose].：建议结论。\n\n先练熟其中 12 句，不必每天换连接词。每题用 2–3 个真正需要的句型就够。\n\n"}, {"title": "11 易用词、搭配和少量音标", "body": "\n### 词汇按意思选，不是全部替换成“高级词”\n\n- beautiful：lovely（讨喜）、gorgeous /ˈɡɔːdʒəs/（漂亮，如服装）、stunning /ˈstʌnɪŋ/（惊艳，如画面）。不把所有地点都说 breathtaking。\n- good：useful（有用）、practical（实用）、enjoyable（愉快）、effective（有效）。先知道你想表达哪种“好”。\n- interesting：engaging（吸引注意）、inspiring（激励）、informative（提供知识）。动物温暖故事可说 heart-warming。\n- tired：sleepy（困）、mentally tired（脑疲劳）、exhausted /ɪɡˈzɔːstɪd/（很疲惫）。不混为一谈。\n- happy：pleased、relieved /rɪˈliːvd/（松了口气）、proud。一次答案不必反复 over the moon。\n- like：enjoy doing / be interested in / be a fan of。这些并不在所有句子里同义。\n\n### 你的高频话题搭配\n\n- 学习：make notes；review mistakes；break a task into smaller steps；stay focused；find the right method。\n- 朋友：keep in touch；catch up with friends；invite someone over；shared interests；provide support。\n- 艺术：animation /ˌænɪˈmeɪʃn/；footage /ˈfʊtɪdʒ/；creative project；drawings；portfolio /pɔːtˈfəʊliəʊ/。\n- 旅游：visit a museum；long queues；see something in person；worth the effort；local customs。\n- 通勤：commute /kəˈmjuːt/；rush hour；suburbs /ˈsʌbɜːbz/；city centre；travel time。\n- 技术：storage /ˈstɔːrɪdʒ/；install /ɪnˈstɔːl/；tutorial /tjuːˈtɔːriəl/；customer reviews；compare prices。\n- 公园：pavilion /pəˈvɪliən/；bench /bentʃ/；beside the water；without feeling rushed。\n- 电影：plot；character；pacing；adaptation /ˌædæpˈteɪʃn/；high expectations。\n- 节日：fillings；egg yolk /jəʊk/；family reunion；look forward to；celebrate together。\n- 生意：support a family；run a business；setback；opportunity；successful company。\n\n忘记 pavilion 可说 a small covered place to sit。忘记 adaptation 可说 the film version of the book。简单替换后继续说，不重新组织整段。\n\n"}, {"title": "12 你的纠错清单：每个答案只抓三件事", "body": "\n### 第一类：时间和动词\n\n- The first time I saw it is online → I first saw it online.\n- I became to watching → I started watching / I began watching。\n- I was have high expectations → I had high expectations。\n- When I was in childhood → When I was a child。\n- We have meet → We've met / We met，按时间选。\n- He became to do the taxi driver → He started working as a taxi driver。\n- My family is very poverty → My family was very poor。\n\n### 第二类：主语、谓语和词性\n\n- The story is telling about → The story is about… / The story follows…。\n- It also have… → It also has…。\n- The film can made people… → The film can help people…。\n- People are prefer… → People prefer…。\n- Many person → Many people。\n- Very easier → Much easier。\n- Successed business → Successful business。\n- Make me without bored → Help me feel less bored。\n- Make me person impressed → Impress me / Leave a strong impression on me。\n\n### 第三类：搭配和完整句\n\n- listen music → listen to music。\n- different inner → different fillings。\n- shopping outfit → shopping app。\n- near the nature → close to nature。\n- combine a ladder → climb a ladder。\n- impression（印象）与 inspiration（灵感）分清。\n- animator（动画创作者）与 animation（动画）分清。\n- fun（好玩）与 funny（好笑）分清。\n- in conclude → In conclusion / To conclude / So, overall。\n- Because…, so…：练习时择一使用，不在一个简单句里两头重复。\n\n### 过去、现在、未来三句练习\n\n> I usually take photos in the park.\n> I took some photos there last weekend.\n> I'd like to take more photos with my own camera in the future.\n\n> I first read the story in primary school.\n> I still remember the main idea.\n> I'd like to read more animal stories in the future.\n\n你的时间变了，时态才变；不是每句话都固定过去时。\n\n### 断句示范\n\n> We changed our plan. / We combined footage with animation. / Then we split the tasks between us.\n\n先三句说稳，再合并：We changed our plan by combining footage with animation。不要一口气用 and 接六个意思。\n\n"}, {"title": "13 考前循环复习：重复熟悉素材", "body": "每轮都是同一个顺序：P1 六套核心句 → 换三道题接开头 → P2 任选一个故事走统一结构 → P3 任选一条逻辑回答一题。\n\n先看完整答案，再隐藏答案说，卡住就打开同一张卡对照。只改一个时态和一个断句，再重复一遍。\n\n不需要按日期打卡，不需要每次换新句型。最后阶段以熟悉素材为主。"}, {"title": "14 资料核对与下一步更新位置", "body": "\n### 已纳入的项目聊天\n\n《绝望主妇素材整理》《回答文件新题》《描述童年朋友》《宫崎骏广告描述》《篮球比赛经历分享》《整理Gone with the Wind》《电脑硬盘更换挑战》《巴黎旅行素材建议》《读书公园素材套用》《会议 微笑的场合 不能用手机》。按聊天原名列出；名字不必等于最终主题。\n\n六个分享补充：《大鱼之道故事解析》《树屋》《减少光污染规定》《月饼与中秋节》《成功的父亲故事》《景点收费探讨》。其中最后一个还包含你想拥有相机的个人事实。\n\n### 本地参考材料\n\n- 四份指定 PDF：P3 万能逻辑、Lesley 2023 P1、P3 六句练习版、P1 六套回答。\n- 项目 sources 中口语预测 PDF：用于题型与索引，不采纳其“必考”“契合度”等保证。\n- 两份 Cathy 课堂记录与已有《口语课堂整合笔记与口头练习》：用于识别你的实际语言错误。三份菲律宾课堂 PDF 为图片扫描，本次未重新逐页转写；相关内容使用已整理笔记，不能声称本次重新核对了全部扫描页。\n- 项目《4-10答案词》《11-18答案词》为听力答案词表；未把其中词条随意变成口语个人经历。作文文件不作为口语事实来源。\n\n### 仍需本人定准的内容\n\nBetty 相识年龄；卢浮宫同行者；校庆本人职责；是否真正禁止手机；SSD 购买时间和真实结局；篮球最终结果；父亲具体产品；相机预算；\n\n这些不妨碍开始练习，遇到相关卡片再补准。先固定一个事实版本，避免今天“朋友”、明天“家人”，或今天“提前买 SSD”、明天“临时下楼买”。\n\n独立聊天《项目计划的调整》尚未直接读取，相关内容从校庆聊天纳入，未伪称已读取全部项目。原聊天附件《64句》等只有引用、没有完整正文时，仅采用实际可读的句子，不声称已审核整份附件。\n\n你的第一轮练习建议：学校公园 → 月饼 → 相机。三条故事事实清晰，又能连续练现在习惯、童年过去和未来愿望。\n\n\n"}, {"title": "16 项目新增 P1：13 个主题、63 个完整问题", "body": "### 01 Vegetables\n\n### Do you like eating vegetables? How often?\n\n原答案（项目已有稿）\n\nYes, I do. I eat vegetables almost every day because I think they are good for my health. For example, I usually have some green vegetables with lunch and dinner.\n\n结合我的经历\n\nYes, I generally like vegetables and try to include them in everyday meals. They make a meal feel more balanced. I prefer a simple preparation rather than a very complicated dish.\n\n### Were there any vegetables you disliked when you were young?\n\n原答案（项目已有稿）\n\nYes. When I was a child, I really disliked carrots because I didn’t like their taste. But now I’m okay with them because I know they contain a lot of vitamins.\n\n结合我的经历\n\nI was less keen on vegetables with a bitter taste when I was a child. I preferred milder flavours. My tastes have become more flexible as I have grown older.\n\n### Where do you usually buy vegetables?\n\n原答案（项目已有稿）\n\nNormally, my family buys vegetables from a local market near our home. The vegetables there are usually quite fresh, and there are many different kinds to choose from.\n\n结合我的经历\n\nAt university, I usually get vegetables as part of a meal rather than buy them separately. When I am at home, my family does more of the food shopping. Convenience matters because I am still a student.\n\n### Do people around you grow their own vegetables?\n\n原答案（项目已有稿）\n\nYes, some of them do. I live in a relatively quiet area outside the city centre, so some people have enough space to grow vegetables in their gardens. They may grow tomatoes, green vegetables or peppers.\n\n结合我的经历\n\nI do not know anyone around me who grows vegetables regularly. Most people I know buy them instead. Growing them sounds interesting, but it needs space and time.\n\n### Where do people usually buy vegetables?\n\n原答案（项目已有稿）\n\nI think most people buy them from supermarkets or local markets. Supermarkets are convenient, while local markets sometimes offer fresher vegetables at lower prices.\n\n结合我的经历\n\nPeople can buy them in markets, supermarkets or through delivery services. A market may offer a wider choice of fresh produce, while a supermarket is convenient. The choice depends on someone's routine.\n\n### 02 Secondary school\n\n### Do you remember the first day in secondary school?\n\n原答案（项目已有稿）\n\nYes, quite clearly. I remember feeling a little nervous because everything was new to me. However, I soon made some new friends, so I became much more relaxed.\n\n结合我的经历\n\nI remember feeling a little nervous in a new environment. There were unfamiliar people and a different routine. Once I started talking to classmates, I felt more relaxed.\n\n### What was the happiest thing for you in secondary school?\n\n原答案（项目已有稿）\n\nI think the happiest thing was spending time with my friends. We studied together, had lunch together and sometimes played sports after class. Those experiences gave me many happy memories.\n\n结合我的经历\n\nSpending time with friends was one of the happiest parts for me. Having someone to share an experience with made school life more enjoyable. Those relationships mattered as much as the lessons.\n\n### What was your favourite subject at secondary school?\n\n原答案（项目已有稿）\n\nMy favourite subject was definitely art. I have always enjoyed drawing and creating things, and this interest later influenced my choice of major at university.\n\n结合我的经历\n\nArt was one of my favourite subjects because I enjoyed drawing. I liked being able to create something rather than only memorise information. That interest is connected with my current major, digital media art.\n\n### What subject did you dislike most in secondary school?\n\n原答案（项目已有稿）\n\nProbably chemistry. There were too many formulas and chemical reactions for me to remember, so I sometimes found the subject quite confusing.\n\n结合我的经历\n\nI was less interested in subjects that involved a lot of memorisation without a clear explanation. I found them harder to enjoy than practical or visual work. A good example or picture usually helped me understand more.\n\n### Is there anything you miss about your secondary school?\n\n原答案（项目已有稿）\n\nYes, I really miss my classmates. At university, everyone has a much busier schedule, but in secondary school we spent almost every day together. So we were extremely close at that time.\n\n结合我的经历\n\nI miss the familiar routine and spending time with friends every day. We could share small things without planning a meeting. Life is more independent at university, but those memories are still warm.\n\n### Did you find any difficult subjects in secondary school?\n\n原答案（项目已有稿）\n\nYes, chemistry was quite difficult for me. As I just mentioned, there were many formulas and reactions to remember, and I wasn’t particularly good at that kind of learning.\n\n结合我的经历\n\nClasses with complicated information to memorise could be difficult for me. I needed to see how the ideas fitted together rather than learn separate facts. Pictures, notes and smaller steps made things easier.\n\n### 03 Shoes\n\n### Do you like to buy shoes?\n\n原答案（项目已有稿）\n\nYes, but I don’t buy them very often. I mainly buy s
