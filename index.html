 meaningful to me.", "cue": "题目：Describe a traditional food that is special to you.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：[项目《月饼与中秋节》](https://chatgpt.com/share/6acb69a7-f6b8-83ec-a7d3-cd499fdab4c7)。你亲口说生日在中秋节、小时候期待亲戚团聚和生日礼物。使用传统农历生日的语境，不延伸成每年公历日期固定重合。\n\n\n一分钟笔记：mooncakes / round + fillings / Mid-Autumn / birthday / relatives + gifts / reunion / memories。\n\n迁移：特殊食物说明 appearance + ingredients + occasion；庆祝活动强调当日过程；童年记忆讲一幅真实画面；礼物题需说具体礼物，不能只说收到很多礼物。无需硬讲嫦娥传说。\n", "question": "Describe a traditional food that is special to you."}, {"id": "6-25", "title": "16 父亲的生意：重新开始，坚持与机会", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：[项目《成功的父亲故事》](https://chatgpt.com/share/6acb69b5-d35c-83ec-be99-ef9dfb8dd00a)。搬成都、被骗失钱、出租车和货车司机、小店变公司均来自你的口述。电子设备的具体产品仍不明确，准备时最好用真实产品名称替换 equipment。\n\n> When I saw this topic, the first person that popped up in my mind was my father, who built his own business.\n>\n> To tell you more about him, my family moved to Chengdu when I was about one year old. At first, he trusted the wrong person and lost a lot of money. It was a difficult time for our family.\n>\n> Speaking of what he did next, he didn't give up. He worked as a taxi driver and later as a truck driver to support us. After that, he noticed an opportunity in electronic equipment and started a small business.\n>\n> As for the turning point, the small shop gradually developed into a company after years of hard work. To me, that shows his determination. He had to rebuild his life instead of starting with everything already in place.\n>\n> When it comes to why I admire him, it isn't only because the business grew. I respect the way he kept going and looked for a new opportunity. When I find my studies difficult, his story reminds me not to give up too quickly.\n>\n> To conclude, my father is a successful businessperson in my eyes because he overcame setbacks and built something through his own effort.\n\n一分钟笔记：father / Chengdu / lost money / taxi → truck / equipment / shop → company / determination / inspires me。\n\n迁移：successful business 必须说明做什么生意；admired person 说明品质和证据；proud of family member 选择一件具体事情；opportunity 指抓住的新机会。不要随意加收入、公司规模或产品型号。\n\n", "answers": "When I saw this topic, the first person that popped up in my mind was my father, who built his own business.\n\nTo tell you more about him, my family moved to Chengdu when I was about one year old. At first, he trusted the wrong person and lost a lot of money. It was a difficult time for our family.\n\nSpeaking of what he did next, he didn't give up. He worked as a taxi driver and later as a truck driver to support us. After that, he noticed an opportunity in electronic equipment and started a small business.\n\nAs for the highlight, the small shop gradually developed into a company after years of hard work. To me, that shows his determination. He had to rebuild his life instead of starting with everything already in place.\n\nWhen it comes to why I admire him, it isn't only because the business grew. I respect the way he kept going and looked for a new opportunity. When I find my studies difficult, his story reminds me not to give up too quickly.\n\nTo conclude, my father is a successful businessperson in my eyes because he overcame setbacks and built something through his own effort.", "cue": "题目：Describe a successful person you know.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：[项目《成功的父亲故事》](https://chatgpt.com/share/6acb69b5-d35c-83ec-be99-ef9dfb8dd00a)。搬成都、被骗失钱、出租车和货车司机、小店变公司均来自你的口述。电子设备的具体产品仍不明确，准备时最好用真实产品名称替换 equipment。\n\n\n一分钟笔记：father / Chengdu / lost money / taxi → truck / equipment / shop → company / determination / inspires me。\n\n迁移：successful business 必须说明做什么生意；admired person 说明品质和证据；proud of family member 选择一件具体事情；opportunity 指抓住的新机会。不要随意加收入、公司规模或产品型号。\n", "question": "Describe a successful person you know."}, {"id": "6-26", "title": "17 想拥有的相机：妈妈、童年照片、自己的旅行", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：[项目《景点收费探讨》中的相机口述](https://chatgpt.com/share/6acb69cd-8c1c-83ec-85cf-9ac4311017b6)。你亲口讲妈妈爱拍照、童年用相机拍你、旧相机老而重、自己没有相机、想要轻便且照片好看的相机。原助手 8,000 元价格属于示例，不是已确认预算。\n\n> When I saw this topic, the first piece of technology that popped up in my mind was a lightweight digital camera I'd like to own.\n>\n> To tell you more about it, my mother has always enjoyed taking photos. She bought a camera when I was young and used it to record many moments from my childhood. Personally, I think that helped me become interested in photography.\n>\n> Speaking of what I want now, I don't have a camera of my own. My mother's old camera is quite heavy, so I would like something smaller and easier to carry. I don't need the most expensive model, but I want it to take clear photos.\n>\n> As for how I would use it, I would take it on trips and record scenery, buildings and moments with friends and family. It would also be useful for my university projects because I study digital media art.\n>\n> When it comes to why I want it, photography is both a personal hobby and something connected with my studies. Looking at my mother's old pictures reminds me how valuable these memories can be.\n>\n> To conclude, I hope to own a camera that helps me record my life and is light enough to take with me.\n\n一分钟笔记：mum + childhood photos / old heavy camera / no own camera / lightweight / travel / major + hobby / memories。\n\n题卡问价格时补真实预算：My budget would be around… yuan。不必查真实产品价格才能练；这里是描述个人意愿，不是购买建议。避免说所有相机都必然比任何手机更清晰。\n\n", "answers": "When I saw this topic, the first piece of technology that popped up in my mind was a lightweight digital camera I'd like to own.\n\nTo tell you more about it, my mother has always enjoyed taking photos. She bought a camera when I was young and used it to record many moments from my childhood. Personally, I think that helped me become interested in photography.\n\nSpeaking of what I want now, I don't have a camera of my own. My mother's old camera is quite heavy, so I would like something smaller and easier to carry. I don't need the most expensive model, but I want it to take clear photos.\n\nAs for the highlight, I would take it on trips and record scenery, buildings and moments with friends and family. It would also be useful for my university projects because I study digital media art.\n\nWhen it comes to why I want it, photography is both a personal hobby and something connected with my studies. Looking at my mother's old pictures reminds me how valuable these memories can be.\n\nTo conclude, I hope to own a camera that helps me record my life and is light enough to take with me.", "cue": "题目：Describe something you would like to buy.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：[项目《景点收费探讨》中的相机口述](https://chatgpt.com/share/6acb69cd-8c1c-83ec-85cf-9ac4311017b6)。你亲口讲妈妈爱拍照、童年用相机拍你、旧相机老而重、自己没有相机、想要轻便且照片好看的相机。原助手 8,000 元价格属于示例，不是已确认预算。\n\n\n一分钟笔记：mum + childhood photos / old heavy camera / no own camera / lightweight / travel / major + hobby / memories。\n\n题卡问价格时补真实预算：My budget would be around… yuan。不必查真实产品价格才能练；这里是描述个人意愿，不是购买建议。避免说所有相机都必然比任何手机更清晰。\n", "question": "Describe something you would like to buy."}, {"id": "7-27", "title": "01 具体呈现 → 理解 → 记住", "part": "P3", "group": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "\n内容块：\n\n> Clear examples make an idea easier to understand.\n> People can see how it works instead of only hearing an explanation.\n\n适合：纪录片、博物馆、历史教学、教程、示范。你的例子：Betty 学历史、卢浮宫、安装 SSD 的教程。\n\nCan movies help people understand a country's culture?\n\n> Yes, I think films can help people understand a country's culture.\n> This is because they show traditions through everyday situations.\n> Viewers can see how people behave and communicate, which makes those traditions easier to understand.\n> For example, a film may show a family celebrating a local festival.\n> By watching what they eat and how they interact, viewers can learn about local customs.\n> So, overall, films can be useful for learning about culture, although one film can't represent an entire country.\n\n边界：虚构电影可能有偏见，不能把电影等同于完整真实文化。\n\n", "answers": "Yes, I think films can help people understand a country's culture.\nThis is because they show traditions through everyday situations.\nViewers can see how people behave and communicate, which makes those traditions easier to understand.\nFor example, a film may show a family celebrating a local festival.\nBy watching what they eat and how they interact, viewers can learn about local customs.\nSo, overall, films can be useful for learning about culture, although one film can't represent an entire country.", "cue": "\n内容块：\n\n\n适合：纪录片、博物馆、历史教学、教程、示范。你的例子：Betty 学历史、卢浮宫、安装 SSD 的教程。\n\nCan movies help people understand a country's culture?\n\n\n边界：虚构电影可能有偏见，不能把电影等同于完整真实文化。\n", "question": "Can movies help people understand a country's culture?"}, {"id": "7-28", "title": "02 共同经历 → 有话聊 → 更亲近", "part": "P3", "group": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "\n内容块：\n\n> Doing something together gives people a shared experience.\n> It gives them something to talk about and helps them stay connected.\n\n适合：家庭、朋友、活动、电影、节日。你的例子：中秋生日、一起看比赛、团队项目。\n\nWhy are family celebrations important?\n\n> I think family celebrations help relatives stay connected.\n> This is mainly because people may be too busy to meet regularly.\n> A celebration gives them a reason to spend time together and catch up.\n> For example, a family may have dinner together during the Mid-Autumn Festival.\n> They can share food and talk about what has happened in their lives.\n> Therefore, these occasions can strengthen relationships through regular contact.\n\n边界：共同活动不是所有友谊的必要条件；可靠、尊重和支持也重要。\n\n", "answers": "I think family celebrations help relatives stay connected.\nThis is mainly because people may be too busy to meet regularly.\nA celebration gives them a reason to spend time together and catch up.\nFor example, a family may have dinner together during the Mid-Autumn Festival.\nThey can share food and talk about what has happened in their lives.\nTherefore, these occasions can strengthen relationships through regular contact.", "cue": "\n内容块：\n\n\n适合：家庭、朋友、活动、电影、节日。你的例子：中秋生日、一起看比赛、团队项目。\n\nWhy are family celebrations important?\n\n\n边界：共同活动不是所有友谊的必要条件；可靠、尊重和支持也重要。\n", "question": "Why are family celebrations important?"}, {"id": "7-29", "title": "03 时间与预算 → 便利；现场 → 体验", "part": "P3", "group": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "\n内容块：\n\n> People often choose what saves them time and money.\n> But some experiences are worth making an extra effort for.\n\n适合：线上线下、购物、课程、交通、居家与外出。你的例子：淘宝、实习地铁、现场篮球、卢浮宫。\n\nWhat are the differences between watching films at home and in a cinema?\n\n> I think the main differences are flexibility and the viewing experience.\n> At home, people can pause a film and choose when to watch it.\n> Cinemas offer a larger screen and more powerful sound, but involve extra cost and travel.\n> For example, parents with young children may prefer watching at home because they can take breaks.\n> Someone watching an action film may prefer the cinema for the screen and sound.\n> So, overall, the better choice depends on whether people value flexibility or the cinema experience more.\n\n边界：比较同一个维度。不要说 A 便宜、B 有文化，就认为比较完成了。\n\n", "answers": "I think the main differences are flexibility and the viewing experience.\nAt home, people can pause a film and choose when to watch it.\nCinemas offer a larger screen and more powerful sound, but involve extra cost and travel.\nFor example, parents with young children may prefer watching at home because they can take breaks.\nSomeone watching an action film may prefer the cinema for the screen and sound.\nSo, overall, the better choice depends on whether people value flexibility or the cinema experience more.", "cue": "\n内容块：\n\n\n适合：线上线下、购物、课程、交通、居家与外出。你的例子：淘宝、实习地铁、现场篮球、卢浮宫。\n\nWhat are the differences between watching films at home and in a cinema?\n\n\n边界：比较同一个维度。不要说 A 便宜、B 有文化，就认为比较完成了。\n", "question": "What are the differences between watching films at home and in a cinema?"}, {"id": "7-30", "title": "04 自己尝试 → 作决定 → 提高能力", "part": "P3", "group": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "\n内容块：\n\n> People learn more when they try things for themselves.\n> Making decisions and correcting mistakes can help them develop their skills.\n\n适合：创造力、手工、学习、项目、自律。你的例子：校庆实拍加动画、画画、SSD。\n\nAre books better than films for developing imagination?\n\n> I think books often give people more room to use their imagination.\n> This is because readers have to picture the characters and places for themselves.\n> Films already provide many of those visual details, so viewers have fewer gaps to fill.\n> For example, two people reading the same novel may imagine a character differently.\n> Each person creates their own picture from the writer's descriptions.\n> Therefore, books can be especially useful for imagination, although films can inspire creative ideas too.\n\n边界：imagination 与 creativity 相关但不完全一样；不要说电影让人 less creative 一概否定。\n\n", "answers": "I think books often give people more room to use their imagination.\nThis is because readers have to picture the characters and places for themselves.\nFilms already provide many of those visual details, so viewers have fewer gaps to fill.\nFor example, two people reading the same novel may imagine a character differently.\nEach person creates their own picture from the writer's descriptions.\nTherefore, books can be especially useful for imagination, although films can inspire creative ideas too.", "cue": "\n内容块：\n\n\n适合：创造力、手工、学习、项目、自律。你的例子：校庆实拍加动画、画画、SSD。\n\nAre books better than films for developing imagination?\n\n\n边界：imagination 与 creativity 相关但不完全一样；不要说电影让人 less creative 一概否定。\n", "question": "Are books better than films for developing imagination?"}, {"id": "7-31", "title": "05 依赖信息 → 错误会误导 → 核实", "part": "P3", "group": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "\n内容块：\n\n> People may use this information to learn or make decisions.\n> If it is inaccurate, they may misunderstand the subject or make a poor choice.\n\n适合：纪录片、新闻、广告、评价、网络建议。你的例子：淘宝评价、教程、学习纪录片。\n\nShould documentary films be truthful?\n\n> I think documentaries should be factually accurate.\n> People often watch them to learn about the real world.\n> If important information is wrong, viewers may accept it as fact.\n> For example, students may use a wildlife documentary as a learning resource.\n> Incorrect information could then affect their understanding in class.\n> Therefore, filmmakers should check their facts and make clear where an interpretation is being offered.\n\n边界：准确不等于没有视角、剪辑或观点；广告中的主观感受也不全是可核对事实。\n\n", "answers": "I think documentaries should be factually accurate.\nPeople often watch them to learn about the real world.\nIf important information is wrong, viewers may accept it as fact.\nFor example, students may use a wildlife documentary as a learning resource.\nIncorrect information could then affect their understanding in class.\nTherefore, filmmakers should check their facts and make clear where an interpretation is being offered.", "cue": "\n内容块：\n\n\n适合：纪录片、新闻、广告、评价、网络建议。你的例子：淘宝评价、教程、学习纪录片。\n\nShould documentary films be truthful?\n\n\n边界：准确不等于没有视角、剪辑或观点；广告中的主观感受也不全是可核对事实。\n", "question": "Should documentary films be truthful?"}, {"id": "7-32", "title": "06 需求与经历不同 → 选择不同", "part": "P3", "group": "07 P3 六套核心逻辑：每套都能从你的经历抽出来", "body": "\n内容块：\n\n> People's choices depend on their needs, budget and life experience.\n> As these change, their preferences may change as well.\n\n适合：年龄、性别、消费、电影、旅行、住房。你的例子：学生预算、父亲生活经历、通勤、树屋短假期。\n\nDo people's movie preferences change as they get older?\n\n> Yes, I think preferences may change as people get older.\n> This is partly because their interests and life experience change.\n> They may become more interested in stories that relate to their own lives.\n> For example, some children enjoy animated adventures, while some adults prefer stories about work or family.\n> Those adults may understand the characters' problems because they have had similar experiences.\n> So, overall, age can influence preferences, although personal taste still matters.\n\n边界：不要断言所有老人都节俭、所有年轻人都没时间或所有女性都更爱购物。\n\n", "answers": "Yes, I think preferences may change as people get older.\nThis is partly because their interests and life experience change.\nThey may become more interested in stories that relate to their own lives.\nFor example, some children enjoy animated adventures, while some adults prefer stories about work or family.\nThose adults may understand the characters' problems because they have had similar experiences.\nSo, overall, age can influence preferences, although personal taste still matters.", "cue": "\n内容块：\n\n\n适合：年龄、性别、消费、电影、旅行、住房。你的例子：学生预算、父亲生活经历、通勤、树屋短假期。\n\nDo people's movie preferences change as they get older?\n\n\n边界：不要断言所有老人都节俭、所有年轻人都没时间或所有女性都更爱购物。\n", "question": "Do people's movie preferences change as they get older?"}, {"id": "8-33", "title": "01 性格与处境：解释行为差异", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> One possible reason is personality. Some people are more cautious, so they prefer to think things through before deciding.\n\n迁移：快速决定、询问建议、冒险运动、自己维修。再选一个真实因素：风险、经验、预算、时间。不是所有行为都由原生家庭决定。\n\n性别比较：\n\n> I wouldn't make a strong generalisation based on gender. Personality and circumstances may have a greater influence on this behaviour.\n\n不要把“性别无关”本身又说成绝对事实。\n\n", "answers": "I think people's personalities and experiences affect their taste in films. Some people want excitement, while others want a relaxing story. Their current mood can also influence what they choose. For example, a student who feels tired may prefer a light comedy. Someone interested in history may choose a film set in the past. So, overall, there is no single type of film that suits everyone.", "cue": "练习题：Why do different people enjoy different types of films?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n迁移：快速决定、询问建议、冒险运动、自己维修。再选一个真实因素：风险、经验、预算、时间。不是所有行为都由原生家庭决定。\n\n性别比较：\n\n\n不要把“性别无关”本身又说成绝对事实。\n", "question": "Why do different people enjoy different types of films?"}, {"id": "8-34", "title": "02 父母以身作则：行为可模仿", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> Parents can set a good example. Children may copy what they see adults doing, so regular actions can be more effective than just giving instructions.\n\n例子：父母阅读；按需取餐；说 thank you；减少一次性用品。补一个具体后果。避免 children are immature → impossible 过度绝对。\n\n", "answers": "I think parents can encourage good habits by setting an example. Children can see what their parents actually do every day. This makes the advice easier to understand and follow. For example, parents who put their things away can show children how to keep a room organised. They can also involve children in a small task instead of only giving instructions. Therefore, showing a habit consistently can be more effective than repeating a rule.", "cue": "练习题：How can parents encourage children to develop good habits?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n例子：父母阅读；按需取餐；说 thank you；减少一次性用品。补一个具体后果。避免 children are immature → impossible 过度绝对。\n", "question": "How can parents encourage children to develop good habits?"}, {"id": "8-35", "title": "03 科技影响：减少步骤、增加选择、扩大接触", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> Technology gives people more ways to do this. For example, they can… without having to…\n\n选择一个机制讲清：视频通话维持远距离联系；网购比较价格；线上课节省路程；提醒减少忘事。\n\n原稿“过去只能写信”不准确。练成：In the past, people relied more on letters and phone calls; now video calls are widely available。别把所有过去现在变化都归因于科技，收入、城市发展和生活方式也可能有关。\n\n", "answers": "I think technology has made learning more accessible and easier to understand in some ways. People can find information without travelling to a particular place. Pictures and videos can also explain an idea more clearly than words alone. For example, a student can watch a short documentary about history on Bilibili. The images can help them connect events and remember the information. So, overall, technology is useful when people choose reliable content and use it actively.", "cue": "练习题：How has technology changed the way people learn?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n选择一个机制讲清：视频通话维持远距离联系；网购比较价格；线上课节省路程；提醒减少忘事。\n\n原稿“过去只能写信”不准确。练成：In the past, people relied more on letters and phone calls; now video calls are widely available。别把所有过去现在变化都归因于科技，收入、城市发展和生活方式也可能有关。\n", "question": "How has technology changed the way people learn?"}, {"id": "8-36", "title": "04 替代与消失：主要功能之外，还有什么价值", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> I don't think it will disappear completely. It offers something that the newer option doesn't fully provide, such as…\n\n电影院：现场视听体验、共同外出。实体店：试穿、看实物、即时拿到商品。线下课：直接交流与反馈。未来预测用 probably / may / in the near future。\n\n结论不是固定“不会消失”。可说 Some types may become less common, while others continue to serve a particular need。\n\n", "answers": "I do not think online visits will completely replace real museums. Online information is convenient, but being there offers a different experience. People can see the size and details of an object more clearly in person. For example, someone interested in art may enjoy looking at a painting at the Louvre. That experience may be more memorable than seeing a small picture on a phone. Therefore, online visits are a useful addition, but physical museums still have value.", "cue": "练习题：Will online visits replace real museums?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n电影院：现场视听体验、共同外出。实体店：试穿、看实物、即时拿到商品。线下课：直接交流与反馈。未来预测用 probably / may / in the near future。\n\n结论不是固定“不会消失”。可说 Some types may become less common, while others continue to serve a particular need。\n", "question": "Will online visits replace real museums?"}, {"id": "8-37", "title": "05 时间有限与即时娱乐：短期回报和长期目标", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> After a busy day, people may prefer activities with an immediate reward. Learning a skill takes longer, so a clear routine can help them keep practising.\n\n适合：短视频、自律、学技能、兴趣安排。例子：每天练口语十分钟，而不是等有整晚时间。小孩喜欢音乐也可能因为旋律、节奏、表达，不一定都为了缓解学业压力。\n\n", "answers": "I think entertainment often gives people a quicker feeling of enjoyment. Learning something difficult can require time and concentration. When people are tired, an easy activity may feel more attractive. For example, a student may watch short videos after working on a project. If they keep scrolling, they may postpone the study they planned to do. So, overall, a clear limit and a manageable learning task can help people balance the two.", "cue": "练习题：Why do people sometimes choose entertainment instead of learning?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n适合：短视频、自律、学技能、兴趣安排。例子：每天练口语十分钟，而不是等有整晚时间。小孩喜欢音乐也可能因为旋律、节奏、表达，不一定都为了缓解学业压力。\n", "question": "Why do people sometimes choose entertainment instead of learning?"}, {"id": "8-38", "title": "06 传统：传承 + 当下的功能", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> It has become part of the tradition. Families pass it on, and it also gives people a way to…\n\n中秋月饼：passed down → reunion → shared celebration。送礼：express care → choose something personal。拍照微笑：friendly appearance / positive memory，不必硬讲祖辈习俗。\n\n只说“因为一直这样做”容易循环论证；补这件事现在有什么作用。\n\n", "answers": "I think traditions matter because they connect people with family and shared memories. A familiar activity can give people a reason to meet and celebrate. It also helps younger people understand something about their culture. For example, families can share mooncakes during the Mid-Autumn Festival. The food becomes connected with reunion and time spent together. Therefore, traditions are useful when they still have meaning in people's lives.", "cue": "练习题：Why is it important to keep traditions?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n中秋月饼：passed down → reunion → shared celebration。送礼：express care → choose something personal。拍照微笑：friendly appearance / positive memory，不必硬讲祖辈习俗。\n\n只说“因为一直这样做”容易循环论证；补这件事现在有什么作用。\n", "question": "Why is it important to keep traditions?"}, {"id": "8-39", "title": "07 应不应该：价值、代价和条件", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> I think people should be encouraged to do it, but the way it is introduced matters.\n\n学乐器：接触有益，但可给选择；课堂方案考虑时间资源。公众安全或基本规则题不能统一“好事但不强制”，要按责任和影响判断。\n\n以你的光污染提议为例：保留安全照明，同时控制不必要广告灯光；这是平衡目标，而非所有人自愿即可。\n\n", "answers": "I think children should have the chance to try an instrument, but they should have some choice. Music can help them express themselves and discover an interest. However, pressure may make the activity stressful instead of enjoyable. For example, a school could offer a short course with several instruments to try. Children could then continue with one they actually enjoy. So, overall, encouragement and access are more useful than forcing every child to follow the same path.", "cue": "练习题：Should children be required to learn a musical instrument?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n学乐器：接触有益，但可给选择；课堂方案考虑时间资源。公众安全或基本规则题不能统一“好事但不强制”，要按责任和影响判断。\n\n以你的光污染提议为例：保留安全照明，同时控制不必要广告灯光；这是平衡目标，而非所有人自愿即可。\n", "question": "Should children be required to learn a musical instrument?"}, {"id": "8-40", "title": "08 节俭与保留旧物：经济价值或情感价值", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> Repairing something can save money and reduce waste. But people may also keep an old item because it has sentimental value.\n\n例子：妈妈旧相机、童年照片、礼物。不是每件旧物都为了省钱，昂贵维修也未必比购买便宜。\n\n", "answers": "I think people keep old things for both practical and emotional reasons. An item that still works may save the cost of buying a new one. Other things are important because they remind people of someone or something. For example, a parent may keep a camera used to take childhood photos. Even when it feels heavy or old, it can still be connected with family memories. Therefore, an old item's value is not always the same as its selling price.", "cue": "练习题：Why do people keep old things?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n例子：妈妈旧相机、童年照片、礼物。不是每件旧物都为了省钱，昂贵维修也未必比购买便宜。\n", "question": "Why do people keep old things?"}, {"id": "8-41", "title": "09 沟通与情绪支持：让对方感到被听见", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> A warm tone and careful listening can help people feel respected. They may then be more willing to share their thoughts.\n\n例子：校庆会议。相比反复 emotional value，feel supported / feel understood / feel listened to 更具体。视频通话有语气和表情优势；文字可能更适合不方便说话的人。\n\n", "answers": "I think careful listening and a respectful tone make a discussion more effective. People need to feel comfortable enough to explain their ideas. Clear questions can also help the team understand a problem before deciding. For example, students working on a school video can discuss why hand-drawn animation is taking too long. They may then agree to combine real footage with animation and share the tasks. Therefore, good communication helps a team find a practical solution together.", "cue": "练习题：How can people make a team discussion more effective?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n例子：校庆会议。相比反复 emotional value，feel supported / feel understood / feel listened to 更具体。视频通话有语气和表情优势；文字可能更适合不方便说话的人。\n", "question": "How can people make a team discussion more effective?"}, {"id": "8-42", "title": "10 真诚与行动：不要只看一句话", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> Not every apology is sincere. A sincere apology usually involves taking responsibility and trying to change the behaviour.\n\n例子：重复同一错误却只说 sorry，与道歉后改正相比。赞美和感谢也可看行为是否一致，但不用猜每个人的内心。\n\n", "answers": "I think a sincere apology includes responsibility and an effort to change. Saying sorry matters, but the person also needs to understand the effect of their behaviour. Otherwise, the same problem may happen again. For example, someone who misses a team deadline could explain the mistake and help finish the work. Meeting the next deadline would show that the apology led to action. So, overall, behaviour after an apology is more useful than the words alone.", "cue": "练习题：What makes an apology sincere?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n例子：重复同一错误却只说 sorry，与道歉后改正相比。赞美和感谢也可看行为是否一致，但不用猜每个人的内心。\n", "question": "What makes an apology sincere?"}, {"id": "8-43", "title": "11 体验价值：为什么愿意花额外时间和钱", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> Being there in person can turn an ordinary activity into a memorable experience.\n\n你的例子：现场篮球，听到人群欢呼；卢浮宫，亲眼看画。补为什么对那个人特别重要，不能只说 meaningful。\n\n", "answers": "I think watching sport in person offers an atmosphere that a screen cannot fully provide. People can hear the crowd and share the excitement with others. Supporting someone they know can make the event more personal. For example, a student may go to a basketball game to support a close friend. The friend's effort may become a stronger memory than the final score. Therefore, people sometimes pay for the whole experience rather than just the view of the game.", "cue": "练习题：Why do people pay to watch sport in person?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n你的例子：现场篮球，听到人群欢呼；卢浮宫，亲眼看画。补为什么对那个人特别重要，不能只说 meaningful。\n", "question": "Why do people pay to watch sport in person?"}, {"id": "8-44", "title": "12 解决问题：责任主体 + 具体动作 + 为什么有效", "part": "P3", "group": "08 P3 扩展逻辑：把“万能”改成有条件的工具", "body": "\n> Schools could… This would help students…\n> Local communities could… so that residents can…\n\n一次选两个最有关的主体，不用强行讲个人、社区、学校、企业、政府五层。例子：学校提供可选音乐课；社区维护安全步道；景区用门票收入维护设施。\n\n", "answers": "I think cities can set clear rules for unnecessary lighting while keeping public spaces safe. Some bright advertising lights are not needed throughout the night. Reducing them can make it easier for residents to rest. For example, shops could turn off nonessential lights after eleven. Street lighting needed for safe travel should still remain. Therefore, the aim should be a practical balance between safety and reducing unnecessary light.", "cue": "练习题：What can cities do to reduce unnecessary light at night?\n\n通用路线：观点 → 两句原因 → 两句具体例子 → So, overall / Therefore。\n\n\n\n一次选两个最有关的主体，不用强行讲个人、社区、学校、企业、政府五层。例子：学校提供可选音乐课；社区维护安全步道；景区用门票收入维护设施。\n", "question": "What can cities do to reduce unnecessary light at night?"}, {"id": "9-45", "title": "Should all scenic spots charge an entry fee?", "part": "P3", "group": "09 旅游、建筑与收费：项目原四题重整", "body": "\n> I don't think every scenic spot should follow the same rule.\n> Some places need money for maintenance, while public access is also important.\n> A reasonable fee can help cover costs, but a high fee may exclude people on a limited budget.\n> For example, a natural attraction could use ticket income to maintain paths and clean facilities.\n> It could also offer discounts or some free entry times.\n> So, overall, fees should depend on the site's costs and purpose, rather than be identical everywhere.\n\n", "answers": "I don't think every scenic spot should follow the same rule.\nSome places need money for maintenance, while public access is also important.\nA reasonable fee can help cover costs, but a high fee may exclude people on a limited budget.\nFor example, a natural attraction could use ticket income to maintain paths and clean facilities.\nIt could also offer discounts or some free entry times.\nSo, overall, fees should depend on the site's costs and purpose, rather than be identical everywhere.", "cue": "\n", "question": "Should all scenic spots charge an entry fee?"}, {"id": "9-46", "title": "Is it necessary for tourists to visit landmarks?", "part": "P3", "group": "09 旅游、建筑与收费：项目原四题重整", "body": "\n> I don't think visiting landmarks is necessary for every tourist.\n> People travel for different reasons, and not everyone wants the same experience.\n> Some prefer famous sights, while others value food, nature or a slower pace.\n> For example, someone who enjoys art may want to visit the Louvre.\n> Another visitor may prefer walking around a local neighbourhood and trying food.\n> Therefore, tourists should choose activities that match their interests.\n\n", "answers": "I don't think visiting landmarks is necessary for every tourist.\nPeople travel for different reasons, and not everyone wants the same experience.\nSome prefer famous sights, while others value food, nature or a slower pace.\nFor example, someone who enjoys art may want to visit the Louvre.\nAnother visitor may prefer walking around a local neighbourhood and trying food.\nTherefore, tourists should choose activities that match their interests.", "cue": "\n", "question": "Is it necessary for tourists to visit landmarks?"}, {"id": "9-47", "title": "Which do most people prefer, houses or tall buildings?", "part": "P3", "group": "09 旅游、建筑与收费：项目原四题重整", "body": "\n> It's hard to say what most people prefer, because needs and budgets differ.\n> Some people value the space and privacy a house can offer.\n> Others prefer a flat near their work or university because it reduces travel time.\n> For example, a family may want extra space, while a student may prioritise location.\n> The actual cost also depends on the area and size of the property.\n> So, overall, people's circumstances are more useful to consider than a single universal preference.\n\n", "answers": "It's hard to say what most people prefer, because needs and budgets differ.\nSome people value the space and privacy a house can offer.\nOthers prefer a flat near their work or university because it reduces travel time.\nFor example, a family may want extra space, while a student may prioritise location.\nThe actual cost also depends on the area and size of the property.\nSo, overall, people's circumstances are more useful to consider than a single universal preference.", "cue": "\n", "question": "Which do most people prefer, houses or tall buildings?"}, {"id": "9-48", "title": "Why do people like visiting historical places?", "part": "P3", "group": "09 旅游、建筑与收费：项目原四题重整", "body": "\n> I think one reason is that historical places make the past feel more concrete.\n> People can see buildings and objects instead of only reading descriptions.\n> This can help them understand how people lived in a different period.\n> For example, a visitor may see old tools or rooms in a museum.\n> Connecting those objects with a story can make the information easier to remember.\n> Therefore, these visits can be both enjoyable and educational.\n\n", "answers": "I think one reason is that historical places make the past feel more concrete.\nPeople can see buildings and objects instead of only reading descriptions.\nThis can help them understand how people lived in a different period.\nFor example, a visitor may see old tools or rooms in a museum.\nConnecting those objects with a story can make the information easier to remember.\nTherefore, these visits can be both enjoyable and educational.", "cue": "\n", "question": "Why do people like visiting historical places?"}, {"id": "16-79", "title": "01 Vegetables", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 喜欢且多久吃→先频率再口味或习惯。\n- 小时候不喜欢的菜→具体菜名+过去原因。\n- 通常哪里买→真实购买者和地点。\n- 周围有人种菜吗→实际观察，别自动把郊区说成有菜园。\n- 人们哪里买→市场与超市，限定观察。\n\n", "answers": "### Do you like eating vegetables? How often?\n\n原答案（项目已有稿）\n\nYes, I do. I eat vegetables almost every day because I think they are good for my health. For example, I usually have some green vegetables with lunch and dinner.\n\n结合我的经历\n\nYes, I generally like vegetables and try to include them in everyday meals. They make a meal feel more balanced. I prefer a simple preparation rather than a very complicated dish.\n\n### Were there any vegetables you disliked when you were young?\n\n原答案（项目已有稿）\n\nYes. When I was a child, I really disliked carrots because I didn’t like their taste. But now I’m okay with them because I know they contain a lot of vitamins.\n\n结合我的经历\n\nI was less keen on vegetables with a bitter taste when I was a child. I preferred milder flavours. My tastes have become more flexible as I have grown older.\n\n### Where do you usually buy vegetables?\n\n原答案（项目已有稿）\n\nNormally, my family buys vegetables from a local market near our home. The vegetables there are usually quite fresh, and there are many different kinds to choose from.\n\n结合我的经历\n\nAt university, I usually get vegetables as part of a meal rather than buy them separately. When I am at home, my family does more of the food shopping. Convenience matters because I am still a student.\n\n### Do people around you grow their own vegetables?\n\n原答案（项目已有稿）\n\nYes, some of them do. I live in a relatively quiet area outside the city centre, so some people have enough space to grow vegetables in their gardens. They may grow tomatoes, green vegetables or peppers.\n\n结合我的经历\n\nI do not know anyone around me who grows vegetables regularly. Most people I know buy them instead. Growing them sounds interesting, but it needs space and time.\n\n### Where do people usually buy vegetables?\n\n原答案（项目已有稿）\n\nI think most people buy them from supermarkets or local markets. Supermarkets are convenient, while local markets sometimes offer fresher vegetables at lower prices.\n\n结合我的经历\n\nPeople can buy them in markets, supermarkets or through delivery services. A market may offer a wider choice of fresh produce, while a supermarket is convenient. The choice depends on someone's routine.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you like eating vegetables? How often?", "answer": "Yes, I generally like vegetables and try to include them in everyday meals. They make a meal feel more balanced. I prefer a simple preparation rather than a very complicated dish.", "set": "", "original": "Yes, I do. I eat vegetables almost every day because I think they are good for my health. For example, I usually have some green vegetables with lunch and dinner."}, {"question": "Were there any vegetables you disliked when you were young?", "answer": "I was less keen on vegetables with a bitter taste when I was a child. I preferred milder flavours. My tastes have become more flexible as I have grown older.", "set": "", "original": "Yes. When I was a child, I really disliked carrots because I didn’t like their taste. But now I’m okay with them because I know they contain a lot of vitamins."}, {"question": "Where do you usually buy vegetables?", "answer": "At university, I usually get vegetables as part of a meal rather than buy them separately. When I am at home, my family does more of the food shopping. Convenience matters because I am still a student.", "set": "", "original": "Normally, my family buys vegetables from a local market near our home. The vegetables there are usually quite fresh, and there are many different kinds to choose from."}, {"question": "Do people around you grow their own vegetables?", "answer": "I do not know anyone around me who grows vegetables regularly. Most people I know buy them instead. Growing them sounds interesting, but it needs space and time.", "set": "", "original": "Yes, some of them do. I live in a relatively quiet area outside the city centre, so some people have enough space to grow vegetables in their gardens. They may grow tomatoes, green vegetables or peppers."}, {"question": "Where do people usually buy vegetables?", "answer": "People can buy them in markets, supermarkets or through delivery services. A market may offer a wider choice of fresh produce, while a supermarket is convenient. The choice depends on someone's routine.", "set": "", "original": "I think most people buy them from supermarkets or local markets. Supermarkets are convenient, while local markets sometimes offer fresher vegetables at lower prices."}], "exam": true}, {"id": "16-80", "title": "02 Secondary school", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 记得第一天吗→紧张→认识人→放松。\n- 最开心的事→一件真实校园活动。\n- 最爱学科→美术兴趣与专业连接。\n- 最不喜欢学科→真实课程与难点。\n- 怀念什么→朋友或校园生活。\n- 难的课程→具体不懂哪类内容。\n\n", "answers": "### Do you remember the first day in secondary school?\n\n原答案（项目已有稿）\n\nYes, quite clearly. I remember feeling a little nervous because everything was new to me. However, I soon made some new friends, so I became much more relaxed.\n\n结合我的经历\n\nI remember feeling a little nervous in a new environment. There were unfamiliar people and a different routine. Once I started talking to classmates, I felt more relaxed.\n\n### What was the happiest thing for you in secondary school?\n\n原答案（项目已有稿）\n\nI think the happiest thing was spending time with my friends. We studied together, had lunch together and sometimes played sports after class. Those experiences gave me many happy memories.\n\n结合我的经历\n\nSpending time with friends was one of the happiest parts for me. Having someone to share an experience with made school life more enjoyable. Those relationships mattered as much as the lessons.\n\n### What was your favourite subject at secondary school?\n\n原答案（项目已有稿）\n\nMy favourite subject was definitely art. I have always enjoyed drawing and creating things, and this interest later influenced my choice of major at university.\n\n结合我的经历\n\nArt was one of my favourite subjects because I enjoyed drawing. I liked being able to create something rather than only memorise information. That interest is connected with my current major, digital media art.\n\n### What subject did you dislike most in secondary school?\n\n原答案（项目已有稿）\n\nProbably chemistry. There were too many formulas and chemical reactions for me to remember, so I sometimes found the subject quite confusing.\n\n结合我的经历\n\nI was less interested in subjects that involved a lot of memorisation without a clear explanation. I found them harder to enjoy than practical or visual work. A good example or picture usually helped me understand more.\n\n### Is there anything you miss about your secondary school?\n\n原答案（项目已有稿）\n\nYes, I really miss my classmates. At university, everyone has a much busier schedule, but in secondary school we spent almost every day together. So we were extremely close at that time.\n\n结合我的经历\n\nI miss the familiar routine and spending time with friends every day. We could share small things without planning a meeting. Life is more independent at university, but those memories are still warm.\n\n### Did you find any difficult subjects in secondary school?\n\n原答案（项目已有稿）\n\nYes, chemistry was quite difficult for me. As I just mentioned, there were many formulas and reactions to remember, and I wasn’t particularly good at that kind of learning.\n\n结合我的经历\n\nClasses with complicated information to memorise could be difficult for me. I needed to see how the ideas fitted together rather than learn separate facts. Pictures, notes and smaller steps made things easier.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you remember the first day in secondary school?", "answer": "I remember feeling a little nervous in a new environment. There were unfamiliar people and a different routine. Once I started talking to classmates, I felt more relaxed.", "set": "", "original": "Yes, quite clearly. I remember feeling a little nervous because everything was new to me. However, I soon made some new friends, so I became much more relaxed."}, {"question": "What was the happiest thing for you in secondary school?", "answer": "Spending time with friends was one of the happiest parts for me. Having someone to share an experience with made school life more enjoyable. Those relationships mattered as much as the lessons.", "set": "", "original": "I think the happiest thing was spending time with my friends. We studied together, had lunch together and sometimes played sports after class. Those experiences gave me many happy memories."}, {"question": "What was your favourite subject at secondary school?", "answer": "Art was one of my favourite subjects because I enjoyed drawing. I liked being able to create something rather than only memorise information. That interest is connected with my current major, digital media art.", "set": "", "original": "My favourite subject was definitely art. I have always enjoyed drawing and creating things, and this interest later influenced my choice of major at university."}, {"question": "What subject did you dislike most in secondary school?", "answer": "I was less interested in subjects that involved a lot of memorisation without a clear explanation. I found them harder to enjoy than practical or visual work. A good example or picture usually helped me understand more.", "set": "", "original": "Probably chemistry. There were too many formulas and chemical reactions for me to remember, so I sometimes found the subject quite confusing."}, {"question": "Is there anything you miss about your secondary school?", "answer": "I miss the familiar routine and spending time with friends every day. We could share small things without planning a meeting. Life is more independent at university, but those memories are still warm.", "set": "", "original": "Yes, I really miss my classmates. At university, everyone has a much busier schedule, but in secondary school we spent almost every day together. So we were extremely close at that time."}, {"question": "Did you find any difficult subjects in secondary school?", "answer": "Classes with complicated information to memorise could be difficult for me. I needed to see how the ideas fitted together rather than learn separate facts. Pictures, notes and smaller steps made things easier.", "set": "", "original": "Yes, chemistry was quite difficult for me. As I just mentioned, there were many formulas and reactions to remember, and I wasn’t particularly good at that kind of learning."}], "exam": true}, {"id": "16-81", "title": "03 Shoes", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 喜欢买鞋吗→需要才买。\n- 网购过吗→真实经历+比较价格。\n- 花钱多吗→预算范围。\n- 运动鞋还是时尚鞋→舒适与步行需要。\n- 不运动也穿运动鞋吗→日常穿搭。\n\n", "answers": "### Do you like to buy shoes?\n\n原答案（项目已有稿）\n\nYes, but I don’t buy them very often. I mainly buy shoes when I actually need a new pair because, as a student, I try to make budget-friendly choices.\n\n结合我的经历\n\nYes, but usually only when I need a new pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Have you ever bought shoes online?\n\n原答案（项目已有稿）\n\nDefinitely. I usually buy shoes online because it’s incredibly convenient. I can compare different brands and prices without going to several stores.\n\n结合我的经历\n\nYes, I use online shopping when I can compare sizes, prices and customer reviews. Taobao is useful for that, but I check the information carefully before deciding. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you spend a lot of money on shoes?\n\n原答案（项目已有稿）\n\nNot really. Since I’m still a university student, I don’t want to spend too much money on them. Normally, I care more about comfort and quality than expensive brands.\n\n结合我的经历\n\nNot usually. I try to keep the price around three hundred yuan rather than spend too much on one pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you prefer sports shoes or fashionable shoes?\n\n原答案（项目已有稿）\n\nI definitely prefer sports shoes. They are more comfortable and practical, especially because I walk a lot on campus and sometimes go running.\n\n结合我的经历\n\nI definitely prefer comfortable trainers for everyday use. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Would you choose to wear sneakers when you are not exercising?\n\n原答案（项目已有稿）\n\nOf course. Actually, I wear sneakers in my daily life most of the time because they are comfortable and easy to match with different clothes.\n\n结合我的经历\n\nYes, because I walk around university and need something comfortable. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you like to buy shoes?", "answer": "Yes, but usually only when I need a new pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D", "original": "Yes, but I don’t buy them very often. I mainly buy shoes when I actually need a new pair because, as a student, I try to make budget-friendly choices."}, {"question": "Have you ever bought shoes online?", "answer": "Yes, I use online shopping when I can compare sizes, prices and customer reviews. Taobao is useful for that, but I check the information carefully before deciding. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D", "original": "Definitely. I usually buy shoes online because it’s incredibly convenient. I can compare different brands and prices without going to several stores."}, {"question": "Do you spend a lot of money on shoes?", "answer": "Not usually. I try to keep the price around three hundred yuan rather than spend too much on one pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D", "original": "Not really. Since I’m still a university student, I don’t want to spend too much money on them. Normally, I care more about comfort and quality than expensive brands."}, {"question": "Do you prefer sports shoes or fashionable shoes?", "answer": "I definitely prefer comfortable trainers for everyday use. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D", "original": "I definitely prefer sports shoes. They are more comfortable and practical, especially because I walk a lot on campus and sometimes go running."}, {"question": "Would you choose to wear sneakers when you are not exercising?", "answer": "Yes, because I walk around university and need something comfortable. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D", "original": "Of course. Actually, I wear sneakers in my daily life most of the time because they are comfortable and easy to match with different clothes."}], "exam": true}, {"id": "16-82", "title": "04 Politeness", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 童年学礼貌吗→父母示范与用语。\n- 何时需要礼貌→具体场合。\n- 最近遇见礼貌的人→真实人物与行为。\n- 重要吗→尊重+交流。\n- 有不礼貌朋友吗→真实回答，不把随意说话等同失礼。\n\n", "answers": "### Did you learn to be polite when you were a child?\n\n原答案（项目已有稿）\n\nYes. My parents taught me to say things like “thank you” and “sorry” when I was very young. They believed being polite was an important way to show respect to other people.\n\n结合我的经历\n\nYes, my parents taught me basic things like saying please and thank you. I also learned by watching how they treated other people. Those small habits are still useful now.\n\n### When do you think people need to be polite?\n\n原答案（项目已有稿）\n\nI think people should be polite in almost every situation, especially when talking to strangers, teachers or older people. Good manners can make communication much easier.\n\n结合我的经历\n\nI think politeness matters in everyday situations, especially when asking for help or speaking to someone unfamiliar. A considerate tone makes the conversation easier. It also shows that you respect the other person's time.\n\n### Have you met anyone who was very polite recently?\n\n原答案（项目已有稿）\n\nYes. Recently, I met a staff member when I was doing my internship. Whenever I asked her a question, she answered me patiently and always spoke to people in a friendly way.\n\n结合我的经历\n\nA person who listens carefully and gives others time to speak feels polite to me. I noticed that kind of behaviour in a school project meeting. It made the discussion feel more comfortable.\n\n### Is it important to be polite?\n\n原答案（项目已有稿）\n\nDefinitely. Being polite shows respect and helps people build better relationships. Even simple things like saying “thank you” can leave a good impression.\n\n结合我的经历\n\nYes, because it helps people feel respected. Even when someone disagrees with you, a polite tone makes it easier to continue the conversation. It is especially useful when working in a team.\n\n### Do you have any friends who are not very polite?\n\n原答案（项目已有稿）\n\nNot really. Most of my close friends are quite polite. Of course, we sometimes speak very casually with each other because we are close, but that doesn’t mean we are disrespectful.\n\n结合我的经历\n\nI would not describe my friends as impolite. We sometimes speak casually, but that is different from deliberately being rude. If something bothers me, I would explain it calmly.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Did you learn to be polite when you were a child?", "answer": "Yes, my parents taught me basic things like saying please and thank you. I also learned by watching how they treated other people. Those small habits are still useful now.", "set": "", "original": "Yes. My parents taught me to say things like “thank you” and “sorry” when I was very young. They believed being polite was an important way to show respect to other people."}, {"question": "When do you think people need to be polite?", "answer": "I think politeness matters in everyday situations, especially when asking for help or speaking to someone unfamiliar. A considerate tone makes the conversation easier. It also shows that you respect the other person's time.", "set": "", "original": "I think people should be polite in almost every situation, especially when talking to strangers, teachers or older people. Good manners can make communication much easier."}, {"question": "Have you met anyone who was very polite recently?", "answer": "A person who listens carefully and gives others time to speak feels polite to me. I noticed that kind of behaviour in a school project meeting. It made the discussion feel more comfortable.", "set": "", "original": "Yes. Recently, I met a staff member when I was doing my internship. Whenever I asked her a question, she answered me patiently and always spoke to people in a friendly way."}, {"question": "Is it important to be polite?", "answer": "Yes, because it helps people feel respected. Even when someone disagrees with you, a polite tone makes it easier to continue the conversation. It is especially useful when working in a team.", "set": "", "original": "Definitely. Being polite shows respect and helps people build better relationships. Even simple things like saying “thank you” can leave a good impression."}, {"question": "Do you have any friends who are not very polite?", "answer": "I would not describe my friends as impolite. We sometimes speak casually, but that is different from deliberately being rude. If something bothers me, I would explain it calmly.", "set": "", "original": "Not really. Most of my close friends are quite polite. Of course, we sometimes speak very casually with each other because we are close, but that doesn’t mean we are disrespectful."}], "exam": true}, {"id": "16-83", "title": "05 Tiredness", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 何时累→学校项目或学习。\n- 累时做什么→休息或精神疲劳散步。\n- 累还见朋友吗→程度和原有约定。\n\n", "answers": "### When do you usually feel tired?\n\n原答案（项目已有稿）\n\nI usually feel tired when I have a lot of schoolwork to finish. Sometimes I have to work on my projects or prepare for exams until late at night, which can be quite exhausting.\n\n结合我的经历\n\nI often feel mentally tired after studying or working on a university project for a long time. It is usually a sign that I need a short break. I try not to keep forcing myself to work without stopping.\n\n### What do you do when you feel tired?\n\n原答案（项目已有稿）\n\nNormally, I take a short break or listen to some soft music. If I’m extremely tired, I simply go to sleep because I think getting enough rest is the most effective solution.\n\n结合我的经历\n\nWhen I feel mentally tired, I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Will you hang out with your friends when you are tired?\n\n原答案（项目已有稿）\n\nProbably not. As I just mentioned, when I’m tired, I prefer to stay at home and get some rest. Going out may make me even more exhausted.\n\n结合我的经历\n\nIt depends on how tired I am. If I am only mentally tired, a short walk and chat can help. If I really need sleep, I would rather rest and meet them another time.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "When do you usually feel tired?", "answer": "I often feel mentally tired after studying or working on a university project for a long time. It is usually a sign that I need a short break. I try not to keep forcing myself to work without stopping.", "set": "", "original": "I usually feel tired when I have a lot of schoolwork to finish. Sometimes I have to work on my projects or prepare for exams until late at night, which can be quite exhausting."}, {"question": "What do you do when you feel tired?", "answer": "When I feel mentally tired, I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "set": "A", "original": "Normally, I take a short break or listen to some soft music. If I’m extremely tired, I simply go to sleep because I think getting enough rest is the most effective solution."}, {"question": "Will you hang out with your friends when you are tired?", "answer": "It depends on how tired I am. If I am only mentally tired, a short walk and chat can help. If I really need sleep, I would rather rest and meet them another time.", "set": "", "original": "Probably not. As I just mentioned, when I’m tired, I prefer to stay at home and get some rest. Going out may make me even more exhausted."}], "exam": true}, {"id": "16-84", "title": "06 Names", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 记名字容易吗→脸与名字区别。\n- 怎么记→联系外貌、重复姓名、记录。\n- 忘名导致麻烦吗→真实小事，没有也可说没有。\n- 别人忘你名字什么感受→体谅或失落+原因。\n- 记名字重要吗→被重视+交流。\n\n", "answers": "### Do you find it easy to remember people’s names?\n\n原答案（项目已有稿）\n\nNot really. I’m much better at remembering people’s faces than their names. If I meet many new people at the same time, I may forget some names quite quickly.\n\n结合我的经历\n\nNot always. I sometimes remember a face more easily than a name. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember people’s names?\n\n原答案（项目已有稿）\n\nI usually connect their names with something about them, such as their appearance, major or personality. This makes the name much easier for me to remember.\n\n结合我的经历\n\nI write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Have you ever got into any trouble because you couldn’t remember someone’s name?\n\n原答案（项目已有稿）\n\nNothing serious, but I have had some awkward moments. Once I met someone I had talked to before, but I suddenly forgot her name, so I had to avoid using it during our conversation.\n\n结合我的经历\n\nIt has not caused a serious problem, but it can feel awkward. If I am not sure, I would rather ask politely than use the wrong name. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you feel when people can’t remember your name?\n\n原答案（项目已有稿）\n\nI don’t really mind, especially if we have only met once or twice. My Chinese name may also be difficult for some foreigners to remember, so I can understand that.\n\n结合我的经历\n\nI might feel a little disappointed, but I understand that it happens. Meeting lots of people makes names difficult to remember. I would simply remind them rather than take it personally.\n\n### Is it important to remember people’s names?\n\n原答案（项目已有稿）\n\nYes, especially at work or school. Remembering someone’s name shows that you pay attention to them and can make communication feel more personal.\n\n结合我的经历\n\nYes, it can make people feel that you have paid attention to them. It also makes a conversation more comfortable. I try to use a simple note if I am worried about forgetting.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you find it easy to remember people’s names?", "answer": "Not always. I sometimes remember a face more easily than a name. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F", "original": "Not really. I’m much better at remembering people’s faces than their names. If I meet many new people at the same time, I may forget some names quite quickly."}, {"question": "How do you remember people’s names?", "answer": "I write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F", "original": "I usually connect their names with something about them, such as their appearance, major or personality. This makes the name much easier for me to remember."}, {"question": "Have you ever got into any trouble because you couldn’t remember someone’s name?", "answer": "It has not caused a serious problem, but it can feel awkward. If I am not sure, I would rather ask politely than use the wrong name. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F", "original": "Nothing serious, but I have had some awkward moments. Once I met someone I had talked to before, but I suddenly forgot her name, so I had to avoid using it during our conversation."}, {"question": "How do you feel when people can’t remember your name?", "answer": "I might feel a little disappointed, but I understand that it happens. Meeting lots of people makes names difficult to remember. I would simply remind them rather than take it personally.", "set": "", "original": "I don’t really mind, especially if we have only met once or twice. My Chinese name may also be difficult for some foreigners to remember, so I can understand that."}, {"question": "Is it important to remember people’s names?", "answer": "Yes, it can make people feel that you have paid attention to them. It also makes a conversation more comfortable. I try to use a simple note if I am worried about forgetting.", "set": "", "original": "Yes, especially at work or school. Remembering someone’s name shows that you pay attention to them and can make communication feel more personal."}], "exam": true}, {"id": "16-85", "title": "07 Paper", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 童年用纸做什么→画画。\n- 童年做过纸物品吗→真实手工。\n- 出门带纸笔吗→当前习惯，别和旧六套矛盾。\n- 写过信吗→yes/no+真实时间。\n- 现在还写吗→现在频率+与消息比较。\n\n", "answers": "### What did you like to do with paper as a child?\n\n原答案（项目已有稿）\n\nI loved drawing on paper when I was a child. I could spend hours drawing cartoon characters, and I think this interest was one of the reasons why I later chose to study art.\n\n结合我的经历\n\nI mainly used it for drawing because I enjoyed making pictures. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Have you made objects with paper in childhood?\n\n原答案（项目已有稿）\n\nYes, definitely. I used to make simple paper objects such as paper planes and flowers. I really enjoyed the process because I have always liked making things by hand.\n\n结合我的经历\n\nI used paper for simple creative activities, especially drawing. I enjoyed turning an ordinary sheet into something personal. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Do you carry paper and pens with you when you go out?\n\n原答案（项目已有稿）\n\nNot usually. Nowadays I normally take notes on my phone or tablet because it’s more convenient. However, I still carry a pen when I go to class.\n\n结合我的经历\n\nYes, I carry a small notebook and a pen to make quick notes. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Have you written paper letters to others?\n\n原答案（项目已有稿）\n\nYes, but mainly when I was younger. I once wrote letters to my friends because handwritten letters felt more personal than online messages.\n\n结合我的经历\n\nI do not write many handwritten letters, and I cannot recall a particular one clearly. I usually communicate through messages now. A handwritten letter would feel more personal for a special occasion.\n\n### Do you still write paper letters?\n\n原答案（项目已有稿）\n\nHardly ever. Social media is much faster and more convenient, so now I normally send messages through my phone. However, I still think handwritten letters are quite meaningful.\n\n结合我的经历\n\nNot usually, because messages are faster and easier for everyday contact. But I would consider writing a card or letter for a meaningful occasion. Taking time over it can show that you care.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "What did you like to do with paper as a child?", "answer": "I mainly used it for drawing because I enjoyed making pictures. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E", "original": "I loved drawing on paper when I was a child. I could spend hours drawing cartoon characters, and I think this interest was one of the reasons why I later chose to study art."}, {"question": "Have you made objects with paper in childhood?", "answer": "I used paper for simple creative activities, especially drawing. I enjoyed turning an ordinary sheet into something personal. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E", "original": "Yes, definitely. I used to make simple paper objects such as paper planes and flowers. I really enjoyed the process because I have always liked making things by hand."}, {"question": "Do you carry paper and pens with you when you go out?", "answer": "Yes, I carry a small notebook and a pen to make quick notes. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F", "original": "Not usually. Nowadays I normally take notes on my phone or tablet because it’s more convenient. However, I still carry a pen when I go to class."}, {"question": "Have you written paper letters to others?", "answer": "I do not write many handwritten letters, and I cannot recall a particular one clearly. I usually communicate through messages now. A handwritten letter would feel more personal for a special occasion.", "set": "", "original": "Yes, but mainly when I was younger. I once wrote letters to my friends because handwritten letters felt more personal than online messages."}, {"question": "Do you still write paper letters?", "answer": "Not usually, because messages are faster and easier for everyday contact. But I would consider writing a card or letter for a meaningful occasion. Taking time over it can show that you care.", "set": "", "original": "Hardly ever. Social media is much faster and more convenient, so now I normally send messages through my phone. However, I still think handwritten letters are quite meaningful."}], "exam": true}, {"id": "16-86", "title": "08 Music", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 爱听吗→真实态度。\n- 音乐类型→具体类型。\n- 哪里听→房间、路上等真实地点。\n- 何时不听→需要专注或不能听。\n- 改变情绪吗→旋律与情绪的例子。\n\n", "answers": "### Do you like listening to music?\n\n原答案（项目已有稿）\n\nYes, I do. I especially like listening to music when I’m feeling tired or stressed because it helps me relax and escape from my daily worries for a while.\n\n结合我的经历\n\nYes, I especially enjoy happy music after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What kinds of music do you like to listen to?\n\n原答案（项目已有稿）\n\nI usually listen to soft pop music. I prefer songs with relaxing melodies because they can calm me down after a busy day.\n\n结合我的经历\n\nI prefer happy music, especially after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Where do you usually listen to music?\n\n原答案（项目已有稿）\n\nI mainly listen to music in my room or when I’m travelling by subway. I normally wear headphones, so I don’t disturb other people.\n\n结合我的经历\n\nI mainly listen when I want to relax outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### When don't you like to listen to music?\n\n原答案（项目已有稿）\n\nI don’t listen to music when I’m doing something that requires a lot of concentration. For example, during an important class or meeting, I prefer to focus completely on what is happening.\n\n结合我的经历\n\nI avoid it when I need to concentrate on a difficult task. For example, I want fewer distractions when practising English speaking. I enjoy music more during a proper break.\n\n### Can listening to music change people's emotions?\n\n原答案（项目已有稿）\n\nDefinitely. Happy music can make people feel more energetic, while soft music can help them calm down. That’s why many people listen to music when they feel stressed.\n\n结合我的经历\n\nYes, happy music gives me more energy. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "Do you like listening to music?", "answer": "Yes, I especially enjoy happy music after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "set": "A", "original": "Yes, I do. I especially like listening to music when I’m feeling tired or stressed because it helps me relax and escape from my daily worries for a while."}, {"question": "What kinds of music do you like to listen to?", "answer": "I prefer happy music, especially after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "set": "A", "original": "I usually listen to soft pop music. I prefer songs with relaxing melodies because they can calm me down after a busy day."}, {"question": "Where do you usually listen to music?", "answer": "I mainly listen when I want to relax outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "set": "A", "original": "I mainly listen to music in my room or when I’m travelling by subway. I normally wear headphones, so I don’t disturb other people."}, {"question": "When don't you like to listen to music?", "answer": "I avoid it when I need to concentrate on a difficult task. For example, I want fewer distractions when practising English speaking. I enjoy music more during a proper break.", "set": "", "original": "I don’t listen to music when I’m doing something that requires a lot of concentration. For example, during an important class or meeting, I prefer to focus completely on what is happening."}, {"question": "Can listening to music change people's emotions?", "answer": "Yes, happy music gives me more energy. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.", "set": "A", "original": "Definitely. Happy music can make people feel more energetic, while soft music can help them calm down. That’s why many people listen to music when they feel stressed."}], "exam": true}, {"id": "16-87", "title": "09 Social Media", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 何时开始→真实时期。\n- 朋友推荐过app吗→真实平台或没推荐过。\n- 更多空闲会多刷吗→would + 时间选择。\n- 不爱看内容→重复广告或失实信息+原因。\n\n", "answers": "### When did you start using social media?\n\n原答案（项目已有稿）\n\nI started using social media when I was in secondary school. At first, I mainly used it to chat with my classmates, but later I started using it for entertainment and study as well.\n\n结合我的经历\n\nI started using it when I was at school. At first, it was mainly a way to keep in touch with friends. Now I also use online platforms to find videos and ideas connected with my interests.\n\n### Have your friends ever recommended an app to you?\n\n原答案（项目已有稿）\n\nYes. My friends have recommended several apps to me, especially Bilibili. There are plenty of interesting videos on it, and I can also find useful tutorials related to art and design.\n\n结合我的经历\n\nFriends sometimes share useful videos or online content with me. I am especially interested in platforms where I can learn something new. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n### If you had more free time, would you spend it on social media?\n\n原答案（项目已有稿）\n\nMaybe a little, but probably not too much. If I had more free time, I would rather travel, exercise or spend time with my friends instead of staring at my phone all day.\n\n结合我的经历\n\nNot necessarily. I would like to use some extra time for a walk or to meet friends instead of only scrolling. If I did go online, I would prefer content that interested me or taught me something.\n\n### What kind of content do you dislike seeing on social media?\n\n原答案（项目已有稿）\n\nI dislike false or deliberately negative content. Some creators exaggerate things simply to grab public attention, and I find that kind of content quite annoying.\n\n结合我的经历\n\nI dislike repetitive advertisements and information that seems unreliable. They interrupt what I want to watch and waste time. I prefer useful content with a clear explanation.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"question": "When did you start using social media?", "answer": "I started using it when I was at school. At first, it was mainly a way to keep in touch with friends. Now I also use online platforms to find videos and ideas connected with my interests.", "set": "", "original": "I started using social media when I was in secondary school. At first, I mainly used it to chat with my classmates, but later I started using it for entertainment and study as well."}, {"question": "Have your friends ever recommended an app to you?", "answer": "Friends sometimes share useful videos or online content with me. I am especially interested in platforms where I can learn something new. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B", "original": "Yes. My friends have recommended several apps to me, especially Bilibili. There are plenty of interesting videos on it, and I can also find useful tutorials related to art and design."}, {"question": "If you had more free time, would you spend it on social media?", "answer": "Not necessarily. I would like to use some extra time for a walk or to meet friends instead of only scrolling. If I did go online, I would prefer content that interested me or taught me something.", "set": "", "original": "Maybe a little, but probably not too much. If I had more free time, I would rather travel, exercise or spend time with my friends instead of staring at my phone all day."}, {"question": "What kind of content do you dislike seeing on social media?", "answer": "I dislike repetitive advertisements and information that seems unreliable. They interrupt what I want to watch and waste time. I prefer useful content with a clear explanation.", "set": "", "original": "I dislike false or deliberately negative content. Some creators exaggerate things simply to grab public attention, and I find that kind of content quite annoying."}], "exam": true}, {"id": "16-88", "title": "10 Rubbish and recycling", "part": "P1", "group": "真题练习 · 项目新增题 · 原答案 / 个人版", "body": "\n- 回收纸塑料吗→分别说明，不只说纸。\n- 市民回收吗→所在社区观察。\n- 怎样回收→自己确知步骤，不编处理工艺。\n- 路上常见垃圾吗→具体地点和频率。\n- 见垃圾怎么做→真实行动。\n- 童年回收吗→旧纸画画、手工等真实行为。\n\n", "answers": "### Do you recycle rubbish, like paper and plastic?\n\n原答案（项目已有稿）\n\nYes, I try to. At home, we normally separate recyclable materials such as cardboard, plastic bottles and cans from other household waste.\n\n结合我的经历\n\nI try to separate recyclable paper and plastic when suitable bins are available. I also avoid throwing away things that I can still use. Small habits are easier to keep up regularly.\n\n### Do people in your city recycle rubbish?\n\n原答案（项目已有稿）\n\nYes, many people do. There are different rubbish bins in residential areas, which encourage residents to separate recyclable and non-recyclable waste.\n\n结合我的经历\n\nSome people do, especially where there are clearly labelled bins. It is easier when people know what goes where. I would not assume every household follows the same routine.\n\n### How is rubbish recycled in your city?\n\n原答案（项目已有稿）\n\nAs far as I know, people first put different types of rubbish into separate bins. Then it is collected and sent to recycling centres, where recyclable materials can be processed and reused.\n\n结合我的经历\n\nI keep recyclable items separate from ordinary rubbish and put them in the appropriate bin. I check the label if I am unsure. I do not know all the later processing steps, but I can sort my own waste properly.\n\n### Do you often see rubbish on the road?\n\n原答案（项目已有稿）\n\nNot very often. Most streets in the city are cleaned regularly, so they are generally quite tidy. However, I sometimes see plastic bottles or food packaging in crowded places.\n\n结合我的经历\n\nOccasionally, though it depends on the place. I notice it more where there are lots of people passing through. It makes a public space look less pleasant.\n\n### What do you do when you see rubbish on the street?\n\n原答案（项目已有稿）\n\nIf there is a rubbish bin nearby, I may pick it up and throw it away. I think it only takes a few seconds, but it can help keep the environment clean.\n\n结合我的经历\n\nIf it is a small, safe item and there is a bin nearby, I can put it in the bin. I would avoid touching anything dangerous. The most important habit is not leaving my own rubbish behind.\n\n### Did you recycle when you were a child?\n\n原答案（项目已有稿）\n\nYes, although I didn’t understand much about recycling at that time. Teachers at school sometimes asked us to collect used paper or plastic bottles, so I gradually developed this habit.\n\n结合我的经历\n\nI did not understand formal recycling very well then, but I sometimes used paper again for drawing. That was a simple way to avoid wasting it. Now I pay more attention to sorting things properly.", "cue": "原答案来自项目《回答文件新题》的已有稿；个人版优先串你已背过的六套。旧稿中的偏好和经历仅作对照，背诵以个人版为主。题目是项目已有练习题，不保证当季考试一定出现。", "qa": [{"qu
