<script>const DATA={"cards": [{"id": "4-0", "title": "A 听歌散步：休息和恢复", "part": "P1", "group": "P1 六套主线 · 你的原句优先", "body": "\n线索：耳机 → 短步行 → 放松。你课堂原回答有“听歌和散步”这个习惯。家附近公园和学校公园是两个地点，回答时选真实场景。\n\n> I put on my headphones and take a short walk.\n> The music and fresh air help me relax and clear my mind.\n\nMusic：I like cheerful music, especially after a busy day.\n\nHeadphones：I mainly use them when I'm travelling or taking a walk.\n\nBoredom：When I feel bored, I usually take a short break outside.\n\nTiredness：When I feel mentally tired, a short walk helps. If I'm physically exhausted, I prefer to rest.\n\n不适用于：音乐课时间、耳机类型、最近一次何时跑步。不能用散步回答所有身体疲劳情况。\n\n", "answers": "### Do you prefer sad or happy music?\n\nI prefer happy music, especially after a busy day. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Does happy music make you feel excited?\n\nYes, happy music gives me more energy. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Do you listen to music while doing other things?\n\nYes, I often listen to music when I go out for a walk. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### When do you use headphones?\n\nI mainly use them when I want to relax outdoors. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### Do you still like going to parks?\n\nYes, the park is one of my favourite places to relax. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### What do you like doing in a park?\n\nI like walking around and listening to music. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### W ting bored.", "cue": "记忆线索：B站短纪录片 → 画面和简单解释 → 学到东西不无聊。\n\n你已背过的核心句：\n\nI often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.\n\n接题先改第一句；题目要求时间、金额、具体对象时先回答。", "qa": [{"question": "What is your favourite website?", "answer": "Bilibili is my favourite website for learning something new. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "What kinds of websites do you visit?", "answer": "I mainly visit video websites, especially Bilibili. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "Do you like science?", "answer": "Yes, especially learning about space and the human body. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "Which science subject interests you?", "answer": "Biology interests me most because I want to understand how our bodies work. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "Do you enjoy science programmes?", "answer": "Yes, especially documentaries about space and the human body. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "Would you like to learn more about space?", "answer": "Definitely, I want to learn more about planets and stars. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "Do you like history?", "answer": "Yes, I enjoy learning how people lived in the past. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}, {"question": "What old building would you like to visit?", "answer": "I would love to see the Colosseum in Rome because its history interests me. I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "set": "B"}], "core": "I often watch short documentaries on Bilibili in my spare time. The pictures and simple explanations help me understand new things without getting bored.", "coreKey": "B"}, {"id": "4-2", "title": "C 朋友共同活动：一起做事，更有话聊", "part": "P1", "group": "P1 六套主线 · 你的原句优先", "body": "\n线索：共同活动 → 吃东西聊近况 → 更亲近。\n\n> We usually have something to eat and catch up afterwards.\n> It's a simple way to relax and stay connected.\n\nFilms：Yes, watching a film together gives us something to talk about afterwards.\n\nFriends：We sometimes meet in the city centre because it's easy to get to.\n\nSinging：I enjoy singing with friends more than singing on my own.\n\n这里的 afterwards 要有明确活动。聊天题直接说聊天内容即可，不必先硬加电影。\n\n", "answers": "### Who do you prefer watching sports with?\n\nI prefer watching sports with my friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Do you prefer watching sports alone or with friends?\n\nDefinitely with friends, because we can enjoy the excitement together. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.\n\n### Is watching a film a good way to spend time with friends?\n\nYes, watching a film together is a great way to spend time with friends. We usually get some snacks and chat about our week afterwards. It is a simple way to r.", "set": "C"}, {"question": "Do you like singing?", "answer": "Yes, especially karaoke with friends, because it is fun. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.", "set": "C"}, {"question": "What do you do in your spare time?", "answer": "I like meeting friends for a film or a walk. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.", "set": "C"}, {"question": "Are your weekend evenings the same as weekday evenings?", "answer": "No, I rest at home on weekdays, but on weekends I often go out with friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.", "set": "C"}, {"question": "Do you prefer shopping malls or street markets?", "answer": "I prefer street markets because I enjoy exploring them with friends. We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.", "set": "C"}], "core": "We usually get some snacks and chat about our week afterwards. It is a simple way to relax and feel closer to each other.", "coreKey": "C"}, {"id": "4-3", "title": "D 实用与质量：学生预算", "part": "P1", "group": "P1 六套主线 · 你的原句优先", "body": "\n线索：会经常用 → 舒服耐用 → 花得值。\n\n> For everyday things, comfort and quality matter most to me.\n> As a student, I try to buy things that are useful and worth the money.\n\nShoes：I prefer comfortable shoes because I walk a lot on campus.\n\nClothing：I usually wear casual clothes, unless it's a formal occasion.\n\nShopping：I like comparing prices and reading reviews before buying something.\n\nCamera：I'd like a lightweight camera that takes clear photos.\n\n汽车不适合谈 comfort and quality 两句就结束：先回答颜色、购买意愿或预算。鞋金额、相机价格按真实预算填，原稿的 300 元和 8,000 元均不是你的已确认数字。\n\n", "answers": "### Do you like buying shoes, and how often do you buy them?\n\nYes, but usually only two or three times a year, when I need a new pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### How much do you spend on shoes?\n\nI usually spend around three hundred yuan on a pair of shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you prefer fashionable or comfortable shoes?\n\nI definitely prefer comfortable shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### What kind of clothes do you like wearing?\n\nI like simple, comfortable clothes such as jeans and soft T-shirts. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you prefer casual or formal clothes?\n\nI usually prefer casual clothes, unless it is a formal occasion. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### What kind of headphones do you use?\n\nI use lightweight wireless headphones that fit comfortably. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Is wearing a watch important to you?\n\nFor me, yes, because I can check the time quickly without taking out my phone. It is a practical way to keep track of time. I care more about how well it works than the brand.\n\n### Does a car's colour matter?\n\nNot really, because I care more about how well the car works. For a car, safety and quality would matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Would you buy an expensive car in the future?\n\nOnly if I could afford it and the quality made it worth the money. For a car, safety and quality would matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### Do you like shopping?\n\nYes, but I usually shop only when I actually need something. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "cue": "记忆线索：天天用 → 舒服和质量 → 不为品牌多花钱。\n\n你已背过的核心句：\n\nFor everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n接题先改第一句；题目要求时间、金额、具体对象时先回答。", "qa": [{"question": "Do you like buying shoes, and how often do you buy them?", "answer": "Yes, but usually only two or three times a year, when I need a new pair. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}, {"question": "How much do you spend on shoes?", "answer": "I usually spend around three hundred yuan on a pair of shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}, {"question": "Do you prefer fashionable or comfortable shoes?", "answer": "I definitely prefer comfortable shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}, {"question": "What kind of clothes do you like wearing?", "answer": "I like simple, comfortable clothes such as jeans and soft T-shirts. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}, {"question": "Do you prefer casual or formal clothes?", "answer": "I usually prefer casual clothes, unless it is a formal occasion. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}, {"question": "What kind of headphones do you use?", "answer": "I use lightweight wireless headphones that fit comfortably. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}, {"question": "Is wearing a watch important to you?", "answer": "For me, yes, because I can check the time quickly without taking out my phone. It is a practical way to keep track of time. I care more about how well it works than the brand.", "set": ""}, {"question": "Does a car's colour matter?", "answer": "Not really, because I care more about how well the car works. For a car, safety and quality would matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": ""}, {"question": "Would you buy an expensive car in the future?", "answer": "Only if I could afford it and the quality made it worth the money. For a car, safety and quality would matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": ""}, {"question": "Do you like shopping?", "answer": "Yes, but I usually shop only when I actually need something. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "set": "D"}], "core": "For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.", "coreKey": "D"}, {"id": "4-4", "title": "E 童年与家庭：用你的相机和月饼替换泛泛回忆", "part": "P1", "group": "P1 六套主线 · 你的原句优先", "body": "\n线索：妈妈拍照 / 中秋生日 → 温暖回忆 → 珍惜家庭时间。\n\n> Those memories always make me smile.\n> They remind me how much I enjoyed spending time with my family.\n\nPhotos：My mother took lots of pictures of me when I was young.\n\nFestivals：The Mid-Autumn Festival is special to me because my birthday falls on that day.\n\nGifts：I looked forward to seeing my relatives and receiving birthday gifts.\n\n不用背原练习册“奶奶花园吃西瓜”“和妈妈做纸星星”这些未确认经历。你的中秋生日、妈妈相机已经更好记。\n\n", "answers": "### Do you keep anything from your childhood?\n\nYes, I still keep family photos from my childhood. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Do you keep old things for a long time?\n\nYes, especially old family photos, because I do not want to lose those memories. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Do photos help you remember things?\n\nYes, old family photos help me remember little things from my childhood. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### What is one of your earliest memories?\n\nOne of my early memories is celebrating my birthday during the Mid-Autumn Festival with my family. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you like going to parks as a child?\n\nYes, I liked going to the park with my family when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you often watch films as a child?\n\nYes, I watched animated films with my family when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### What did you do in the evenings as a child?\n\nI watched cartoons with my family after dinner because it was fun. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you make things out of paper as a child?\n\nYes, I used paper for simple creative activities, especially drawing. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### What did you like doing with paper as a child?\n\nI liked drawing pictures on paper when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n### Did you take long trips with your family as a child?\n\nI do not remember a particular long trip clearly, but I do remember enjoying time with my family. My strongest memories are family celebrations and birthdays. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "cue": "记忆线索：童年画面 → 回想会笑 → 和家人在一起。\n\n你已背过的核心句：\n\nLooking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.\n\n接题先改第一句；题目要求时间、金额、具体对象时先回答。", "qa": [{"question": "Do you keep anything from your childhood?", "answer": "Yes, I still keep family photos from my childhood. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "Do you keep old things for a long time?", "answer": "Yes, especially old family photos, because I do not want to lose those memories. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "Do photos help you remember things?", "answer": "Yes, old family photos help me remember little things from my childhood. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "What is one of your earliest memories?", "answer": "One of my early memories is celebrating my birthday during the Mid-Autumn Festival with my family. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "Did you like going to parks as a child?", "answer": "Yes, I liked going to the park with my family when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "Did you often watch films as a child?", "answer": "Yes, I watched animated films with my family when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "What did you do in the evenings as a child?", "answer": "I watched cartoons with my family after dinner because it was fun. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "Did you make things out of paper as a child?", "answer": "Yes, I used paper for simple creative activities, especially drawing. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "What did you like doing with paper as a child?", "answer": "I liked drawing pictures on paper when I was a child. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}, {"question": "Did you take long trips with your family as a child?", "answer": "I do not remember a particular long trip clearly, but I do remember enjoying time with my family. My strongest memories are family celebrations and birthdays. Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "set": "E"}], "core": "Looking back at those moments always makes me smile. They remind me how much I enjoyed spending time with my family.", "coreKey": "E"}, {"id": "4-5", "title": "F 整理与记录：减少忘事和分心", "part": "P1", "group": "P1 六套主线 · 你的原句优先", "body": "\n线索：固定位置 / 记下任务 → 找得到 / 知道下一步。\n\n> I write important things down so I can check them later.\n> It saves time and helps me feel less stressed.\n\nNames：I try to connect a person's name with their face or where we met.\n\nTidiness：I find it easier to focus when my desk is tidy.\n\nMemory：I use notes and reminders for important things.\n\nBetty 的“有条理”不能自动写成你自己一直很有条理。可以说 I'm trying to become more organised。\n\n", "answers": "### Do you like keeping things tidy?\n\nYes, I like keeping my space organised. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you keep your study space tidy?\n\nI put my books away and clear my desk after studying. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Is it important to be tidy?\n\nYes, because being organised makes daily life easier. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Where do you keep everyday things?\n\nMy keys go by the door, and my books stay on the shelf. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you have a good memory?\n\nNot really, so I use notes and routines to help me. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember important things?\n\nI make notes on my phone and set reminders for important dates. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### How do you remember names?\n\nI write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you carry paper and a pen?\n\nYes, I carry a small notebook and a pen to make quick notes. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.\n\n### Have you ever lost your keys?\n\nI have had trouble finding my keys, so I try to keep them in one place now. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n### Do you like your home?\n\nYes, I like our family home, which is a villa in the suburbs of Chengdu. During term time, I stay in a university dormitory. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "cue": "记忆线索：固定位置 + 重要事情记下 → 省时少担心。\n\n你已背过的核心句：\n\nI keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.\n\n接题先改第一句；题目要求时间、金额、具体对象时先回答。", "qa": [{"question": "Do you like keeping things tidy?", "answer": "Yes, I like keeping my space organised. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "How do you keep your study space tidy?", "answer": "I put my books away and clear my desk after studying. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "Is it important to be tidy?", "answer": "Yes, because being organised makes daily life easier. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "Where do you keep everyday things?", "answer": "My keys go by the door, and my books stay on the shelf. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "Do you have a good memory?", "answer": "Not really, so I use notes and routines to help me. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "How do you remember important things?", "answer": "I make notes on my phone and set reminders for important dates. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "How do you remember names?", "answer": "I write their name and where we met in a note on my phone. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "Do you carry paper and a pen?", "answer": "Yes, I carry a small notebook and a pen to make quick notes. I write important things down so I can check them later. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "Have you ever lost your keys?", "answer": "I have had trouble finding my keys, so I try to keep them in one place now. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}, {"question": "Do you like your home?", "answer": "Yes, I like our family home, which is a villa in the suburbs of Chengdu. During term time, I stay in a university dormitory. I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "set": "F"}], "core": "I keep my everyday things in fixed places and write important things down. It saves me time and stops me worrying about losing or forgetting something.", "coreKey": "F"}, {"id": "5-6", "title": "身份和专业", "part": "P1", "group": "05 P1 必须单独准备的回答", "body": "\n> I'm a university student, and I study digital media art. I enjoy it because I can combine art with technology and work on creative projects.\n\n大学名称、年级、最喜欢的课程、最难的课程、每周学习时间需自己填准，不从老师的身份借用。避免照搬 Lesley “我是一位雅思老师”“周末上课、周一休息”。\n\n", "answers": "I'm a university student, and I study digital media art. I enjoy it because I can combine art with technology and work on creative projects.", "cue": "\n\n大学名称、年级、最喜欢的课程、最难的课程、每周学习时间需自己填准，不从老师的身份借用。避免照搬 Lesley “我是一位雅思老师”“周末上课、周一休息”。\n"}, {"id": "5-7", "title": "家乡与居住：浙江籍贯、成都成长、家和宿舍", "part": "P1", "group": "05 P1 必须单独准备的回答", "body": "\n你在父亲素材里说一岁时搬到成都。不要直接写成 I was born and raised in Chengdu，除非出生地也确认。\n\n> I grew up in Chengdu. My family moved there when I was about one year old.\n\n若问现在住哪里：按真实住处回答 dormitory / flat / house，不把“家在郊区”写成大学期间每天都住家。\n\n", "answers": "### Where are you from?\n\nI am originally from Zhejiang, but I grew up in Chengdu. My family moved there when I was about one year old. So Chengdu is the place I feel most familiar with.\n\n### Where did you grow up?\n\nI grew up in Chengdu, although I am originally from Zhejiang. My family moved to Chengdu when I was about one year old. Most of my childhood memories are connected with the city.\n\n### Do you live in a house or a flat?\n\nMy family home is a house in the suburbs of Chengdu. It is a villa, so there is more space than in my university dormitory. During term time, I stay in the dormitory because it is convenient for my classes.\n\n### Where do you live while studying?\n\nI live in a university dormitory during term time. My family home is a villa in the suburbs of Chengdu. Staying on campus makes it easier to get to classes and work on university projects.\n\n### Do you like your home?\n\nYes, I do. Our house is in the suburbs, and I like having space to relax with my family. At university, my dormitory is more convenient for studying, so the two places suit different parts of my life.", "cue": "固定事实：浙江人；约一岁随家人到成都，在成都长大；家在郊区别墅；上学住宿舍。先分清问籍贯、成长地、家庭住处还是在校住处。", "qa": [{"question": "Where are you from?", "answer": "I am originally from Zhejiang, but I grew up in Chengdu. My family moved there when I was about one year old. So Chengdu is the place I feel most familiar with."}, {"question": "Where did you grow up?", "answer": "I grew up in Chengdu, although I am originally from Zhejiang. My family moved to Chengdu when I was about one year old. Most of my childhood memories are connected with the city."}, {"question": "Do you live in a house or a flat?", "answer": "My family home is a house in the suburbs of Chengdu. It is a villa, so there is more space than in my university dormitory. During term time, I stay in the dormitory because it is convenient for my classes."}, {"question": "Where do you live while studying?", "answer": "I live in a university dormitory during term time. My family home is a villa in the suburbs of Chengdu. Staying on campus makes it easier to get to classes and work on university projects."}, {"question": "Do you like your home?", "answer": "Yes, I do. Our house is in the suburbs, and I like having space to relax with my family. At university, my dormitory is more convenient for studying, so the two places suit different parts of my life."}]}, {"id": "5-8", "title": "频率、时间、金额和距离", "part": "P1", "group": "05 P1 必须单独准备的回答", "body": "\n- How often：I usually… once or twice a week. 数字需真实。\n- When was the last time：The last time was… 时间先说。\n- How much：I usually spend around… 金额先说。\n- How far：It's about… kilometres away. / It takes about… by subway. 距离和用时分清。\n- Have you ever：Yes, I have. I… last… / No, I haven't, but I'd like to…\n\n", "answers": "### How often do you listen to music?\n\nI listen to music quite often, especially when I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better.\n\n### How much do you spend on shoes?\n\nI usually spend around three hundred yuan on a pair of shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand.\n\n### When was the last time you went running?\n\nI cannot remember the exact last time because I do not run regularly. Walking is a bigger part of my routine. I often choose a short walk when I feel mentally tired.\n\n### How far is your home from school?\n\nI do not have the exact distance in kilometres in mind. For everyday journeys around university, I usually walk, while a trip from home needs more planning. I tend to think about travel time rather than distance.\n\n### Have you ever visited a famous museum?\n\nYes, I visited the Louvre on a graduation trip. There were lots of people, but seeing the paintings in person was worth the effort. It was a memorable experience for me.", "cue": "\n- How often：I usually… once or twice a week. 数字需真实。\n- When was the last time：The last time was… 时间先说。\n- How much：I usually spend around… 金额先说。\n- How far：It's about… kilometres away. / It takes about… by subway. 距离和用时分清。\n- Have you ever：Yes, I have. I… last… / No, I haven't, but I'd like to…\n", "qa": [{"question": "How often do you listen to music?", "answer": "I listen to music quite often, especially when I take a break outside. I put on my headphones and take a short walk in the park near my home. The music and fresh air help me relax and feel better."}, {"question": "How much do you spend on shoes?", "answer": "I usually spend around three hundred yuan on a pair of shoes. For everyday things, comfort and quality matter most to me. I would rather buy something useful that lasts than pay extra just for a famous brand."}, {"question": "When was the last time you went running?", "answer": "I cannot remember the exact last time because I do not run regularly. Walking is a bigger part of my routine. I often choose a short walk when I feel mentally tired."}, {"question": "How far is your home from school?", "answer": "I do not have the exact distance in kilometres in mind. For everyday journeys around university, I usually walk, while a trip from home needs more planning. I tend to think about travel time rather than distance."}, {"question": "Have you ever visited a famous museum?", "answer": "Yes, I visited the Louvre on a graduation trip. There were lots of people, but seeing the paintings in person was worth the effort. It was a memorable experience for me."}]}, {"id": "5-9", "title": "没做过、不熟悉，也能答", "part": "P1", "group": "05 P1 必须单独准备的回答", "body": "\n> I haven't tried it myself, so I don't know much about it. But I'd be interested in giving it a try.\n\n不要每道陌生题都说忙。例：Do you want to be a geography teacher? 可以说 No, I'd rather work in a field related to art and design，而不必借“学习太忙”绕开职业意愿。\n\n", "answers": "I haven't tried it myself, so I don't know much about it. But I'd be interested in giving it a try.", "cue": "\n\n不要每道陌生题都说忙。例：Do you want to be a geography teacher? 可以说 No, I'd rather work in a field related to art and design，而不必借“学习太忙”绕开职业意愿。\n"}, {"id": "6-10", "title": "01 Betty：有条理、喜欢历史、帮助学习", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：项目《描述童年朋友》。当前读取到的是较晚的历史/条理版本；Betty 的姓名、认识时间及帮助细节按本人核对。middle school 不等于幼年；若题目强调 childhood，先确认实际年龄是否适合。\n\n> When I saw this topic, the first person that popped up in my mind was my friend Betty, who I met in middle school.\n>\n> To tell you more about her, she's outgoing and positive, but she's also very organised. Personally, what impresses me most is the way she studies. She doesn't just spend hours memorising things without a plan.\n>\n> Speaking of how I noticed this, she once explained her way of learning history to me. First, she watches documentaries to understand the background. Then she reads books and makes simple notes and timelines. This helps her put different events in the right order. Sometimes, she connects what she has learned with things she sees in museums.\n>\n> As for the highlight of her method, she breaks a difficult subject into smaller steps. That makes it easier to follow, and she knows what to do next instead of feeling lost.\n>\n> When it comes to why I admire her, I think she shows that learning is about finding the right method as well as working hard. Her approach has encouraged me to plan my own studies more carefully.\n>\n> To conclude, Betty is someone I can learn from, and I really admire her patience and ability to stay organised.\n\n一分钟笔记：Betty / middle school / organised / documentary → books → notes → timeline / small steps / right method。\n\n迁移：历史的人强调 why history；有条理的人强调 steps；帮助过你的人需补“她具体帮助我做了什么、之后改变了什么”；童年朋友强调相识和共同经历。只换第一句不足以覆盖这四题。\n\n", "answers": "When I saw this topic, the first person that popped up in my mind was my friend Betty, who I met in middle school.\n\nTo tell you more about her, she's outgoing and positive, but she's also very organised. Personally, what impresses me most is the way she studies. She doesn't just spend hours memorising things without a plan.\n\nSpeaking of how I noticed this, she once explained her way of learning history to me. First, she watches documentaries to understand the background. Then she reads books and makes simple notes and timelines. This helps her put different events in the right order. Sometimes, she connects what she has learned with things she sees in museums.\n\nAs for the highlight, she breaks a difficult subject into smaller steps. That makes it easier to follow, and she knows what to do next instead of feeling lost.\n\nWhen it comes to why I admire her, I think she shows that learning is about finding the right method as well as working hard. Her approach has encouraged me to plan my own studies more carefully.\n\nTo conclude, Betty is someone I can learn from, and I really admire her patience and ability to stay organised.", "cue": "题目：Describe an organised person you know.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：项目《描述童年朋友》。当前读取到的是较晚的历史/条理版本；Betty 的姓名、认识时间及帮助细节按本人核对。middle school 不等于幼年；若题目强调 childhood，先确认实际年龄是否适合。\n\n\n一分钟笔记：Betty / middle school / organised / documentary → books → notes → timeline / small steps / right method。\n\n迁移：历史的人强调 why history；有条理的人强调 steps；帮助过你的人需补“她具体帮助我做了什么、之后改变了什么”；童年朋友强调相识和共同经历。只换第一句不足以覆盖这四题。\n", "question": "Describe an organised person you know."}, {"id": "6-11", "title": "02 校庆项目：团队、调整计划、微笑的会议", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：项目《会议 微笑的场合 不能用手机》。校庆 120 周年、会议和改方案均出现在现有稿中；你在原回答亲口讲了会议氛围。你负责的具体工作尚未确认，练习时补一句真实职责。\n\n> When I saw this topic, the first experience that popped up in my mind was a creative project for my university's 120th birthday.\n>\n> To tell you more about it, I worked with several teammates on the project. We wanted to make something creative, but we were worried about finishing it on time.\n>\n> Speaking of what happened, our original plan involved making the whole project by hand. After trying it, we realised that it would take too much time. The hardest part was deciding what to change without losing our main idea.\n>\n> As for the turning point, we had a meeting and listened to everyone's suggestions. We decided to combine real-life footage with animation. We also split the tasks between us, so each person knew what to work on. Once we had a clear plan, we felt more confident and could make progress.\n>\n> When it comes to how I felt about it, I was relieved because we had found a practical solution. I also learned that good teamwork involves listening to other people and being willing to change a plan.\n>\n> To conclude, this project taught me that a clear plan and good communication can make a difficult task much more manageable.\n\n一分钟笔记：120th birthday / team / handmade too slow / meeting / footage + animation / split tasks / confident。\n\n迁移重点：改计划讲 original plan → why changed → new plan → result；微笑的场合讲 relaxed atmosphere → share ideas → useful suggestions；团队题补本人分工。\n\n不能用手机题：现有标题提到它，但读取到的正文没有明确手机禁用规则。只有确实不允许用手机，才能把这次会议作为答案，补谁规定、为什么、你的反应。不要自行补一个禁令。独立《项目计划的调整》聊天尚未读取；当前采用这条聊天里已有的调整内容。\n\n", "answers": "When I saw this topic, the first experience that popped up in my mind was a creative project for my university's 120th birthday.\n\nTo tell you more about it, I worked with several teammates on the project. We wanted to make something creative, but we were worried about finishing it on time.\n\nSpeaking of what happened, our original plan involved making the whole project by hand. After trying it, we realised that it would take too much time. The hardest part was deciding what to change without losing our main idea.\n\nAs for the highlight, we had a meeting and listened to everyone's suggestions. We decided to combine real-life footage with animation. We also split the tasks between us, so each person knew what to work on. Once we had a clear plan, we felt more confident and could make progress.\n\nWhen it comes to how I felt about it, I was relieved because we had found a practical solution. I also learned that good teamwork involves listening to other people and being willing to change a plan.\n\nTo conclude, this project taught me that a clear plan and good communication can make a difficult task much more manageable.", "cue": "题目：Describe a time you changed a plan while working with others.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：项目《会议 微笑的场合 不能用手机》。校庆 120 周年、会议和改方案均出现在现有稿中；你在原回答亲口讲了会议氛围。你负责的具体工作尚未确认，练习时补一句真实职责。\n\n\n一分钟笔记：120th birthday / team / handmade too slow / meeting / footage + animation / split tasks / confident。\n\n迁移重点：改计划讲 original plan → why changed → new plan → result；微笑的场合讲 relaxed atmosphere → share ideas → useful suggestions；团队题补本人分工。\n\n不能用手机题：现有标题提到它，但读取到的正文没有明确手机禁用规则。只有确实不允许用手机，才能把这次会议作为答案，补谁规定、为什么、你的反应。不要自行补一个禁令。独立《项目计划的调整》聊天尚未读取；当前采用这条聊天里已有的调整内容。\n", "question": "Describe a time you changed a plan while working with others."}, {"id": "6-12", "title": "03 学校读书公园：水边、亭子、长椅", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：你在项目《读书公园素材套用》亲口说明学校里、水边、亭子、长椅，以及散步、聊天、晒太阳、拍照、复习。水体是否为湖没有明确，下面用 water；确认后可改 lake。\n\n> When I saw this topic, the first place that popped up in my mind was a small park on my university campus.\n>\n> To tell you more about it, the park is beside the water. There is a small pavilion and some benches where people can sit and read. Personally, I like it because it's close to my classes and gives me a quiet place to take a break.\n>\n> Speaking of what I do there, I usually take a walk, chat with friends or enjoy the sunshine. I also like taking photos because the water and trees make a lovely background. I've even reviewed my notes there when I wanted a change from studying indoors.\n>\n> As for the best part, I can spend time there without feeling rushed. I don't need to organise a long trip or spend much money. Sometimes, a short walk is enough to help me clear my mind.\n>\n> When it comes to why I like it, the main reason is that it fits naturally into my daily life. I can relax there and then return to my work feeling more refreshed.\n>\n> To conclude, it's a simple place, but it makes university life more enjoyable for me.\n\n一分钟笔记：campus / water / pavilion / benches / walk + chat / sunshine + photos / reviewed notes / refreshed。\n\n迁移：quiet place 讲声音与氛围；photo place 讲背景与拍什么；study place 讲一次复习过程；public park 若题目限定校外公共场所，应确认学校公园是否符合。\n\n", "answers": "When I saw this topic, the first place that popped up in my mind was a small park on my university campus.\n\nTo tell you more about it, the park is beside the water. There is a small pavilion and some benches where people can sit and read. Personally, I like it because it's close to my classes and gives me a quiet place to take a break.\n\nSpeaking of what I do there, I usually take a walk, chat with friends or enjoy the sunshine. I also like taking photos because the water and trees make a lovely background. I've even reviewed my notes there when I wanted a change from studying indoors.\n\nAs for the highlight, I can spend time there without feeling rushed. I don't need to organise a long trip or spend much money. Sometimes, a short walk is enough to help me clear my mind.\n\nWhen it comes to why I like it, the main reason is that it fits naturally into my daily life. I can relax there and then return to my work feeling more refreshed.\n\nTo conclude, it's a simple place, but it makes university life more enjoyable for me.", "cue": "题目：Describe a place where you like to relax.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：你在项目《读书公园素材套用》亲口说明学校里、水边、亭子、长椅，以及散步、聊天、晒太阳、拍照、复习。水体是否为湖没有明确，下面用 water；确认后可改 lake。\n\n\n一分钟笔记：campus / water / pavilion / benches / walk + chat / sunshine + photos / reviewed notes / refreshed。\n\n迁移：quiet place 讲声音与氛围；photo place 讲背景与拍什么；study place 讲一次复习过程；public park 若题目限定校外公共场所，应确认学校公园是否符合。\n", "question": "Describe a place where you like to relax."}, {"id": "6-13", "title": "04 卢浮宫：拥挤但值得", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《巴黎旅行素材建议》和课堂原回答。参观、毕业旅行、蒙娜丽莎可用。旧稿同行者出现 friends 与 family 的不同版本，下面不指定；准备时统一为真实同行者。嘈杂细节原先是迁移建议，仅确实发生时采用。\n\n> When I saw this topic, the first place that popped up in my mind was the Louvre Museum in Paris, which I visited during my graduation trip.\n>\n> To tell you more about it, I had learned about the museum through books and documentaries, so I had really wanted to see it. Personally, I was excited because I'm interested in art and design.\n>\n> Speaking of what happened, I was surprised by how crowded it was. There were long queues, and the area around the Mona Lisa was especially busy. It was difficult to move around comfortably, so I had to be patient.\n>\n> As for the highlight, it was seeing the artworks in person. Looking at them on a screen was very different from actually standing in front of them. I paid attention to the paintings and also enjoyed walking through the galleries.\n>\n> When it comes to how I felt, I had mixed feelings. The crowds made me feel overwhelmed, but the artworks made the visit worthwhile. I would like to go back at a quieter time so I could enjoy the museum more slowly.\n>\n> To conclude, it was a crowded but memorable place, and the experience was still worth it for me.\n\n一分钟笔记：Louvre / graduation trip / art / queue / Mona Lisa / hard to move / mixed feelings / worth it。\n\n拥挤与嘈杂分开：crowded = long queues / hard to move；noisy = chatting / footsteps / difficult to hear。拥挤本身不能证明嘈杂。旅游题讲去了哪里、做了什么；想再去讲 what would be different next time。\n\n", "answers": "When I saw this topic, the first place that popped up in my mind was the Louvre Museum in Paris, which I visited during my graduation trip.\n\nTo tell you more about it, I had learned about the museum through books and documentaries, so I had really wanted to see it. Personally, I was excited because I'm interested in art and design.\n\nSpeaking of what happened, I was surprised by how crowded it was. There were long queues, and the area around the Mona Lisa was especially busy. It was difficult to move around comfortably, so I had to be patient.\n\nAs for the highlight, it was seeing the artworks in person. Looking at them on a screen was very different from actually standing in front of them. I paid attention to the paintings and also enjoyed walking through the galleries.\n\nWhen it comes to how I felt, I had mixed feelings. The crowds made me feel overwhelmed, but the artworks made the visit worthwhile. I would like to go back at a quieter time so I could enjoy the museum more slowly.\n\nTo conclude, it was a crowded but memorable place, and the experience was still worth it for me.", "cue": "题目：Describe a crowded place you visited.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《巴黎旅行素材建议》和课堂原回答。参观、毕业旅行、蒙娜丽莎可用。旧稿同行者出现 friends 与 family 的不同版本，下面不指定；准备时统一为真实同行者。嘈杂细节原先是迁移建议，仅确实发生时采用。\n\n\n一分钟笔记：Louvre / graduation trip / art / queue / Mona Lisa / hard to move / mixed feelings / worth it。\n\n拥挤与嘈杂分开：crowded = long queues / hard to move；noisy = chatting / footsteps / difficult to hear。拥挤本身不能证明嘈杂。旅游题讲去了哪里、做了什么；想再去讲 what would be different next time。\n", "question": "Describe a crowded place you visited."}, {"id": "6-14", "title": "05 篮球比赛：支持朋友，担心受伤", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《篮球比赛经历分享》和你在《宫崎骏广告描述》中粘贴的篮球稿。朋友眼镜在练习时被撞掉、受轻伤出现于已有稿。是否获胜不能只依据此前助手添加的句子，下面不编比分和结果。\n\n> When I saw this topic, the first event that popped up in my mind was a basketball match I watched in high school.\n>\n> To tell you more about it, the match was held on our school basketball court. Personally, I was especially excited because a close friend was taking part, and I wanted to support her.\n>\n> Speaking of what happened, we sat quite close to the court, so we could feel the energy of the crowd. Everyone was cheering, and it was very different from watching a match on a screen.\n>\n> As for the highlight, it was my friend's performance. A few days before the match, her glasses had been knocked off during practice, and she had been slightly injured. I was worried about her, so I paid more attention to how she was doing than to the score. Watching her on the court made me feel proud of her courage.\n>\n> When it comes to why I remember it, it was more than just a sports event for me. I was there for someone I cared about, and I could see how much effort she had put into it.\n>\n> To conclude, what stays with me is my friend's courage and the lively atmosphere, more than the final score.\n\n一分钟笔记：high school / basketball / support friend / close seats / glasses + injury / worried / courage。\n\n迁移：live event 强调现场；friend proud of 强调她的行为；exciting experience 强调你的情绪。不能改成“我参加了比赛”或“家人让我骄傲”，除非符合事实。删去不贴合事件的 getting started is half the battle，不再堆三条谚语。\n\n", "answers": "When I saw this topic, the first event that popped up in my mind was a basketball match I watched in high school.\n\nTo tell you more about it, the match was held on our school basketball court. Personally, I was especially excited because a close friend was taking part, and I wanted to support her.\n\nSpeaking of what happened, we sat quite close to the court, so we could feel the energy of the crowd. Everyone was cheering, and it was very different from watching a match on a screen.\n\nAs for the highlight, it was my friend's performance. A few days before the match, her glasses had been knocked off during practice, and she had been slightly injured. I was worried about her, so I paid more attention to how she was doing than to the score. Watching her on the court made me feel proud of her courage.\n\nWhen it comes to why I remember it, it was more than just a sports event for me. I was there for someone I cared about, and I could see how much effort she had put into it.\n\nTo conclude, what stays with me is my friend's courage and the lively atmosphere, more than the final score.", "cue": "题目：Describe a sports event you watched.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《篮球比赛经历分享》和你在《宫崎骏广告描述》中粘贴的篮球稿。朋友眼镜在练习时被撞掉、受轻伤出现于已有稿。是否获胜不能只依据此前助手添加的句子，下面不编比分和结果。\n\n\n一分钟笔记：high school / basketball / support friend / close seats / glasses + injury / worried / courage。\n\n迁移：live event 强调现场；friend proud of 强调她的行为；exciting experience 强调你的情绪。不能改成“我参加了比赛”或“家人让我骄傲”，除非符合事实。删去不贴合事件的 getting started is half the battle，不再堆三条谚语。\n", "question": "Describe a sports event you watched."}, {"id": "6-15", "title": "06 宫崎骏采访：童年喜欢动画，现在关注创作", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《宫崎骏广告描述》。虽然聊天标题写广告，较晚内容明确是 interview。主题名称按实际媒介判断。\n\n> When I saw this topic, the first interview that popped up in my mind was an interview with Hayao Miyazaki, a Japanese animation director.\n>\n> To tell you more about it, I watched it online during a study break. Personally, I was interested in how he got ideas for his films because I had liked his work since I was a child.\n>\n> Speaking of the interview, he talked about his drawings and the work behind his animated films. His films have beautiful pictures, but they also tell warm and meaningful stories. That's why I wanted to learn more about the process.\n>\n> As for the highlight, it was hearing about the time and patience involved in creating animation. When I was younger, I enjoyed copying drawings from his films. Listening to him made me think about the effort behind the pictures I had enjoyed.\n>\n> When it comes to why I liked it, I found it inspiring as a digital media art student. It reminded me that creative work takes practice and that I shouldn't expect every project to be easy.\n>\n> To conclude, the interview was interesting and encouraged me to keep improving my own work.\n\n一分钟笔记：Miyazaki / online interview / ideas / films + drawings / copied pictures / patience / motivated。\n\n广告题需要另一套内容：它宣传什么、在哪看到、人物怎样出现、广告效果。旧回答提议“宫崎骏展览广告”，你未在所读用户消息里确认具体广告，不将其写成已发生的事实。\n\n", "answers": "When I saw this topic, the first interview that popped up in my mind was an interview with Hayao Miyazaki, a Japanese animation director.\n\nTo tell you more about it, I watched it online during a study break. Personally, I was interested in how he got ideas for his films because I had liked his work since I was a child.\n\nSpeaking of the interview, he talked about his drawings and the work behind his animated films. His films have beautiful pictures, but they also tell warm and meaningful stories. That's why I wanted to learn more about the process.\n\nAs for the highlight, it was hearing about the time and patience involved in creating animation. When I was younger, I enjoyed copying drawings from his films. Listening to him made me think about the effort behind the pictures I had enjoyed.\n\nWhen it comes to why I liked it, I found it inspiring as a digital media art student. It reminded me that creative work takes practice and that I shouldn't expect every project to be easy.\n\nTo conclude, the interview was interesting and encouraged me to keep improving my own work.", "cue": "题目：Describe an interview you watched and found interesting.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《宫崎骏广告描述》。虽然聊天标题写广告，较晚内容明确是 interview。主题名称按实际媒介判断。\n\n\n一分钟笔记：Miyazaki / online interview / ideas / films + drawings / copied pictures / patience / motivated。\n\n广告题需要另一套内容：它宣传什么、在哪看到、人物怎样出现、广告效果。旧回答提议“宫崎骏展览广告”，你未在所读用户消息里确认具体广告，不将其写成已发生的事实。\n", "question": "Describe an interview you watched and found interesting."}, {"id": "6-16", "title": "07 SSD：技术问题与共同解决", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《电脑硬盘更换挑战》。你提出过“和朋友原本看电影、电脑卡、买硬盘、一起装”的故事。旧助手改成“提前网上买好 SSD、维修店关闭”，这两个版本不能混用。本稿只保留共同核心；何时买、是否装成功请按真实经历确认。\n\n> When I saw this topic, the first experience that popped up in my mind was a time when my friend and I tried to install a new SSD in my computer.\n>\n> To tell you more about it, we had originally planned to watch a film together. But the computer was running very slowly, and its storage space was almost full. I had been thinking about upgrading it, so we decided to work on the problem.\n>\n> Speaking of what we did, we looked for a tutorial and followed the instructions step by step. My friend helped me check each stage. I was nervous because I didn't want to damage the computer, and there were several things I didn't understand at first.\n>\n> As for the turning point, we stopped rushing and checked the instructions more carefully. Working together made the task feel less stressful than trying to do everything on my own.\n>\n> When it comes to how I felt, I enjoyed having someone to help me. Even though the evening didn't go as planned, we spent time solving a problem together, and that made it memorable.\n>\n> To conclude, the experience showed me the value of clear instructions, patience and teamwork when dealing with technology.\n\n一分钟笔记：film planned / computer slow / storage full / SSD / tutorial / check steps / nervous → calmer / teamwork。\n\n若确认安装成功：After we installed it, the computer worked normally again. 若没成功：We couldn't finish it ourselves, so we asked for help later. 挑真实结局。\n\nstorage 是存储空间；RAM 是运行内存。换 SSD 不自动解决所有“电脑卡”的问题。本段是口语故事，不是维修指导。\n\n", "answers": "When I saw this topic, the first experience that popped up in my mind was a time when my friend and I tried to install a new SSD in my computer.\n\nTo tell you more about it, we had originally planned to watch a film together. But the computer was running very slowly, and its storage space was almost full. I had been thinking about upgrading it, so we decided to work on the problem.\n\nSpeaking of what we did, we looked for a tutorial and followed the instructions step by step. My friend helped me check each stage. I was nervous because I didn't want to damage the computer, and there were several things I didn't understand at first.\n\nAs for the highlight, we stopped rushing and checked the instructions more carefully. Working together made the task feel less stressful than trying to do everything on my own.\n\nWhen it comes to how I felt, I enjoyed having someone to help me. Even though the evening didn't go as planned, we spent time solving a problem together, and that made it memorable.\n\nTo conclude, the experience showed me the value of clear instructions, patience and teamwork when dealing with technology.", "cue": "题目：Describe a difficult technical problem you tried to solve.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《电脑硬盘更换挑战》。你提出过“和朋友原本看电影、电脑卡、买硬盘、一起装”的故事。旧助手改成“提前网上买好 SSD、维修店关闭”，这两个版本不能混用。本稿只保留共同核心；何时买、是否装成功请按真实经历确认。\n\n\n一分钟笔记：film planned / computer slow / storage full / SSD / tutorial / check steps / nervous → calmer / teamwork。\n\n若确认安装成功：After we installed it, the computer worked normally again. 若没成功：We couldn't finish it ourselves, so we asked for help later. 挑真实结局。\n\nstorage 是存储空间；RAM 是运行内存。换 SSD 不自动解决所有“电脑卡”的问题。本段是口语故事，不是维修指导。\n", "question": "Describe a difficult technical problem you tried to solve."}, {"id": "6-17", "title": "08 实习通勤：1.5 小时、7 点起床、9:30 上班", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《巴黎旅行素材建议》中你亲口提供的暑期实习。时间、郊区到市中心、地铁拥挤可保留。题目若问当前经常走的路，这份过去经历有时间限制。\n\n> When I saw this topic, the first journey that popped up in my mind was my daily commute during a summer internship.\n>\n> To tell you more about it, my home was in the suburbs, while the company was in the city centre. It took about an hour and a half to get there by subway. Work started at 9:30, so I usually had to get up at around seven.\n>\n> Speaking of the journey, the subway was very crowded during the morning rush hour. After getting up early, I still had a long journey before the working day began. That was the part I found most tiring.\n>\n> As for the hardest part, it was spending so much time travelling every day. The journey took up time that I could otherwise have used for resting or doing something I enjoyed.\n>\n> When it comes to how I felt, I had mixed feelings about the internship. I enjoyed learning new things at work, but the commute was exhausting. If I could change one thing, I would live closer to the company.\n>\n> To conclude, the internship was useful, but travelling to work was the part I liked the least.\n\n一分钟笔记：summer internship / suburbs → centre / subway 1.5h / 7:00 → 9:30 / rush hour / tiring / closer。\n\n如果题目是 often take，且实习已经结束，优先改用真实仍在进行的路线；否则明确 It was a trip I used to take every weekday during my internship，理解其仍可能与“现在经常”不完全匹配。\n\n", "answers": "When I saw this topic, the first journey that popped up in my mind was my daily commute during a summer internship.\n\nTo tell you more about it, my home was in the suburbs, while the company was in the city centre. It took about an hour and a half to get there by subway. Work started at 9:30, so I usually had to get up at around seven.\n\nSpeaking of the journey, the subway was very crowded during the morning rush hour. After getting up early, I still had a long journey before the working day began. That was the part I found most tiring.\n\nAs for the highlight, it was spending so much time travelling every day. The journey took up time that I could otherwise have used for resting or doing something I enjoyed.\n\nWhen it comes to how I felt, I had mixed feelings about the internship. I enjoyed learning new things at work, but the commute was exhausting. If I could change one thing, I would live closer to the company.\n\nTo conclude, the internship was useful, but travelling to work was the part I liked the least.", "cue": "题目：Describe a long journey you made regularly in the past.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《巴黎旅行素材建议》中你亲口提供的暑期实习。时间、郊区到市中心、地铁拥挤可保留。题目若问当前经常走的路，这份过去经历有时间限制。\n\n\n一分钟笔记：summer internship / suburbs → centre / subway 1.5h / 7:00 → 9:30 / rush hour / tiring / closer。\n\n如果题目是 often take，且实习已经结束，优先改用真实仍在进行的路线；否则明确 It was a trip I used to take every weekday during my internship，理解其仍可能与“现在经常”不完全匹配。\n", "question": "Describe a long journey you made regularly in the past."}, {"id": "6-18", "title": "09 《飘》：喜欢原著，电影未达期待", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《整理Gone with the Wind》和 Cathy 9 月 28 日原回答。你明确说“不是因为故事长而无聊，而是小说细节难以全部呈现”。不再添加相反理由。\n\n> When I saw this topic, the first movie that popped up in my mind was Gone with the Wind.\n>\n> To tell you more about it, I read the novel when I was in primary school and really enjoyed it. Later, I watched the film version, so I had high expectations because I already loved the story.\n>\n> Speaking of what it is about, it follows Scarlett O'Hara and her life, relationships and struggles. The costumes are gorgeous, and some scenes look stunning. Personally, I could understand why the film is so well known.\n>\n> As for the part I didn't enjoy, some relationships and important details didn't feel as clear as they did in the book. Even though the film is very long, I still felt that it couldn't show everything I had enjoyed in the novel. That made parts of the story difficult for me to follow.\n>\n> When it comes to why I was disappointed, my expectations were probably too high. I wanted the same depth I had found in the book, and the film didn't quite give me that.\n>\n> To conclude, I definitely prefer the book, and the film was disappointing to me as an adaptation.\n\n一分钟笔记：novel first / high expectations / Scarlett / gorgeous costumes / details missing / hard to follow / book preferred。\n\n若题目明确 least favourite，且这符合真实看法，将第一段末补 Among the films I've watched, this is probably my least favourite adaptation，或明确 This is my least favourite film。不要只说 mixed feelings 就认为回答了“最不喜欢”。如果实际上只是有点失望，另一部确实最不喜欢的电影更稳。\n\n", "answers": "When I saw this topic, the first movie that popped up in my mind was Gone with the Wind.\n\nTo tell you more about it, I read the novel when I was in primary school and really enjoyed it. Later, I watched the film version, so I had high expectations because I already loved the story.\n\nSpeaking of what it is about, it follows Scarlett O'Hara and her life, relationships and struggles. The costumes are gorgeous, and some scenes look stunning. Personally, I could understand why the film is so well known.\n\nAs for the highlight of the comparison, some relationships and important details didn't feel as clear as they did in the book. Even though the film is very long, I still felt that it couldn't show everything I had enjoyed in the novel. That made parts of the story difficult for me to follow.\n\nWhen it comes to why I was disappointed, my expectations were probably too high. I wanted the same depth I had found in the book, and the film didn't quite give me that.\n\nTo conclude, I definitely prefer the book, and the film was disappointing to me as an adaptation.", "cue": "题目：Describe a film that did not meet your expectations.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《整理Gone with the Wind》和 Cathy 9 月 28 日原回答。你明确说“不是因为故事长而无聊，而是小说细节难以全部呈现”。不再添加相反理由。\n\n\n一分钟笔记：novel first / high expectations / Scarlett / gorgeous costumes / details missing / hard to follow / book preferred。\n\n若题目明确 least favourite，且这符合真实看法，将第一段末补 Among the films I've watched, this is probably my least favourite adaptation，或明确 This is my least favourite film。不要只说 mixed feelings 就认为回答了“最不喜欢”。如果实际上只是有点失望，另一部确实最不喜欢的电影更稳。\n", "question": "Describe a film that did not meet your expectations."}, {"id": "6-19", "title": "10 《万物生灵》：学英语 → 动物与乡村 → 温暖放松", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "When I saw this topic, the first TV show that popped up in my mind was All Creatures Great and Small, a British TV series.\n\nTo tell you more about it, I first heard about it on social media. People recommended it as an interesting show for learning English, so I started watching it mainly to improve my pronunciation and vocabulary.\n\nSpeaking of the story, it follows a young vet working in the British countryside. He takes care of different animals and gradually gets to know the local community. The story is not only about animals. It also talks about friendship, family and the relationships between people and animals.\n\nAs for the highlight, I became interested in the story itself after a few episodes. At first, I watched it for my English, but it was more heart-warming than I expected. It also reminded me that animals need care and patience.\n\nWhen it comes to why I like it, the countryside and the warm relationships make the show peaceful and relaxing. I can enjoy the story and learn useful English expressions at the same time.\n\nTo conclude, All Creatures Great and Small is both entertaining and meaningful to me, and that is why I enjoy watching it.", "answers": "When I saw this topic, the first TV show that popped up in my mind was All Creatures Great and Small, a British TV series.\n\nTo tell you more about it, I first heard about it on social media. People recommended it as an interesting show for learning English, so I started watching it mainly to improve my pronunciation and vocabulary.\n\nSpeaking of the story, it follows a young vet working in the British countryside. He takes care of different animals and gradually gets to know the local community. The story is not only about animals. It also talks about friendship, family and the relationships between people and animals.\n\nAs for the highlight, I became interested in the story itself after a few episodes. At first, I watched it for my English, but it was more heart-warming than I expected. It also reminded me that animals need care and patience.\n\nWhen it comes to why I like it, the countryside and the warm relationships make the show peaceful and relaxing. I can enjoy the story and learn useful English expressions at the same time.\n\nTo conclude, All Creatures Great and Small is both entertaining and meaningful to me, and that is why I enjoy watching it.", "cue": "最新主版本：All Creatures Great and Small。\n\n一句话主线：social media → learn English → young vet / countryside / animals → heart-warming → care and patience → peaceful and relaxing。\n\n同一结构：背景 → 内容 → 亮点与影响 → 喜欢的原因 → 收尾。", "question": "Describe a TV programme you enjoy watching."}, {"id": "6-20", "title": "11 淘宝：从浏览到比较价格和评价", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：《宫崎骏广告描述》中的你本人原回答。小学约三年级、父母手机上看到、后来购买东西已提及；时间线可核对后统一。\n\n> When I saw this topic, the first app that popped up in my mind was Taobao, an online shopping app.\n>\n> To tell you more about it, I first noticed it on my parents' phone when I was in primary school. Its orange icon caught my attention. At first, I just enjoyed looking at interesting things because I didn't have money to buy them myself.\n>\n> Speaking of how I use it now, I look for things I need and compare different products. I can check prices and read customer reviews without going to several shops. This is useful when I'm busy with my studies.\n>\n> As for the feature I like most, it's being able to see different people's experiences with a product. The reviews don't guarantee that everything is good, but they can help me notice possible problems before I decide.\n>\n> When it comes to why I like it, it saves time and gives me more options. As a student, I also find it helpful to compare prices and stay within my budget.\n>\n> To conclude, Taobao is a practical app for me because it makes everyday shopping easier to organise.\n\n一分钟笔记：parents' phone / primary school / orange icon / browse → buy / compare prices / reviews / student budget。\n\napp 不是 outfit；caught my attention 不是 contracted by the UI。问第一次使用的年龄，优先说年龄，不只讲优点。\n\n", "answers": "When I saw this topic, the first app that popped up in my mind was Taobao, an online shopping app.\n\nTo tell you more about it, I first noticed it on my parents' phone when I was in primary school. Its orange icon caught my attention. At first, I just enjoyed looking at interesting things because I didn't have money to buy them myself.\n\nSpeaking of how I use it now, I look for things I need and compare different products. I can check prices and read customer reviews without going to several shops. This is useful when I'm busy with my studies.\n\nAs for the highlight, it's being able to see different people's experiences with a product. The reviews don't guarantee that everything is good, but they can help me notice possible problems before I decide.\n\nWhen it comes to why I like it, it saves time and gives me more options. As a student, I also find it helpful to compare prices and stay within my budget.\n\nTo conclude, Taobao is a practical app for me because it makes everyday shopping easier to organise.", "cue": "题目：Describe a useful app you use.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：《宫崎骏广告描述》中的你本人原回答。小学约三年级、父母手机上看到、后来购买东西已提及；时间线可核对后统一。\n\n\n一分钟笔记：parents' phone / primary school / orange icon / browse → buy / compare prices / reviews / student budget。\n\napp 不是 outfit；caught my attention 不是 contracted by the UI。问第一次使用的年龄，优先说年龄，不只讲优点。\n", "question": "Describe a useful app you use."}, {"id": "6-21", "title": "12 树屋：网上见过，想短期入住", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：[项目《树屋》分享聊天](https://chatgpt.com/share/6acb6964-ef0c-83ec-919c-f00789b45e8c)。目前页面主要是旧整理稿和你的框架请求。具体位置和设施来自已有练习稿，属于待核对描述，不当作已实地验证的建筑资料。\n\n> When I saw this topic, the first building that popped up in my mind was a tree house I saw online.\n>\n> To tell you more about it, I found it on a travel website. It was in a forest, far from the city. Personally, I was attracted by its design because it looked very different from an ordinary house.\n>\n> Speaking of what it looked like, it was mainly made of wood and stood high above the ground. There was a wooden ladder and some large windows overlooking the trees. I don't know much about its history, but it looked like an interesting place to stay for a holiday.\n>\n> As for what I would do there, I'd like to spend a few days enjoying the surroundings and taking photos. As a design student, I would also enjoy looking more closely at the building itself.\n>\n> When it comes to why I like it, it seems peaceful and close to nature. However, it might be inconvenient for everyday life because shops and other facilities could be far away.\n>\n> To conclude, I would love to stay there for a short holiday, although I wouldn't choose it as my permanent home.\n\n一分钟笔记：online / forest / wood / high / ladder + windows / photos / quiet / short holiday。\n\n题目若是“想长期居住的地方”，结尾不能又说不会长期住；需要另选地点，或真实调整意愿。不要对所有 building 题无条件套用。\n\n", "answers": "When I saw this topic, the first building that popped up in my mind was a tree house I saw online.\n\nTo tell you more about it, I found it on a travel website. It was in a forest, far from the city. Personally, I was attracted by its design because it looked very different from an ordinary house.\n\nSpeaking of what it looked like, it was mainly made of wood and stood high above the ground. There was a wooden ladder and some large windows overlooking the trees. I don't know much about its history, but it looked like an interesting place to stay for a holiday.\n\nAs for the highlight, I'd like to spend a few days enjoying the surroundings and taking photos. As a design student, I would also enjoy looking more closely at the building itself.\n\nWhen it comes to why I like it, it seems peaceful and close to nature. However, it might be inconvenient for everyday life because shops and other facilities could be far away.\n\nTo conclude, I would love to stay there for a short holiday, although I wouldn't choose it as my permanent home.", "cue": "题目：Describe an unusual building you would like to stay in.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：[项目《树屋》分享聊天](https://chatgpt.com/share/6acb6964-ef0c-83ec-919c-f00789b45e8c)。目前页面主要是旧整理稿和你的框架请求。具体位置和设施来自已有练习稿，属于待核对描述，不当作已实地验证的建筑资料。\n\n\n一分钟笔记：online / forest / wood / high / ladder + windows / photos / quiet / short holiday。\n\n题目若是“想长期居住的地方”，结尾不能又说不会长期住；需要另选地点，或真实调整意愿。不要对所有 building 题无条件套用。\n", "question": "Describe an unusual building you would like to stay in."}, {"id": "6-22", "title": "13 《大鱼之道》：迁徙与下一代", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：[项目《大鱼之道故事解析》](https://chatgpt.com/share/6acb6953-75f8-83ec-a093-2cbfdb53aa57)。你亲口说沈石溪、读于小学、教师推荐、鱼迁徙为了下一代。鱼种、具体地点及结局在旧助手稿中有补充，本稿不补未经本人核对的结局。\n\n> When I saw this topic, the first story that popped up in my mind was a Chinese animal story called Da Yu Zhi Dao, written by Shen Shixi.\n>\n> To tell you more about it, I first read it when I was in primary school. His animal stories were popular at school, and our teachers often recommended them. Personally, I found stories about animals easy to become interested in.\n>\n> Speaking of the story, it is about a large fish making a difficult journey to another place to lay eggs. The fish has to keep moving despite the difficulties. The part I remember most is that the journey is connected with the survival of the next generation.\n>\n> As for the highlight, it was the fish's determination. I wasn't just reading about an animal moving from one place to another. I was thinking about how much effort it made for its young.\n>\n> When it comes to why I remember it, I found it touching. It made me think more carefully about animals and the challenges they face. It also reminded me that important goals sometimes require patience and effort.\n>\n> To conclude, it is a meaningful story that has stayed in my memory since childhood.\n\n一分钟笔记：Da Yu Zhi Dao / Shen Shixi / primary school / teacher / fish / migrate + eggs / next generation / determination。\n\n书名可用中文拼音后解释，不必自创 Big Fish Road。migrate /maɪˈɡreɪt/；lay eggs；next generation。故事里的表达不当作动物行为科学事实。\n\n", "answers": "When I saw this topic, the first story that popped up in my mind was a Chinese animal story called Da Yu Zhi Dao, written by Shen Shixi.\n\nTo tell you more about it, I first read it when I was in primary school. His animal stories were popular at school, and our teachers often recommended them. Personally, I found stories about animals easy to become interested in.\n\nSpeaking of the story, it is about a large fish making a difficult journey to another place to lay eggs. The fish has to keep moving despite the difficulties. The part I remember most is that the journey is connected with the survival of the next generation.\n\nAs for the highlight, it was the fish's determination. I wasn't just reading about an animal moving from one place to another. I was thinking about how much effort it made for its young.\n\nWhen it comes to why I remember it, I found it touching. It made me think more carefully about animals and the challenges they face. It also reminded me that important goals sometimes require patience and effort.\n\nTo conclude, it is a meaningful story that has stayed in my memory since childhood.", "cue": "题目：Describe an interesting animal story you read.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：[项目《大鱼之道故事解析》](https://chatgpt.com/share/6acb6953-75f8-83ec-a093-2cbfdb53aa57)。你亲口说沈石溪、读于小学、教师推荐、鱼迁徙为了下一代。鱼种、具体地点及结局在旧助手稿中有补充，本稿不补未经本人核对的结局。\n\n\n一分钟笔记：Da Yu Zhi Dao / Shen Shixi / primary school / teacher / fish / migrate + eggs / next generation / determination。\n\n书名可用中文拼音后解释，不必自创 Big Fish Road。migrate /maɪˈɡreɪt/；lay eggs；next generation。故事里的表达不当作动物行为科学事实。\n", "question": "Describe an interesting animal story you read."}, {"id": "6-23", "title": "14 光污染新规定：控制不必要的灯光", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：[项目《减少光污染规定》](https://chatgpt.com/share/6acb6998-5f7c-83ec-90da-ccd8f1fcf7c2)。这是你希望引入的规定，不是已经生效的法律；11 点是旧稿中的方案时间，可作为自己的提议。\n\n> When I saw this topic, the first rule that popped up in my mind was a rule to reduce unnecessary lighting at night.\n>\n> To tell you more about it, I would like cities to control very bright advertising screens and lights on buildings. Personally, I think a city should be comfortable to live in as well as attractive to look at.\n>\n> Speaking of the rule itself, shops and offices would turn off unnecessary lights after a set time, such as 11 p.m. Large advertising screens would also reduce their brightness. Important street lights and traffic lights would stay on for safety.\n>\n> As for the changes it could bring, people living nearby might find their bedrooms darker and more comfortable at night. It could also reduce wasted electricity. The aim would be to use lighting more carefully, rather than make the whole city dark.\n>\n> When it comes to why I want this rule, I think residents' needs should be considered. Some businesses might worry about losing attention, so clear guidelines would help them understand what to change.\n>\n> To conclude, I would support a practical rule that balances useful lighting with a more comfortable environment.\n\n一分钟笔记：new rule / screens + buildings / after 11 / unnecessary lights / safety lights stay / darker bedrooms / electricity / balance。\n\n只讲自己的方案和预期，不背未核实法律名称、研究数据。“少光”不自动等于“更安静”，因此不说这项灯光规则必然 make cities quieter。\n\n", "answers": "When I saw this topic, the first rule that popped up in my mind was a rule to reduce unnecessary lighting at night.\n\nTo tell you more about it, I would like cities to control very bright advertising screens and lights on buildings. Personally, I think a city should be comfortable to live in as well as attractive to look at.\n\nSpeaking of the rule itself, shops and offices would turn off unnecessary lights after a set time, such as 11 p.m. Large advertising screens would also reduce their brightness. Important street lights and traffic lights would stay on for safety.\n\nAs for the highlight, people living nearby might find their bedrooms darker and more comfortable at night. It could also reduce wasted electricity. The aim would be to use lighting more carefully, rather than make the whole city dark.\n\nWhen it comes to why I want this rule, I think residents' needs should be considered. Some businesses might worry about losing attention, so clear guidelines would help them understand what to change.\n\nTo conclude, I would support a practical rule that balances useful lighting with a more comfortable environment.", "cue": "题目：Describe a new rule you would like to introduce.\n\n统一路线：对象与背景 → 内容或经过 → 亮点 → 原因/感受 → 收尾。\n\n\n来源：[项目《减少光污染规定》](https://chatgpt.com/share/6acb6998-5f7c-83ec-90da-ccd8f1fcf7c2)。这是你希望引入的规定，不是已经生效的法律；11 点是旧稿中的方案时间，可作为自己的提议。\n\n\n一分钟笔记：new rule / screens + buildings / after 11 / unnecessary lights / safety lights stay / darker bedrooms / electricity / balance。\n\n只讲自己的方案和预期，不背未核实法律名称、研究数据。“少光”不自动等于“更安静”，因此不说这项灯光规则必然 make cities quieter。\n", "question": "Describe a new rule you would like to introduce."}, {"id": "6-24", "title": "15 月饼与中秋节：你的生日记忆", "part": "P2", "group": "06 P2 素材卡与练习稿", "body": "\n来源：[项目《月饼与中秋节》](https://chatgpt.com/share/6acb69a7-f6b8-83ec-a7d3-cd499fdab4c7)。你亲口说生日在中秋节、小时候期待亲戚团聚和生日礼物。使用传统农历生日的语境，不延伸成每年公历日期固定重合。\n\n> When I saw this topic, the first food that popped up in my mind was mooncakes, which people eat during the Mid-Autumn Festival.\n>\n> To tell you more about them, mooncakes are a traditional Chinese pastry. They are usually round and have different fillings, such as egg yolk, nuts or sweet bean paste. Personally, they are special to me because my birthday falls on the Mid-Autumn Festival.\n>\n> Speaking of my childhood memories, I always looked forward to that day. I could see my relatives, spend time with my family and receive birthday gifts. So the festival felt like both a family celebration and a birthday celebration for me.\n>\n> As for why people eat mooncakes, they are part of the festival tradition, and their round shape is associated with family reunion. Sharing them is also a way to express good wishes.\n>\n> When it comes to how I feel about them, I think of the warm moments I spent with my family. The food matters to me because of those memories, rather than just its taste.\n>\n> To conclude, mooncakes remind me of my childhood and make this festival especially meaningful to me.\n\n一分钟笔记：mooncakes / round + fillings / Mid-Autumn / birthday / relatives + gifts / reunion / memories。\n\n迁移：特殊食物说明 appearance + ingredients + occasion；庆祝活动强调当日过程；童年记忆讲一幅真实画面；礼物题需说具体礼物，不能只说收到很多礼物。无需硬讲嫦娥传说。\n\n", "answers": "When I saw this topic, the first food that popped up in my mind was mooncakes, which people eat during the Mid-Autumn Festival.\n\nTo tell you more about them, mooncakes are a traditional Chinese pastry. They are usually round and have different fillings, such as egg yolk, nuts or sweet bean paste. Personally, they are special to me because my birthday falls on the Mid-Autumn Festival.\n\nSpeaking of my childhood memories, I always looked forward to that day. I could see my relatives, spend time with my family and receive birthday gifts. So the festival felt like both a family celebration and a birthday celebration for me.\n\nAs for the highlight, they are part of the festival tradition, and their round shape is associated with family reunion. Sharing them is also a way to express good wishes.\n\nWhen it comes to how I feel about them, I think of the warm moments I spent with my family. The food matters to me because of those memories, rather than just its taste.\n\nTo conclude, mooncakes remind me of my childhood and make this festival especially
